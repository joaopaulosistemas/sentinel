name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**", "evidencias/**"]   # só documentação: não gasta minutos
  pull_request:
  schedule:
    - cron: "41 7 * * 0"   # domingo: roda também a calibração pesada
  workflow_dispatch:   # o agente Sentinel Evolution dispara o CI na branch evolucao/* que abriu

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API, CLI e pacotes de regras
    runs-on: ubuntu-latest
    env:
      SEMGREP_SEND_METRICS: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # alguns testes (PackToolTest, RulePlaygroundServiceTest) executam o Semgrep de verdade
      - run: pip install semgrep==1.172.0
      - name: Compilar e testar
        run: bash scripts/ci-anotar.sh "Maven" mvn -B -ntp verify

  regras:
    name: Testes Semgrep dos pacotes
    runs-on: ubuntu-latest
    env:
      SEMGREP_SEND_METRICS: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install semgrep==1.172.0
      - name: Rodar os testes de cada pacote
        run: |
          falhas=0
          anotar() {  # anotar <titulo> <arquivo-de-saida>: publica o final da saída como anotação de erro
            local resumo
            resumo="$(grep -E "✖|Missed|FALHOU|ERRO|rror" "$2" | head -20)"
            [ -z "$resumo" ] && resumo="$(tail -20 "$2")"
            resumo="${resumo//'%'/'%25'}"; resumo="${resumo//$'\n'/'%0A'}"
            echo "::error title=$1::${resumo:0:3500}"
          }
          for p in audit-rules/packs/*/; do
            [ -d "${p}tests" ] && [ -d "${p}rules" ] || continue
            tmp=$(mktemp -d)
            for f in "${p}"rules/*.yml; do
              if [[ "$f" == *-sql.yml ]]; then
                # regras de SQL/XML não são avaliadas pelo `semgrep --test`: têm verificador próprio
                if ! python3 audit-rules/scripts/testar-regex-sql.py "$f" "${p}tests" > "$tmp.sql.log" 2>&1; then
                  anotar "SQL $f" "$tmp.sql.log"; falhas=1
                fi
              else
                cp "$f" "$tmp"/
              fi
            done
            if semgrep --test --metrics=off --disable-version-check --config "$tmp" "${p}tests" > "$tmp.log" 2>&1; then
              echo "::notice title=Semgrep $p::passou"
            else
              anotar "Semgrep $p" "$tmp.log"; falhas=1
            fi
            rm -rf "$tmp" "$tmp.log" "$tmp.sql.log"
          done
          exit $falhas

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: audit-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: audit-dashboard/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test --if-present
      - run: npm run build

  imagens:
    name: Imagens Docker e Helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construir a imagem da API
        run: |
          if ! docker build -f audit-api/Dockerfile -t sentinel-audit-api:ci . > build-api.log 2>&1; then
            r="$(grep -E "ERROR|error|failed|Failed" build-api.log | head -15)"; [ -z "$r" ] && r="$(tail -15 build-api.log)"
            r="${r//'%'/'%25'}"; r="${r//$'\n'/'%0A'}"
            echo "::error title=Imagem da API falhou::${r:0:3500}"; exit 1
          fi
      - name: Construir a imagem do dashboard
        run: |
          if ! docker build -t sentinel-audit-dashboard:ci audit-dashboard > build-dash.log 2>&1; then
            r="$(grep -E "ERROR|error|failed|Failed" build-dash.log | head -15)"; [ -z "$r" ] && r="$(tail -15 build-dash.log)"
            r="${r//'%'/'%25'}"; r="${r//$'\n'/'%0A'}"
            echo "::error title=Imagem do dashboard falhou::${r:0:3500}"; exit 1
          fi
      - name: Teste ponta a ponta (API + Postgres + auditoria real)
        run: bash scripts/e2e.sh
      - uses: azure/setup-helm@v4
      - name: Validar o chart Helm
        run: |
          if ! (helm lint deploy/helm/sentinel --set secrets.dbPassword=ci && helm template sentinel deploy/helm/sentinel --set secrets.dbPassword=ci > /dev/null) > helm.log 2>&1; then
            r="$(tail -15 helm.log)"; r="${r//'%'/'%25'}"; r="${r//$'\n'/'%0A'}"
            echo "::error title=Helm falhou::${r:0:3500}"; exit 1
          fi

  escopo-agente:
    name: Escopo dos PRs do agente
    runs-on: ubuntu-latest
    # só vale para branches evolucao/*: o agente não pode mexer em CI, scripts de e2e nem em segredos
    if: startsWith(github.head_ref || github.ref_name, 'evolucao/')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Conferir os arquivos alterados
        run: |
          base="origin/main"
          proibidos="$(git diff --name-only "$base"...HEAD | grep -E '^(\.github/|scripts/(e2e|evolucao-entrada|ci-anotar)\.sh$|\.gitignore$|\.env)' || true)"
          if [ -n "$proibidos" ]; then
            r="${proibidos//$'\n'/%0A}"
            echo "::error title=PR do agente mexeu em arquivo protegido::${r}"
            exit 1
          fi
          echo "ok: nenhum arquivo protegido alterado"

  calibracao:
    name: Calibração em vários repositórios
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # pesado (~15 min): só semanalmente, sob demanda e nos PRs do agente (que mexem em regras); não em todo push
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'evolucao/'))
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Construir a imagem da API
        run: docker build -f audit-api/Dockerfile -t sentinel-audit-api:ci . > build-api.log 2>&1 || { tail -15 build-api.log; exit 1; }
      - name: Auditar os repositórios de teste (e o próprio Sentinel)
        env:
          GIT_TOKEN: ${{ github.token }}
        run: bash scripts/calibracao.sh
      - name: Baixar o resultado da última execução verde da main
        run: |
          id="$(gh run list -R "$GITHUB_REPOSITORY" --workflow CI --branch main --status success --limit 1 --json databaseId -q '.[0].databaseId')"
          mkdir -p anterior
          if [ -n "$id" ]; then gh run download "$id" -R "$GITHUB_REPOSITORY" -n calibracao-historico -D anterior || echo "sem histórico anterior"; else echo "sem execução anterior"; fi
      - name: Comparar e conferir as verdades conhecidas
        run: python3 scripts/comparar-calibracao.py calibracao-saida anterior audit-rules/calibracao/esperado.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibracao-historico
          path: calibracao-saida
          retention-days: 90

