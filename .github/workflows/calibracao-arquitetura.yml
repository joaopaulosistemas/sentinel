name: Calibração de arquitetura
on:
  pull_request:
    paths: ["scripts/calibracao-arquitetura.sh", ".github/workflows/calibracao-arquitetura.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  calibrar:
    name: Ruído dos pacotes de arquitetura
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Construir a imagem da API
        run: docker buildx build --load -f audit-api/Dockerfile -t sentinel-audit-api:ci . > build-api.log 2>&1 || { tail -15 build-api.log; exit 1; }
      - name: Auditar os projetos de referência
        run: >
          bash scripts/calibracao-arquitetura.sh
          thombergs/buckpal:arquitetura-hexagonal
          spring-projects/spring-petclinic:arquitetura-hexagonal
          nrwl/nx-examples:angular-nx
          feature-sliced/examples:frontend-em-camadas
