name: Observabilidade
on:
  pull_request:
    paths: ["deploy/observabilidade/**", "scripts/verificar-observabilidade.sh", ".github/workflows/observabilidade.yml", "audit-api/src/main/java/com/sentinel/audit/service/AuditMetrics.java"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilha:
    name: Pilha de observabilidade de ponta a ponta
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COMPOSE_PROJECT_NAME: sentinel
      POSTGRES_PASSWORD: ci-observabilidade
      ALLOW_OPEN_API: "true"   # a pilha de teste sobe sem API_KEY
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Construir a imagem da API
        run: docker buildx build --load -f audit-api/Dockerfile -t sentinel-audit-api . > build-api.log 2>&1 || { tail -15 build-api.log; exit 1; }
      - name: Versões do OpenTelemetry na imagem (para conferir CVEs das auditorias)
        run: docker run --rm --entrypoint sh sentinel-audit-api -c 'find / -name "*opentelemetry-api-1*.jar" -o -name "*opentelemetry-sdk-1*.jar" 2>/dev/null | sed "s|.*/||" | sort -u'
      - name: Validar a configuração do Alertmanager e as regras do Prometheus
        run: |
          for c in alertmanager alertmanager-slack alertmanager-teams; do
            docker run --rm --entrypoint amtool -v "$PWD/deploy/observabilidade/$c.yml:/a.yml:ro" prom/alertmanager:v0.28.1 check-config /a.yml
          done
          docker run --rm --entrypoint promtool -v "$PWD/deploy/observabilidade:/c:ro" prom/prometheus:v2.55.1 check rules /c/alertas.yml
      - name: Subir a pilha (API, banco, Collector, Prometheus, Loki, Tempo e Grafana)
        run: >
          docker compose -f docker-compose.yml -f deploy/observabilidade/docker-compose.yml up -d --no-build
          postgres audit-api otel-collector prometheus alertmanager loki tempo grafana
      - name: Conferir métricas, logs, traces e painel
        run: bash scripts/verificar-observabilidade.sh
      - name: Derrubar a pilha
        if: always()
        run: docker compose -f docker-compose.yml -f deploy/observabilidade/docker-compose.yml down -v
