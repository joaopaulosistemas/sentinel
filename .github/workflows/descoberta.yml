name: Sentinel Descoberta

# Toda segunda-feira (e sob demanda): escolhe repositórios públicos novos, audita com a API real,
# gera o relatório bruto e deixa o agente revisar uma amostra, cruzar os resultados e abrir PRs de evolução
# (regras, analisadores, relatório da rodada). Usa a mesma credencial do Sentinel Evolution.

on:
  schedule:
    - cron: "17 9 * * 1"
  # checkov:skip=CKV_GHA_7: os inputs só definem quantos/quais repositórios públicos auditar; nenhum artefato de release é gerado
  workflow_dispatch:
    inputs:
      quantidade:
        description: "Quantos repositórios novos auditar"
        required: false
        default: "6"
      perfil:
        description: "java-spring | angular | react | typescript-node | docker-k8s | auto"
        required: false
        default: "auto"

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read

concurrency:
  group: descoberta
  cancel-in-progress: false

jobs:
  auditar:
    name: Descobrir e auditar repositórios novos
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      repos: ${{ steps.escolher.outputs.repos }}
    steps:
      - uses: actions/checkout@v4
      - name: Escolher os repositórios
        id: escolher
        env:
          QUANTIDADE: ${{ inputs.quantidade || '6' }}
          PERFIL: ${{ inputs.perfil || 'auto' }}
        run: |
          bash scripts/descobrir-repos.sh "$QUANTIDADE" "$PERFIL" > repos.txt
          cat repos.txt
          if [ ! -s repos.txt ]; then echo "::warning title=Descoberta::nenhum repositório novo encontrado"; fi
          echo "repos=$(tr '\n' ' ' < repos.txt)" >> "$GITHUB_OUTPUT"
      - name: Construir a imagem da API
        if: steps.escolher.outputs.repos != ''
        run: docker build -f audit-api/Dockerfile -t sentinel-audit-api:ci . > build-api.log 2>&1 || { tail -15 build-api.log; exit 1; }
      - name: Auditar
        if: steps.escolher.outputs.repos != ''
        env:
          SAIDA: descoberta
          GUARDAR_ACHADOS: "1"
          TOLERAR: "1"
        run: bash scripts/calibracao.sh $(cat repos.txt | tr '\n' ' ')
      - name: Relatório bruto
        if: steps.escolher.outputs.repos != ''
        run: |
          rm -f descoberta/.achados.tmp
          python3 scripts/relatorio-descoberta.py descoberta > descoberta/relatorio-bruto.md
          cat descoberta/relatorio-bruto.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: steps.escolher.outputs.repos != ''
        with:
          name: descoberta
          path: descoberta
          retention-days: 30

  evoluir:
    name: Agente revisa, cruza e propõe evolução
    needs: auditar
    if: needs.auditar.outputs.repos != ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - name: Conferir o segredo
        id: chave
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::warning title=Sentinel Descoberta::Nenhum segredo: o agente não rodou (o relatório bruto está no artefato)."
            echo "pular=true" >> "$GITHUB_OUTPUT"
          else
            echo "pular=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.chave.outputs.pular == 'false'
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        if: steps.chave.outputs.pular == 'false'
        with:
          name: descoberta
          path: descoberta
      - uses: actions/setup-java@v4
        if: steps.chave.outputs.pular == 'false'
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-python@v5
        if: steps.chave.outputs.pular == 'false'
        with:
          python-version: "3.12"
      - name: Instalar o Semgrep (mesma versão do CI)
        if: steps.chave.outputs.pular == 'false'
        run: pip install semgrep==1.172.0
      - name: Configurar o autor dos commits
        if: steps.chave.outputs.pular == 'false'
        run: |
          git config user.name "sentinel-evolution[bot]"
          git config user.email "sentinel-evolution@users.noreply.github.com"
      - name: Agente
        id: agente
        if: steps.chave.outputs.pular == 'false'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            Siga as instruções de .github/agente/sentinel-descoberta.md. A entrada está na pasta descoberta/.
          claude_args: >-
            --max-turns 140
            --disallowedTools "Bash(git push origin main:*),Bash(git push --force:*),Bash(git push -f:*),Bash(npm:*),Bash(npx:*),Bash(curl:*),Bash(wget:*)"
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git:*),Bash(gh pr create:*),Bash(gh pr list:*),Bash(gh workflow run:*),Bash(semgrep:*),Bash(python3:*),Bash(mvn:*),Bash(mktemp:*),Bash(mkdir:*),Bash(cp:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(sed:*),Bash(wc:*)"

      - name: Resumo do agente (anotação)
        if: always() && steps.chave.outputs.pular == 'false'
        env:
          ARQ: ${{ steps.agente.outputs.execution_file }}
        run: |
          [ -f "$ARQ" ] || { echo "::notice title=Agente::sem arquivo de execução"; exit 0; }
          python3 - <<'PY'
          import json, os
          d = json.load(open(os.environ["ARQ"]))
          fim = [x for x in d if isinstance(x, dict) and x.get("type") == "result"]
          r = fim[-1] if fim else {}
          txt = (r.get("result") or "sem resultado").replace("\n", "%0A")
          print("::notice title=Agente (%s turnos, %s)::%s" % (r.get("num_turns"), r.get("subtype"), txt[:3000]))
          PY
