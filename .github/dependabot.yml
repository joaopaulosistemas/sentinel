# Atualização automática das dependências: um PR por ecossistema, no máximo 5 abertos por vez.
# As versões fixadas das ferramentas na imagem (Gitleaks, Betterleaks, PMD, Opengrep, Checkov...) ficam em ARG no Dockerfile
# com SHA-256 e são revisadas à mão (docs/referencia/versoes-fixadas.md); o Dependabot cuida do que tem manifesto.
version: 2
updates:
  - package-ecosystem: maven
    directory: /audit-api
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: maven
    directory: /audit-cli
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /audit-dashboard
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /audit-rules/lint/eslint
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    ignore:
      # TypeScript 7 não tem API programática (vem no 7.1): typescript-eslint, dependency-cruiser e o Angular não rodam nele.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /audit-rules/lint/stylelint
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    ignore:
      # O standard 41 exige Stylelint 18 e o standard-scss 17 só aceita o 17 (ver docs/referencia/versoes-fixadas.md).
      - dependency-name: stylelint
        update-types: ["version-update:semver-major"]
      - dependency-name: stylelint-config-standard
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /audit-rules/lint/jscpd
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /audit-rules/lint/extras
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    ignore:
      # TypeScript 7 não tem API programática (vem no 7.1): typescript-eslint, dependency-cruiser e o Angular não rodam nele.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /audit-api
    schedule: { interval: weekly, day: monday }
    ignore:
      # Major de imagem base muda o runtime: só à mão e só LTS (o Java 26 e o Node 27 não são LTS), depois de validar a imagem.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      - dependency-name: maven
        update-types: ["version-update:semver-major"]
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /audit-dashboard
    schedule: { interval: weekly, day: monday }
    ignore:
      # Major de imagem base muda o runtime: só à mão e só LTS (o Java 26 e o Node 27 não são LTS), depois de validar a imagem.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      - dependency-name: maven
        update-types: ["version-update:semver-major"]
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
