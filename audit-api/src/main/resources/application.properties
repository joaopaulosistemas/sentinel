# ============================================================
# Sentinel Audit Tool — configuração da API
# Todas as opções abaixo podem ser sobrescritas por variáveis de ambiente.
# ============================================================

# --- Datasource ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:sentinel_audit}
quarkus.datasource.password=${DB_PASSWORD:sentinel_audit}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/sentinel_audit}
quarkus.datasource.jdbc.acquisition-timeout=30
quarkus.datasource.jdbc.initial-size=1
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.max-size=10

# --- Hibernate ---
# "update" preserva o histórico de auditorias entre reinícios.
# Use DB_SCHEMA_MODE=drop-and-create SOMENTE para recomeçar do zero em desenvolvimento.
quarkus.hibernate-orm.database.generation=${DB_SCHEMA_MODE:update}
quarkus.hibernate-orm.jdbc.timezone=UTC
# Grava os achados de uma auditoria em lotes (o persist em laço vira poucos INSERTs, não um por achado).
quarkus.hibernate-orm.jdbc.statement-batch-size=50

# --- HTTP ---
quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:3000}
quarkus.http.cors.headers=Content-Type,Authorization,X-API-Key
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS

# --- Segurança ---
# Se definida, TODA a API (exceto /api/v1/health) exige X-API-Key ou Authorization: Bearer.
# Sem ela a API fica aberta: use apenas em desenvolvimento local.
sentinel.audit.api-key=${API_KEY:}
# Chave que cifra, no banco, os tokens Git cadastrados em cada sistema. Sem ela, usa a API_KEY.
sentinel.audit.secrets-key=${SECRETS_KEY:}

# --- OpenAPI / Swagger UI (somente em dev/test; em produção fica desligado) ---
quarkus.swagger-ui.path=/swagger-ui
quarkus.smallrye-openapi.info-title=Sentinel Audit Tool API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API para auditoria de código

# --- Git / Clone ---
sentinel.audit.git.clone-dir=${CLONE_DIR:${java.io.tmpdir}/sentinel-audit}
# Hosts que recebem o token. O token nunca é enviado a outros hosts.
sentinel.audit.git.clone-timeout-seconds=${GIT_CLONE_TIMEOUT:300}
# Quantos commits baixar para procurar segredos já removidos (0 ou 1 = clone raso, sem varredura de histórico)
sentinel.audit.git.history-timeout-seconds=${GIT_HISTORY_TIMEOUT:120}

# --- Semgrep ---
# Caminhos/configs separados por vírgula. Vazio = usa as regras dos pacotes ativos (audit-rules/packs), senão p/default.
sentinel.audit.semgrep.config=${SEMGREP_CONFIG:}
sentinel.audit.semgrep.timeout-seconds=${SEMGREP_TIMEOUT:600}

# --- Dependências (OSV.dev) ---
# Só nome e versão dos pacotes saem da rede. Em rede fechada: OSV_ENABLED=false (usa a base interna reduzida)
# ou OSV_URL apontando para um espelho interno.
sentinel.audit.osv.enabled=${OSV_ENABLED:true}
sentinel.audit.osv.url=${OSV_URL:https://api.osv.dev}
sentinel.audit.osv.timeout-seconds=${OSV_TIMEOUT:20}

# --- Agendamento e webhooks ---
# Auditorias periódicas (intervalo configurado em cada sistema). Assume UMA instância da API: com réplicas, desligue nas demais.
sentinel.audit.scheduler.enabled=${SCHEDULER_ENABLED:true}
# O segredo dos webhooks de push é cadastrado em cada sistema.

# --- Notificações (Teams / Slack / genérico) ---
# Configuradas em cada sistema (URL, formato, queda mínima de nota, severidade mínima).
