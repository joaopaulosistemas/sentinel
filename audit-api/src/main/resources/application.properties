# ============================================================
# Sentinel Audit Tool — configuração da API
# Todas as opções abaixo podem ser sobrescritas por variáveis de ambiente.
# ============================================================

# --- Datasource ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:sentinel_audit}
quarkus.datasource.password=${DB_PASSWORD:sentinel_audit}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/sentinel_audit}
quarkus.datasource.jdbc.acquisition-timeout=30
quarkus.datasource.jdbc.initial-size=1
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.max-size=10

# --- Hibernate ---
# "update" preserva o histórico de auditorias entre reinícios.
# Use DB_SCHEMA_MODE=drop-and-create SOMENTE para recomeçar do zero em desenvolvimento.
quarkus.hibernate-orm.database.generation=${DB_SCHEMA_MODE:update}
quarkus.hibernate-orm.jdbc.timezone=UTC
# Grava os achados de uma auditoria em lotes (o persist em laço vira poucos INSERTs, não um por achado).
quarkus.hibernate-orm.jdbc.statement-batch-size=50

# --- HTTP ---
quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:3000}
quarkus.http.cors.headers=Content-Type,Authorization,X-API-Key
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS

# --- Segurança ---
# Se definida, TODA a API (exceto /api/v1/health) exige X-API-Key ou Authorization: Bearer.
# Sem ela a API fica aberta: use apenas em desenvolvimento local.
sentinel.audit.api-key=${API_KEY:}
# Chave que cifra, no banco, os tokens Git cadastrados em cada sistema. Sem ela, usa a API_KEY.
sentinel.audit.secrets-key=${SECRETS_KEY:}

# --- OpenAPI / Swagger UI (somente em dev/test; em produção fica desligado) ---
quarkus.swagger-ui.path=/swagger-ui
quarkus.smallrye-openapi.info-title=Sentinel Audit Tool API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API para auditoria de código

# --- Git / Clone ---
sentinel.audit.git.clone-dir=${CLONE_DIR:${java.io.tmpdir}/sentinel-audit}
# Hosts que recebem o token. O token nunca é enviado a outros hosts.
sentinel.audit.git.clone-timeout-seconds=${GIT_CLONE_TIMEOUT:300}
# Raiz das pastas locais auditáveis (origem "pasta local"). Vazio = desligada. No Docker: /projects (volume somente leitura).
sentinel.audit.local.root=${SENTINEL_LOCAL_ROOT:}
# Quantos commits baixar para procurar segredos já removidos (0 ou 1 = clone raso, sem varredura de histórico)
sentinel.audit.git.history-timeout-seconds=${GIT_HISTORY_TIMEOUT:120}

# --- Semgrep ---
# Caminhos/configs separados por vírgula. Vazio = usa as regras dos pacotes ativos (audit-rules/packs), senão p/default.
sentinel.audit.semgrep.config=${SEMGREP_CONFIG:}
sentinel.audit.semgrep.timeout-seconds=${SEMGREP_TIMEOUT:600}

# --- Dependências (OSV.dev) ---
# Só nome e versão dos pacotes saem da rede. Em rede fechada: OSV_ENABLED=false (usa a base interna reduzida)
# ou OSV_URL apontando para um espelho interno.
sentinel.audit.osv.enabled=${OSV_ENABLED:true}
sentinel.audit.osv.url=${OSV_URL:https://api.osv.dev}
sentinel.audit.osv.timeout-seconds=${OSV_TIMEOUT:20}

# --- Agendamento e webhooks ---
# Auditorias periódicas (intervalo configurado em cada sistema). Assume UMA instância da API: com réplicas, desligue nas demais.
sentinel.audit.scheduler.enabled=${SCHEDULER_ENABLED:true}
# O segredo dos webhooks de push é cadastrado em cada sistema.

# --- Notificações (Teams / Slack / genérico) ---
# Configuradas em cada sistema (URL, formato, queda mínima de nota, severidade mínima).

# ============================================================
# Ligações restauradas (commit cefaf1e as removeu): sem elas as variáveis de ambiente do compose/Helm
# (PACKS_*, TRIVY_*, CLEANCODE_*, ESLINT_*, OIDC_* ...) não chegavam à aplicação. O EnvBindingTest impede a regressão.
# ============================================================

# --- Login corporativo OIDC/Keycloak (opcional) ---
# Exige build com -Poidc e QUARKUS_PROFILE=oidc. Nesse modo deixe API_KEY vazia: a autenticação passa a ser
# o token Bearer do provedor. Health e webhooks continuam públicos (webhooks têm HMAC próprio).
quarkus.oidc.tenant-enabled=false
%oidc.quarkus.oidc.tenant-enabled=true
%oidc.quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL:}
%oidc.quarkus.oidc.client-id=${OIDC_CLIENT_ID:sentinel-audit}
%oidc.quarkus.oidc.application-type=service
%oidc.quarkus.http.auth.permission.public.paths=/api/v1/health/*,/api/v1/webhooks/*,/q/*
%oidc.quarkus.http.auth.permission.public.policy=permit
%oidc.quarkus.http.auth.permission.api.paths=/api/*
%oidc.quarkus.http.auth.permission.api.policy=authenticated

# --- Ferramentas externas (usadas só se o executável estiver no PATH) ---
# Gitleaks: segredos em arquivos e histórico; quando presente, substitui os analisadores internos de segredos.
sentinel.audit.gitleaks.enabled=${GITLEAKS_ENABLED:true}
sentinel.audit.gitleaks.timeout-seconds=${GITLEAKS_TIMEOUT_SECONDS:600}
# Trivy: vulnerabilidades (vuln) e más configurações de IaC/Dockerfile (misconfig). Com "vuln", substitui o SCA interno.
# Em rede fechada: TRIVY_SKIP_DB_UPDATE=true com a base já no cache (TRIVY_CACHE_DIR).
sentinel.audit.trivy.enabled=${TRIVY_ENABLED:true}
sentinel.audit.trivy.scanners=${TRIVY_SCANNERS:vuln,misconfig}

# Evidências offline (dump do esquema, estatísticas do Postgres, cobertura, histograma de memória).
# Pasta com uma subpasta por sistema (nome do sistema em minúsculo e com hífens). Vazio = desligado.
sentinel.audit.evidence.dir=${SENTINEL_EVIDENCE_DIR:}
sentinel.audit.evidence.min-line-coverage=${EVIDENCE_MIN_LINE_COVERAGE:60}
sentinel.audit.trivy.timeout-seconds=${TRIVY_TIMEOUT_SECONDS:900}

# Clean code (métricas textuais: tamanho, parâmetros, complexidade, aninhamento)
sentinel.audit.cleancode.enabled=${CLEANCODE_ENABLED:true}
sentinel.audit.cleancode.max-function-lines=${CLEANCODE_MAX_FUNCTION_LINES:50}
sentinel.audit.cleancode.max-component-lines=${CLEANCODE_MAX_COMPONENT_LINES:100}
sentinel.audit.cleancode.max-parameters=${CLEANCODE_MAX_PARAMETERS:5}
sentinel.audit.cleancode.max-complexity=${CLEANCODE_MAX_COMPLEXITY:10}
sentinel.audit.cleancode.max-nesting=${CLEANCODE_MAX_NESTING:4}
sentinel.audit.cleancode.max-findings=${CLEANCODE_MAX_FINDINGS:300}

# Lint (só rodam se o executável estiver no PATH)
sentinel.audit.pmd.enabled=${PMD_ENABLED:true}
sentinel.audit.pmd.timeout-seconds=${PMD_TIMEOUT_SECONDS:600}
sentinel.audit.pmd.ruleset=${PMD_RULESET:}
sentinel.audit.pmd.max-findings=${PMD_MAX_FINDINGS:500}
sentinel.audit.eslint.enabled=${ESLINT_ENABLED:true}
sentinel.audit.eslint.config=${ESLINT_CONFIG:/opt/eslint/eslint.config.mjs}
sentinel.audit.eslint.timeout-seconds=${ESLINT_TIMEOUT_SECONDS:600}
sentinel.audit.eslint.max-findings=${ESLINT_MAX_FINDINGS:500}

# Pacotes de regras (ver README: "Pacotes de regras"). Sempre inclui audit-rules/packs; estes são adicionais.
sentinel.audit.packs.dirs=${PACKS_DIRS:}
# Repositório Git central de regras (raiz de pacotes + profiles/). Vazio = só pastas locais.
sentinel.audit.packs.git-url=${PACKS_GIT_URL:}
sentinel.audit.packs.git-ref=${PACKS_GIT_REF:main}
sentinel.audit.packs.git-path=${PACKS_GIT_PATH:}
sentinel.audit.packs.cache-dir=${PACKS_CACHE_DIR:/tmp/sentinel-packs}
sentinel.audit.packs.refresh-interval=${PACKS_REFRESH_INTERVAL:10m}
# Ids de pacote a desligar, separados por vírgula
sentinel.audit.packs.disabled=${PACKS_DISABLED:}
# Pacotes podem declarar ferramentas que são EXECUTADAS no servidor (tools/*.yml com "command"). Só ligue com pacotes de confiança.
sentinel.audit.packs.allow-tools=${PACKS_ALLOW_TOOLS:false}


# Integridade dos pacotes: chave pública Ed25519 (Base64) e exigência de assinatura (README: "Assinatura de pacotes")
sentinel.audit.packs.public-key=${PACKS_PUBLIC_KEY:}
# Pacotes embutidos cujas ferramentas de linha de comando podem rodar sem PACKS_ALLOW_TOOLS (só vale para a pasta do produto)
sentinel.audit.packs.trusted-tool-packs=${PACKS_TRUSTED_TOOL_PACKS:market-tools,java-google-style}
sentinel.audit.packs.require-signature=${PACKS_REQUIRE_SIGNATURE:false}

# Laboratório de regras (POST /api/v1/rules/playground): roda o Semgrep sobre texto enviado pelo usuário
sentinel.audit.playground.enabled=${PLAYGROUND_ENABLED:true}
sentinel.audit.playground.timeout-seconds=${PLAYGROUND_TIMEOUT_SECONDS:30}
