# Ajustes do próprio Sentinel para as auditorias do Sentinel (formato: audit-api ProjectConfig).
# Tudo o que sai da nota aparece aqui, com o motivo, em revisão como qualquer outra mudança.
version: 1

# Caminhos que não são código do produto: dados do motor de regras e relatórios. Não entram na auditoria.
exclude:
  # O texto das regras cita de propósito os padrões que elas procuram (ex.: allowPrivilegeEscalation: true).
  - "audit-rules/packs/*/rules/**"
  # Casos de teste das regras: código vulnerável de propósito.
  - "audit-rules/packs/*/tests/**"
  # Exemplos "antes/depois" da remediação: trechos ruins escritos para ensinar.
  - "audit-rules/packs/*/remediation/**"
  - "audit-rules/calibracao/**"
  # Relatórios e triagens que citam trechos de código auditado.
  - "docs/evolucao/**"
  # Projetos de exemplo do Joern: código vulnerável de propósito (e o par seguro), usados só pelo testar.py.
  - "audit-api/joern/testes/**"
  # Gerado por scripts/gerar-arquitetura-html.py a partir do ARQUITETURA.md (o estilo inline é do gerador).
  - "docs/arquitetura/ARQUITETURA.html"
  # Referência do schema para leitura; o schema real é gerado pelo Hibernate.
  - "docs/schema-referencia.sql"

# Achados aceitos: continuam na lista, marcados como suprimidos, e não pesam na nota.
suppress:
  # Os testes do SecretsAnalyzer precisam de chaves e tokens de mentira para provar que ele os encontra.
  - rule: "gitleaks-*"
    path: "audit-api/src/test/**"
    reason: "segredos de mentira usados como caso de teste dos analisadores de segredo"

  # Estas funções devolvem null de propósito: é o sinal de "valor inválido", que o chamador trata
  # (decisão registrada em docs/evolucao/LOG.md, 12.23.1). Trocar por coleção vazia esconderia o erro.
  - rule: "sentinel-java-retorna-null-colecao"
    path: "audit-api/src/main/java/com/sentinel/audit/pack/Versions.java"
    reason: "null significa valor inválido (LOG.md 12.23.1)"
  - rule: "sentinel-java-retorna-null-colecao"
    path: "audit-api/src/main/java/com/sentinel/audit/pack/Yamls.java"
    reason: "null significa valor inválido (LOG.md 12.23.1)"

  # O CLI é um programa de linha de comando: imprimir no console é a função dele (os logs da API usam o logger).
  - rule: "pmd-systemprintln"
    path: "audit-cli/**"
    reason: "o CLI escreve o resultado no console de propósito"
  # O CLI devolve o código de saída ao shell: encerrar a JVM com System.exit é o contrato dele.
  - rule: "pmd-DoNotTerminateVM"
    path: "audit-cli/**"
    reason: "o CLI termina com o código de saída que o pipeline lê"
  - rule: "sentinel-system-exit"
    path: "audit-api/src/main/java/com/sentinel/audit/pack/PackTool.java"
    reason: "PackTool.main é um programa de linha de comando (códigos de saída 0, 1 e 2)"

  # Falsos positivos da heurística "consulta/gravação dentro de loop": o código já faz uma consulta só e o laço apenas
  # monta objetos (conferido na leitura; o lote de gravação vem de quarkus.hibernate-orm.jdbc.statement-batch-size=50).
  - rule: "sentinel-jpa-n-mais-um"
    path: "audit-api/src/main/java/com/sentinel/audit/insights/InsightsService.java"
    reason: "uma única consulta (findByAuditRunId); não há laço sobre ela"
  - rule: "sentinel-jpa-n-mais-um"
    path: "audit-api/src/main/java/com/sentinel/audit/service/FindingLifecycleService.java"
    reason: "trend() já busca as contagens de todas as auditorias numa consulta (countBySeverityForRuns); o laço só monta os pontos"
  - rule: "sentinel-jpa-escrita-em-loop"
    path: "audit-api/src/main/java/com/sentinel/audit/service/AuditOrchestrationService.java"
    reason: "persist() só enfileira no contexto; o envio sai em lotes de 50 (statement-batch-size)"
  - rule: "pmd-UnusedAssignment"
    path: "audit-api/src/main/java/com/sentinel/audit/pack/SystemTuning.java"
    reason: "construtor compacto de record: reatribuir o parâmetro é a forma de normalizar o campo; o PMD não entende isso"

  # --- Falsos positivos e decisões conscientes registrados a partir da auditoria #52 ---
  - rule: "pmd-HardCodedCryptoKey"
    path: "audit-api/src/main/java/com/sentinel/audit/service/SecretBox.java"
    reason: "a chave AES não é literal: é derivada (SHA-256) da semente configurada em runtime; a troca por KDF com salt fica como evolução própria, com migração dos segredos já gravados"
  - rule: "sentinel-int-jdbc-driver-manager"
    path: "audit-api/src/main/java/com/sentinel/audit/settings/DbConfigSource.java"
    reason: "roda antes do CDI (ConfigSource do Quarkus), então ainda não existe DataSource/pool; abre uma conexão curta para ler as configurações"
  - rule: "pmd-UseProperClassLoader"
    path: "audit-api/src/main/java/com/sentinel/audit/settings/DbConfigSource.java"
    reason: "carrega o driver JDBC antes do CDI; o classloader da própria classe é o correto nesse ponto de bootstrap"
  - rule: "sentinel-java-thread-manual"
    path: "audit-api/src/main/java/com/sentinel/audit/settings/SettingsResource.java"
    reason: "/restart precisa de uma thread curta fora da requisição para responder antes de Quarkus.asyncExit()"
  - rule: "sentinel-mem-new-thread-solto"
    path: "audit-api/src/main/java/com/sentinel/audit/settings/SettingsResource.java"
    reason: "/restart precisa de uma thread curta fora da requisição para responder antes de Quarkus.asyncExit()"
  - rule: "sentinel-java-thread-manual"
    path: "audit-api/src/main/java/com/sentinel/audit/service/ChangedFiles.java"
    reason: "thread leitora do stdout do git, encerrada junto com o processo (join com timeout)"
  - rule: "sentinel-mem-new-thread-solto"
    path: "audit-api/src/main/java/com/sentinel/audit/service/ChangedFiles.java"
    reason: "thread leitora do stdout do git, encerrada junto com o processo (join com timeout)"
  - rule: "sentinel-java-retorna-null-colecao"
    path: "audit-api/src/main/java/com/sentinel/audit/pack/ProfileLoader.java"
    reason: "null sinaliza arquivo/mapa inválido, com o erro já registrado; o chamador trata (mesma decisão de Versions/Yamls)"
  # AnalyzerSet é só o registro dos analisadores: injeta todos de propósito e não tem lógica própria.
  - rule: "sentinel-too-many-injections"
    path: "audit-api/src/main/java/com/sentinel/audit/service/AnalyzerSet.java"
    reason: "fachada que agrupa os analisadores (registro), sem regra de negócio; dividir só espalharia a lista"
  # O seletor casa com o texto do style inline do React (font-size: 12px); não é um tamanho de fonte em px.
  - rule: "sentinel-css-fonte-em-px"
    path: "audit-dashboard/src/styles/leitura.css"
    reason: "px aqui é o texto procurado em [style*='...'], não declaração de tamanho; a declaração já usa rem"
  # A CLI existe para imprimir no terminal (relatório, resumo, erros de uso): o stdout é o produto, não log de aplicação.
  - rule: "obs-system-out"
    path: "audit-cli/src/main/java/com/sentinel/audit/cli/AuditCli.java"
    reason: "ferramenta de linha de comando: a saída no console é a interface com o usuário e o CI"
  # @BeanParam do Quarkus REST só aceita @QueryParam em campos (anotar o setter derruba o build), então os campos ficam públicos.
  - rule: "checkstyle-variable.notPrivate"
    path: "audit-api/src/main/java/com/sentinel/audit/resource/AuditFindingsResource.java"
    reason: "classe de parâmetros do @BeanParam: o framework exige a anotação no campo; verificado no build do Quarkus 3.33"
  - rule: "checkstyle-variable.notPrivate"
    path: "audit-api/src/main/java/com/sentinel/audit/resource/FindingResource.java"
    reason: "classe de parâmetros do @BeanParam: o framework exige a anotação no campo; verificado no build do Quarkus 3.33"

  # Migrations que mexem em bancos criados antes do Flyway. Não dá para editar nem renomear: o Flyway confere o
  # checksum e a descrição de cada migration já aplicada, e a edição quebraria bancos existentes.
  - rule: "sentinel-sqlnorma-constraint-fora-do-padrao"
    path: "audit-api/src/main/resources/db/migration/V2__ajustes_de_bancos_antigos.sql"
    reason: "remove CHECKs com os nomes que o Hibernate gerou (audit_run_status_check, finding_category_check); o nome a apagar é o do banco, não escolha do time"
  - rule: "squawk-require-concurrent-index-deletion"
    path: "audit-api/src/main/resources/db/migration/V3__remove_indice_redundante.sql"
    reason: "índice de uma tabela pequena de supressões, sem tráfego que o bloqueio de um DROP INDEX atrapalhe; a migration já foi aplicada e não pode mudar (checksum do Flyway)"

  # --- Achados da auditoria #134: decisões de projeto, cada uma com o motivo ---
  # Entidades JPA: os campos precisam ser não finais (o Hibernate os preenche por reflexão) e guardam as colunas da tabela.
  - rule: "pmd-ImmutableField"
    path: "audit-api/src/main/java/com/sentinel/audit/review/*.java"
    reason: "campo de entidade JPA: o Hibernate preenche por reflexão, não pode ser final"
  - rule: "pmd-TooManyFields"
    path: "audit-api/src/main/java/com/sentinel/audit/model/*.java"
    reason: "uma entidade tem um campo por coluna da tabela; dividir criaria joins sem ganho (AuditRun, Finding, AuditedSystem)"
  - rule: "pmd-ExcessivePublicCount"
    path: "audit-api/src/main/java/com/sentinel/audit/model/AuditedSystem.java"
    reason: "entidade com getters e setters de cada coluna"
  # Record com construtor compacto: reatribuir o parâmetro é como se normaliza o campo (igual a SystemTuning).
  - rule: "pmd-UnusedAssignment"
    path: "audit-api/src/main/java/com/sentinel/audit/pack/DedupTopic.java"
    reason: "construtor compacto de record: reatribuir o parâmetro é a forma de normalizar o campo; o PMD não entende isso"
  # Classes de orquestração e carga de pacotes ligam muitos tipos por natureza; medido no relatório #134 (21 a 30 tipos).
  - rule: "pmd-CouplingBetweenObjects"
    path: "audit-api/src/main/java/com/sentinel/audit/**"
    reason: "classes de orquestração e carga de pacotes conhecem vários tipos de propósito; partir só espalharia as dependências"
  - rule: "checkstyle-ClassFanOutComplexity"
    path: "audit-api/src/main/java/com/sentinel/audit/service/AnalyzerRunner.java"
    reason: "executor dos analisadores: referencia cada um por tipo (26 contra o limite de 25)"
  - rule: "checkstyle-ClassFanOutComplexity"
    path: "audit-api/src/main/java/com/sentinel/audit/service/AuditOrchestrationService.java"
    reason: "orquestra o fluxo da auditoria (27 contra o limite de 25); as etapas já estão em classes próprias"
  - rule: "jscpd-*"
    path: "audit-api/src/main/java/com/sentinel/audit/resource/SystemHistoryResource.java"
    reason: "o trecho repetido é só o bloco de imports e a anotação de cabeçalho, sem lógica duplicada"
  - rule: "jscpd-*"
    path: "audit-api/src/main/java/com/sentinel/audit/settings/SettingsResource.java"
    reason: "o trecho repetido é só o bloco de imports e a anotação de cabeçalho, sem lógica duplicada"

  # O jscpd conta listas de import iguais como trecho duplicado; import não é lógica repetida.
  # O local do achado é o segundo arquivo da dupla.
  - rule: "jscpd-*"
    path: "audit-api/src/main/java/com/sentinel/audit/actions/PendingActionResource.java"
    reason: "o trecho repetido é só o bloco de imports e a anotação de cabeçalho, sem lógica duplicada"
  - rule: "jscpd-*"
    path: "audit-api/src/main/java/com/sentinel/audit/analyzer/ArchitectureAnalyzer.java"
    reason: "o trecho repetido é só o bloco de imports e a anotação de cabeçalho, sem lógica duplicada"
  - rule: "jscpd-*"
    path: "audit-api/src/main/java/com/sentinel/audit/analyzer/DependencyCyclesAnalyzer.java"
    reason: "o trecho repetido é só o bloco de imports e a anotação de cabeçalho, sem lógica duplicada"
  - rule: "jscpd-*"
    path: "audit-api/src/main/java/com/sentinel/audit/analyzer/EslintAnalyzer.java"
    reason: "o trecho repetido é só o bloco de imports e a anotação de cabeçalho, sem lógica duplicada"
  - rule: "jscpd-*"
    path: "audit-api/src/main/java/com/sentinel/audit/mcp/McpAdminResource.java"
    reason: "o trecho repetido é só o bloco de imports e a anotação de cabeçalho, sem lógica duplicada"

  # Arquivo de configuração do Dependency-Cruiser: quem o importa é o comando (--config), não outro módulo.
  - rule: "dependency-cruiser-*"
    path: "audit-rules/lint/extras/dependency-cruiser.cjs"
    reason: "é a configuração passada ao Dependency-Cruiser por linha de comando; não é importada por nenhum módulo"
  # `switch` sobre enum fechado, sem default de propósito.
  - rule: "checkstyle-missing.switch.default"
    path: "audit-api/src/main/java/com/sentinel/audit/analyzer/SarifAnalyzer.java"
    reason: "switch exaustivo sobre enum (Java 21): o compilador acusa se surgir uma situação nova, melhor que um default silencioso"
