rules:
  - id: sentinel-hardcoded-password
    patterns:
      - pattern: $VAR = "..."
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i)(password|passwd|pwd|senha)
    message: >
      Possível senha hardcoded em '$VAR'. Mova credenciais para variáveis de
      ambiente ou cofre de segredos (ex: Vault, AWS Secrets Manager).
    severity: ERROR
    languages: [java, javascript, typescript, python]
    metadata:
      category: security
      cwe: CWE-259
      owasp: A07:2021 - Identification and Authentication Failures

  - id: sentinel-hardcoded-api-key
    patterns:
      - pattern: $VAR = "..."
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i)(api[_-]?key|apikey|access[_-]?key)
    message: >
      Possível API key hardcoded em '$VAR'. Use variáveis de ambiente ou
      gerenciadores de segredos para armazenar credenciais de API.
    severity: ERROR
    languages: [java, javascript, typescript, python]
    metadata:
      category: security
      cwe: CWE-798
      owasp: A07:2021 - Identification and Authentication Failures

  - id: sentinel-hardcoded-secret
    patterns:
      - pattern: $VAR = "..."
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i)(secret|token|private[_-]?key)
    message: >
      Possível segredo hardcoded em '$VAR'. Nunca inclua secrets diretamente
      no código-fonte. Use cofre de segredos ou injeção de configuração.
    severity: ERROR
    languages: [java, javascript, typescript, python]
    metadata:
      category: security
      cwe: CWE-798
      owasp: A02:2021 - Cryptographic Failures
