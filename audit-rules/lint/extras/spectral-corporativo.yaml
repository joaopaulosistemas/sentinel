# Ruleset do guia de design de API REST (Spectral). Usado pelo tool "spectral" do pacote market-tools.
extends: []
rules:
  # URLs em minúsculas, hífen para palavras compostas, sem verbo/maiúscula
  corp-recurso-minusculo-kebab:
    description: "Recursos em minúsculas com hífen (kebab-case)."
    message: "O caminho '{{property}}' deve usar minúsculas e hífen."
    severity: error
    given: "$.paths[*]~"
    then:
      function: pattern
      functionOptions:
        match: "^(/([a-z0-9]+(-[a-z0-9]+)*|\\{[a-zA-Z0-9]+\\}))+$|^/$"
  corp-recurso-no-plural:
    description: "Substantivos no plural para coleções."
    message: "O primeiro segmento '{{property}}' parece estar no singular; use o plural."
    severity: info
    given: "$.paths[*]~"
    then:
      function: pattern
      functionOptions:
        match: "^/[a-z0-9-]*(s|ões|ais|eis|is)(/.*)?$|^/$|^/\\{.*$"
  # Atributos sem abreviação
  corp-atributo-sem-abreviacao:
    description: "Não abrevie nomes de atributo (num, cod, desc, dt, qtd)."
    message: "O atributo '{{property}}' é abreviado; use o nome completo (numero, codigo, descricao, data, quantidade)."
    severity: warn
    given: "$..properties[*]~"
    then:
      function: pattern
      functionOptions:
        notMatch: "^(num|cod|desc|dt|qtd|vlr)[A-Z_]|^(num|cod|desc|dt|qtd|vlr)$"
  # Erros em application/problem+json com lista de mensagens
  corp-erro-problem-json:
    description: "Respostas 4xx/5xx devem ser application/problem+json."
    message: "Resposta de erro sem application/problem+json."
    severity: warn
    given: "$.paths[*][*].responses[?(@property >= 400 && @property < 600)]"
    then:
      field: content.application/problem+json
      function: truthy
  # Coleção grande precisa de paginação (limite/cursor)
  corp-colecao-paginada:
    description: "GET de coleção deve aceitar limite e cursor (máximo 200 itens)."
    message: "Coleção sem os parâmetros 'limite' e 'cursor'."
    severity: info
    given: "$.paths[?(!@property.match(/\\}$/))].get"
    then:
      field: parameters
      function: schema
      functionOptions:
        schema:
          type: array
          allOf:
            - contains: { type: object, properties: { name: { const: limite } }, required: [name] }
            - contains: { type: object, properties: { name: { const: cursor } }, required: [name] }
  # Gateway atual: Swagger 2.0 e sem 'schema' em parameters
  corp-gateway-swagger-2:
    description: "O gateway só aceita Swagger 2.0."
    message: "Documento OpenAPI 3.x: o gateway atual valida apenas Swagger 2.0."
    severity: info
    given: "$"
    then:
      field: openapi
      function: falsy
