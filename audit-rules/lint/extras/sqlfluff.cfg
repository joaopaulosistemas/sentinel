[sqlfluff]
dialect = postgres
templater = raw
# Estilo puro fica de fora (calibração: 419 achados em 3 scripts do petclinic, 286 só de layout/maiúsculas):
# layout (LT*: espaços, quebras, tamanho de linha), capitalisation (CP*: maiúsculas) e AL03 (coluna sem alias).
exclude_rules = layout, capitalisation, AL03
max_line_length = 140
