- key: "sentinel-sql-injection"
  summary: "Nunca concatene valores na consulta. Use PreparedStatement (?) ou parâmetros nomeados do JPA."
  before: "stmt.executeQuery(\"SELECT * FROM conta WHERE id = \" + id);"
  after: |-
    var ps = conn.prepareStatement("SELECT * FROM conta WHERE id = ?");
    ps.setLong(1, id);
    ps.executeQuery();
  refs:
    - "https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html"

- key: "command-injection"
  summary: "Evite shell. Passe cada argumento separado ao ProcessBuilder e valide o valor contra uma lista de permissão."
  before: "Runtime.getRuntime().exec(\"ping \" + host);"
  after: |-
    if (!host.matches("[A-Za-z0-9.-]{1,253}")) throw new IllegalArgumentException();
    new ProcessBuilder("ping", "-c", "1", host).start();
  refs:
    - "https://cheatsheetseries.owasp.org/cheatsheets/OS_Command_Injection_Defense_Cheat_Sheet.html"

- key: "ldap-injection"
  summary: "Escape os valores do filtro LDAP (ou use um construtor de consultas parametrizado)."
  before: "ctx.search(base, \"(uid=\" + user + \")\", controls);"
  after: "ctx.search(base, \"(uid={0})\", new Object[] { user }, controls);"
  refs:
    - "https://cheatsheetseries.owasp.org/cheatsheets/LDAP_Injection_Prevention_Cheat_Sheet.html"

- key: "xpath-injection"
  summary: "Use variáveis XPath (XPathVariableResolver) em vez de concatenar texto na expressão."
  before: "xpath.evaluate(\"//user[name='\" + name + \"']\", doc);"
  after: |-
    xpath.setXPathVariableResolver(v -> name);
    xpath.evaluate("//user[name=$name]", doc);
  refs:
    - "https://cheatsheetseries.owasp.org/cheatsheets/Injection_Prevention_Cheat_Sheet.html"

- key: "xss"
  summary: "Escape toda saída conforme o contexto (HTML, atributo, JS). No navegador, prefira textContent a innerHTML."
  before: "el.innerHTML = userInput;"
  after: "el.textContent = userInput;"
  refs:
    - "https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html"

- key: "secrets-history"
  summary: "O segredo já vazou: REVOGUE/rotacione a credencial agora. Só depois limpe o histórico (git filter-repo) e avise quem clonou."
  before: "// commit antigo: password = \"SuperSecreta123\""
  after: |-
    # 1) gere uma credencial nova e invalide a antiga
    # 2) git filter-repo --replace-text expressoes.txt  (e force-push coordenado)
  refs:
    - "https://docs.github.com/pt/authentication/keeping-your-account-and-data-secure/removing-sensitive-data-from-a-repository"

- key: "secrets-"
  summary: "Tire a credencial do código: leia de variável de ambiente ou cofre de segredos e rotacione a atual, que já está exposta."
  before: "String password = \"SuperSecreta123\";"
  after: "String password = System.getenv(\"DB_PASSWORD\");   // ou @ConfigProperty / Vault"
  refs:
    - "https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html"

- key: "osv-"
  summary: "Atualize a dependência para a versão corrigida indicada e gere o lockfile novamente; prefira o BOM do framework."
  before: "<version>2.14.1</version>"
  after: "<version>2.17.1</version>   <!-- ou: npm install pacote@versao-corrigida -->"
  refs:
    - "https://osv.dev"

- key: "owasp-dependency"
  summary: "Atualize a dependência para a versão corrigida indicada na descrição."
  before: "<version>2.14.1</version>"
  after: "<version>2.17.1</version>"
  refs:
    - "https://nvd.nist.gov"

- key: "owasp-a01-endpoint"
  summary: "Declare o controle de acesso do recurso (@RolesAllowed / @Authenticated) ou documente onde ele é aplicado."
  before: "@Path(\"/contas\") class ContaResource {}"
  after: "@Path(\"/contas\") @RolesAllowed(\"gerente\") class ContaResource {}"
  refs:
    - "https://owasp.org/Top10/A01_2021-Broken_Access_Control/"

- key: "api-ssrf"
  summary: "Valide a URL contra uma lista de hosts permitidos e bloqueie endereços internos antes de fazer a chamada."
  before: "new URL(request.getParameter(\"u\")).openStream();"
  after: |-
    URI u = URI.create(param);
    if (!PERMITIDOS.contains(u.getHost())) throw new BadRequestException();
  refs:
    - "https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html"

- key: "path-traversal"
  summary: "Resolva o caminho dentro de um diretório base e confira que continua dentro dele."
  before: "new File(\"/dados/\" + nome);"
  after: |-
    Path base = Path.of("/dados").toRealPath();
    Path alvo = base.resolve(nome).normalize();
    if (!alvo.startsWith(base)) throw new ForbiddenException();
  refs:
    - "https://cheatsheetseries.owasp.org/cheatsheets/Input_Validation_Cheat_Sheet.html"

- key: "cors-wildcard"
  summary: "Liste as origens confiáveis em vez de '*'."
  before: "response.header(\"Access-Control-Allow-Origin\", \"*\");"
  after: "quarkus.http.cors.origins=https://portal.exemplo.com.br"
  refs:
    - "https://developer.mozilla.org/pt-BR/docs/Web/HTTP/CORS"

- key: "log-segredo-js"
  summary: "Não registre senha, token ou segredo; registre só um identificador que não sirva como credencial."
  before: "console.log('Token:', token);"
  after: "this.logger.log(`Redefinição de senha solicitada para o usuário ${user.id}`);"
  refs:
    - "https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html"
    - "https://cwe.mitre.org/data/definitions/532.html"

- key: "cors-aberto-js"
  summary: "Liste as origens confiáveis; origin: true e enableCors() sem argumentos aceitam qualquer origem."
  before: "app.enableCors({ origin: '*' });"
  after: "app.enableCors({ origin: (process.env.CORS_ORIGINS ?? '').split(',') });   // lista explícita por ambiente"
  refs:
    - "https://docs.nestjs.com/security/cors"
    - "https://developer.mozilla.org/pt-BR/docs/Web/HTTP/CORS"

- key: "csrf-disabled"
  summary: "Mantenha o CSRF ativo quando houver sessão/cookies; desligue só em API stateless com token no header."
  before: "http.csrf().disable();"
  after: "http.csrf(csrf -> csrf.csrfTokenRepository(CookieCsrfTokenRepository.withHttpOnlyFalse()));"
  refs:
    - "https://cheatsheetseries.owasp.org/cheatsheets/Cross-Site_Request_Forgery_Prevention_Cheat_Sheet.html"

- key: "tls-validation-disabled"
  summary: "Remova o TrustManager/HostnameVerifier permissivo; instale a CA interna no truststore em vez de ignorar a validação."
  before: "HttpsURLConnection.setDefaultHostnameVerifier((h, s) -> true);"
  after: "// -Djavax.net.ssl.trustStore=/etc/ssl/truststore.jks  (com a CA da empresa)"
  refs:
    - "https://cheatsheetseries.owasp.org/cheatsheets/Transport_Layer_Security_Cheat_Sheet.html"

- key: "jwt-sem-verificacao"
  summary: "Valide a assinatura, o emissor e a expiração do token antes de confiar nas claims."
  before: "Jwts.parser().parse(token);"
  after: "Jwts.parser().verifyWith(chave).build().parseSignedClaims(token);"
  refs:
    - "https://cheatsheetseries.owasp.org/cheatsheets/JSON_Web_Token_for_Java_Cheat_Sheet.html"

- key: "jwt-chave-fixa"
  summary: "A chave de assinatura não pode estar no código: leia de cofre/variável e permita rotação."
  before: "Algorithm.HMAC256(\"segredo\");"
  after: "Algorithm.HMAC256(System.getenv(\"JWT_SECRET\"));"
  refs:
    - "https://cheatsheetseries.owasp.org/cheatsheets/JSON_Web_Token_for_Java_Cheat_Sheet.html"

- key: "jwt-chave-fixa-js"
  summary: "O segredo de assinatura não pode estar no código: leia de cofre/variável e permita rotação."
  before: "jwt.sign(payload, 'segredo');"
  after: "jwt.sign(payload, process.env.JWT_SECRET!);   // valide a variável na inicialização"
  refs:
    - "https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html"

- key: "jwt-segredo-padrao-js"
  summary: "Não use valor padrão para segredo: se a variável faltar, interrompa a inicialização."
  before: "const s = process.env.JWT_SECRET || 'padrao';"
  after: "const s = process.env.JWT_SECRET; if (!s) throw new Error('JWT_SECRET ausente');"
  refs:
    - "https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html"

- key: "crypto-hash-fraco"
  summary: "Use SHA-256 ou superior; para senhas use bcrypt/scrypt/Argon2 (hash lento com salt)."
  before: "MessageDigest.getInstance(\"MD5\");"
  after: "MessageDigest.getInstance(\"SHA-256\");   // senhas: BCrypt.hashpw(senha, BCrypt.gensalt())"
  refs:
    - "https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html"

- key: "crypto-cifra-fraca"
  summary: "Use AES-GCM com IV aleatório e único por mensagem."
  before: "Cipher.getInstance(\"AES/ECB/PKCS5Padding\");"
  after: "Cipher.getInstance(\"AES/GCM/NoPadding\");   // IV de 12 bytes gerado com SecureRandom"
  refs:
    - "https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html"

- key: "crypto-random-previsivel"
  summary: "Para tokens, senhas e OTP use SecureRandom."
  before: "new Random().nextInt();"
  after: "new SecureRandom().nextInt();"
  refs:
    - "https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html"

- key: "desserializacao-insegura"
  summary: "Evite a desserialização nativa de dados não confiáveis; use JSON ou, se inevitável, um ObjectInputFilter restritivo."
  before: "new ObjectInputStream(in).readObject();"
  after: "ois.setObjectInputFilter(ObjectInputFilter.Config.createFilter(\"com.empresa.dto.*;!*\"));"
  refs:
    - "https://cheatsheetseries.owasp.org/cheatsheets/Deserialization_Cheat_Sheet.html"

- key: "sentinel-xxe-parser-xml"
  summary: "Desligue DTD e entidades externas antes de usar o parser."
  before: "DocumentBuilderFactory.newInstance()"
  after: "f.setFeature(\"http://apache.org/xml/features/disallow-doctype-decl\", true);"
  effort: S
  regression-risk: MEDIUM

- key: "sentinel-spel-injection"
  summary: "Use expressões fixas ou SimpleEvaluationContext; nunca monte a expressão com entrada do usuário."
  before: "parser.parseExpression(entrada)"
  after: "parser.parseExpression(\"nome\")  // fixa"
  effort: M
  regression-risk: MEDIUM

- key: "sentinel-open-redirect"
  summary: "Valide o destino contra uma lista de caminhos internos permitidos."
  before: "resp.sendRedirect(redirectUrl)"
  after: "resp.sendRedirect(destinoPermitido(redirectUrl))"
  effort: S
  regression-risk: MEDIUM

- key: "sentinel-jackson-default-typing"
  summary: "Use @JsonTypeInfo com um PolymorphicTypeValidator restrito."
  before: "mapper.enableDefaultTyping()"
  after: "mapper.activateDefaultTyping(validadorRestrito, ...)"
  effort: M
  regression-risk: HIGH

- key: "sentinel-zip-slip"
  summary: "Normalize o caminho e confira que continua dentro da pasta de destino."
  before: "new File(destino, entry.getName())"
  after: "Path alvo = destino.toPath().resolve(entry.getName()).normalize(); if (!alvo.startsWith(destino.toPath())) throw ..."
  effort: S
  regression-risk: LOW

- key: "sentinel-crossorigin-aberto"
  summary: "Liste as origens permitidas."
  before: "@CrossOrigin"
  after: "@CrossOrigin(origins = \"https://app.exemplo.com\")"
  effort: S
  regression-risk: LOW

- key: "sentinel-log-dado-sensivel"
  summary: "Registre só um identificador ou mascare o valor."
  before: "log.info(\"login\", senha)"
  after: "log.info(\"login usuario={}\", idUsuario)"
  effort: S
  regression-risk: LOW

- key: "sentinel-senha-fixa-no-codigo"
  summary: "Leia de variável de ambiente ou cofre e troque a credencial exposta."
  before: "String dbPassword = \"admin123\";"
  after: "String dbPassword = System.getenv(\"DB_PASSWORD\");"
  effort: S
  regression-risk: MEDIUM

- key: "sentinel-system-exit"
  summary: "Lance uma exceção e deixe o framework tratar."
  before: "System.exit(1);"
  after: "throw new IllegalStateException(\"motivo\");"
  effort: S
  regression-risk: MEDIUM

- key: "sentinel-cookie-sem-secure"
  summary: "Defina Secure, HttpOnly e SameSite no cookie."
  before: "new Cookie(\"sid\", id)"
  after: "c.setSecure(true); c.setHttpOnly(true);"
  effort: S
  regression-risk: LOW

- key: "sentinel-taint-sql-parametro-http"
  summary: "Use parâmetros nomeados ou binding com '?'; nunca concatene entrada na consulta."
  before: "jdbc.queryForObject(\"select * from c where nome = '\" + nome + \"'\", Object.class)"
  after: "jdbc.queryForObject(\"select * from c where nome = ?\", Object.class, nome)"
  effort: S
  regression-risk: LOW

- key: "sentinel-taint-html-parametro-url"
  summary: "Mostre o dado com interpolação do framework, que escapa o texto."
  before: "el.innerHTML = location.search"
  after: "el.textContent = location.search"
  effort: S
  regression-risk: LOW

- key: "sentinel-servlet-path-traversal"
  summary: "Não monte caminho com dado da requisição. Use só o nome do arquivo e confira que o caminho final fica dentro do diretório permitido."
  before: "new File(\"/dados/\" + request.getParameter(\"arquivo\"))"
  after: |-
    Path base = Paths.get("/dados").toRealPath();
    Path alvo = base.resolve(Paths.get(nome).getFileName()).normalize();
    if (!alvo.startsWith(base)) throw new SecurityException("caminho fora do diretório permitido");
  refs:
    - "https://owasp.org/www-community/attacks/Path_Traversal"
    - "https://cwe.mitre.org/data/definitions/22.html"
  effort: S
  regression-risk: LOW

- key: "sentinel-servlet-trust-boundary"
  summary: "Valide o dado (tipo, tamanho, lista permitida) antes de guardar na sessão e não use dado do cliente como nome do atributo."
  before: "session.setAttribute(\"usuario\", request.getParameter(\"usuario\"));"
  after: |-
    String usuario = request.getParameter("usuario");
    if (!usuario.matches("[a-z0-9._-]{3,32}")) throw new IllegalArgumentException();
    session.setAttribute("usuario", usuario);
  refs:
    - "https://cwe.mitre.org/data/definitions/501.html"
  effort: S
  regression-risk: LOW

- key: "sentinel-command-injection-requisicao"
  summary: "Não passe dado da requisição ao sistema operacional. Valide contra lista permitida e use argumentos separados no ProcessBuilder."
  before: "Runtime.getRuntime().exec(request.getParameter(\"host\"));"
  after: |-
    if (!host.matches("[A-Za-z0-9.-]{1,253}")) throw new IllegalArgumentException();
    new ProcessBuilder("ping", "-c", "1", host).start();
  refs:
    - "https://cheatsheetseries.owasp.org/cheatsheets/OS_Command_Injection_Defense_Cheat_Sheet.html"
  effort: S
  regression-risk: MEDIUM

- key: "sentinel-cookie-secure-desligado"
  summary: "Troque setSecure(false) por setSecure(true) e defina HttpOnly e SameSite."
  before: "cookie.setSecure(false);"
  after: "cookie.setSecure(true); cookie.setHttpOnly(true);"
  effort: S
  regression-risk: LOW

- key: "sentinel-crypto-random-nextbytes"
  summary: "Bytes aleatórios para token, sal, IV ou chave exigem SecureRandom."
  before: "new java.util.Random().nextBytes(token)"
  after: "new java.security.SecureRandom().nextBytes(token)"
  refs:
    - "https://cwe.mitre.org/data/definitions/330.html"
  effort: S
  regression-risk: LOW

- key: "sentinel-crypto-random-servidor"
  summary: "Se o valor protege algo (token, sessão, senha provisória), troque por SecureRandom."
  before: "new java.util.Random().nextInt()"
  after: "new java.security.SecureRandom().nextInt()"
  refs:
    - "https://cwe.mitre.org/data/definitions/330.html"
  effort: S
  regression-risk: LOW

- key: "sentinel-senha-comparada-com-literal"
  summary: "Não compare a senha com um texto fixo. Guarde o hash (bcrypt/Argon2) em banco ou cofre e compare com o verificador da biblioteca."
  before: "if (\"BlackPearl\".equals(password)) { ... }"
  after: |-
    if (passwordEncoder.matches(password, usuario.getSenhaHash())) { ... }
  refs:
    - "https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html"

- key: "sentinel-log-injection"
  summary: "Remova \\r e \\n do dado externo antes de registrar, ou use log em JSON, que escapa as quebras de linha."
  before: "log.info(\"login: \" + usuario);"
  after: |-
    var limpo = usuario.replaceAll("[\\r\\n]", "_");
    log.info("login: {}", limpo);
  refs:
    - "https://owasp.org/www-community/attacks/Log_Injection"


- key: "sentinel-node-sql-injection"
  summary: "Nunca monte o SQL com dado da requisição. Use parâmetros nomeados (`replacements`/`bind` no Sequelize) ou `?` no driver."
  before: "sequelize.query(`SELECT * FROM Users WHERE email = '${req.body.email}'`)"
  after: |-
    sequelize.query('SELECT * FROM Users WHERE email = :email', {
      replacements: { email: req.body.email },
      type: QueryTypes.SELECT
    })
  refs:
    - "https://cheatsheetseries.owasp.org/cheatsheets/Query_Parameterization_Cheat_Sheet.html"

- key: "sentinel-node-nosql-where"
  summary: "Não use `$where` com dado externo. Use operadores de consulta e valide o tipo (número, texto) antes."
  before: "db.reviews.find({ $where: 'this.product == ' + id })"
  after: "db.reviews.find({ product: Number(id) })"
  refs:
    - "https://owasp.org/www-community/attacks/NoSQL_injection"

- key: "sentinel-node-eval-requisicao"
  summary: "Não execute texto vindo do usuário. Use um parser com lista de operações permitidas."
  before: "const resultado = eval(req.body.expressao)"
  after: |-
    const resultado = avaliarExpressaoSegura(req.body.expressao) // só números e + - * /
  refs:
    - "https://cheatsheetseries.owasp.org/cheatsheets/Nodejs_Security_Cheat_Sheet.html"

- key: "sentinel-node-eval-dinamico"
  summary: "Troque `eval` por JSON.parse ou por um avaliador de expressões com lista de operações permitidas."
  before: "const resposta = eval(expressao).toString()"
  after: "const resposta = avaliarExpressaoSegura(expressao).toString()"
  refs:
    - "https://developer.mozilla.org/docs/Web/JavaScript/Reference/Global_Objects/eval#never_use_direct_eval!"

- key: "sentinel-node-open-redirect"
  summary: "Redirecione só para caminhos do próprio site ou compare o destino exato com uma lista de permissão."
  before: "res.redirect(req.query.to)"
  after: |-
    const permitidos = new Set(['/inicio', '/conta'])
    res.redirect(permitidos.has(req.query.to) ? req.query.to : '/inicio')
  refs:
    - "https://cheatsheetseries.owasp.org/cheatsheets/Unvalidated_Redirects_and_Forwards_Cheat_Sheet.html"

- key: "sentinel-node-path-traversal"
  summary: "Use só o nome do arquivo (`path.basename`), resolva o caminho e confira que continua dentro da pasta permitida."
  before: "res.sendFile(path.resolve('ftp/', req.params.file))"
  after: |-
    const base = path.resolve('ftp')
    const alvo = path.resolve(base, path.basename(req.params.file))
    if (!alvo.startsWith(base + path.sep)) return res.status(403).end()
    res.sendFile(alvo)
  refs:
    - "https://owasp.org/www-community/attacks/Path_Traversal"

- key: "sentinel-node-ssrf"
  summary: "Valide o destino contra uma lista de hosts permitidos e bloqueie endereços internos antes de chamar a URL."
  before: "const resposta = await fetch(req.body.imageUrl)"
  after: |-
    const url = new URL(req.body.imageUrl)
    if (!HOSTS_PERMITIDOS.has(url.hostname)) throw new Error('host não permitido')
    const resposta = await fetch(url, { redirect: 'error' })
  refs:
    - "https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html"

- key: "sentinel-node-hash-fraco"
  summary: "Para senha use bcrypt, scrypt ou argon2. Para integridade use SHA-256 ou superior."
  before: "crypto.createHash('md5').update(senha).digest('hex')"
  after: "await bcrypt.hash(senha, 12)"
  refs:
    - "https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html"

- key: "sentinel-node-xxe"
  summary: "Remova `noent: true`/`replaceEntities: true` e rejeite documentos com DOCTYPE vindos de fora."
  before: "libxml.parseXml(dados, { noent: true })"
  after: "libxml.parseXml(dados, { noent: false, nonet: true })"
  refs:
    - "https://cheatsheetseries.owasp.org/cheatsheets/XML_External_Entity_Prevention_Cheat_Sheet.html"

- key: "sentinel-node-exec-dinamico"
  summary: "Troque `exec` por `execFile`/`spawn` com argumentos separados e valide cada valor contra uma lista de permissão."
  before: "exec(comando, callback)"
  after: |-
    if (!COMANDOS_PERMITIDOS.has(nome)) throw new Error('comando não permitido')
    execFile(nome, args, callback)
  refs:
    - "https://cheatsheetseries.owasp.org/cheatsheets/OS_Command_Injection_Defense_Cheat_Sheet.html"

- key: "sentinel-node-command-injection"
  summary: "Evite shell. Use `execFile`/`spawn` com cada argumento separado e valide o valor contra uma lista de permissão."
  before: "child_process.exec('ping -c 2 ' + req.body.address)"
  after: |-
    if (!/^[A-Za-z0-9.-]{1,253}$/.test(req.body.address)) throw new Error('host inválido')
    child_process.execFile('ping', ['-c', '2', req.body.address])
  refs:
    - "https://cheatsheetseries.owasp.org/cheatsheets/OS_Command_Injection_Defense_Cheat_Sheet.html"

- key: "sentinel-node-desserializacao"
  summary: "Não desserialize dado externo com `node-serialize`. Use JSON.parse e valide o formato."
  before: "serialize.unserialize(req.cookies.perfil)"
  after: "const perfil = JSON.parse(req.cookies.perfil) // e valide os campos esperados"
  refs:
    - "https://cheatsheetseries.owasp.org/cheatsheets/Deserialization_Cheat_Sheet.html"

- key: "sentinel-node-cookie-sem-flags"
  summary: "Grave cookies de sessão com `httpOnly`, `secure` e `sameSite`."
  before: "res.cookie('token', token)"
  after: "res.cookie('token', token, { httpOnly: true, secure: true, sameSite: 'lax' })"
  refs:
    - "https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html"

- key: "sentinel-node-jwt-sem-algoritmo"
  summary: "Informe os algoritmos aceitos na verificação do JWT."
  before: "jwt.verify(token, chave)"
  after: "jwt.verify(token, chave, { algorithms: ['HS256'] })"
  refs:
    - "https://cheatsheetseries.owasp.org/cheatsheets/JSON_Web_Token_for_Java_Cheat_Sheet.html"

- key: "sentinel-node-jwt-expiracao-ignorada"
  summary: "Não ignore a expiração do token. Renove o token em vez disso."
  before: "jwt.verify(token, chave, { ignoreExpiration: true })"
  after: "jwt.verify(token, chave, { algorithms: ['HS256'] })"
  refs:
    - "https://cheatsheetseries.owasp.org/cheatsheets/JSON_Web_Token_for_Java_Cheat_Sheet.html"

- key: "sentinel-node-math-random-segredo"
  summary: "Use um gerador criptográfico para tokens, senhas temporárias e segredos."
  before: "const token = Math.random().toString(36).slice(2)"
  after: "const token = crypto.randomBytes(32).toString('hex')"
  refs:
    - "https://developer.mozilla.org/docs/Web/API/Crypto/getRandomValues"

- key: "sentinel-xstream-qualquer-tipo"
  summary: "Libere só os tipos esperados em vez de aceitar qualquer classe."
  before: "xstream.addPermission(AnyTypePermission.ANY);"
  after: "xstream.allowTypesByWildcard(new String[] { \"com.exemplo.dto.*\" });"
  refs:
    - "https://x-stream.github.io/security.html"
  effort: S
  regression-risk: LOW

- key: "sentinel-ssti-modelo-variavel"
  summary: "Use modelos fixos (arquivo ou texto constante) e envie os dados do usuário só pelo contexto."
  before: "Velocity.evaluate(ctx, out, \"t\", modeloDoUsuario);"
  after: "Velocity.evaluate(ctx, out, \"t\", MODELO_FIXO); // dados via ctx.put(...)"
  refs:
    - "https://cwe.mitre.org/data/definitions/1336.html"
  effort: M
  regression-risk: MEDIUM

- key: "sentinel-fastjson-autotype"
  summary: "Deixe o AutoType desligado e leia o JSON para uma classe fixa."
  before: "ParserConfig.getGlobalInstance().setAutoTypeSupport(true);"
  after: "// mantenha o padrão (AutoType desligado)\nJSON.parseObject(json, Pedido.class);"
  refs:
    - "https://cwe.mitre.org/data/definitions/502.html"
  effort: S
  regression-risk: LOW

- key: "sentinel-classloader-define-classe"
  summary: "Não carregue bytes de classe por reflexão; use um carregador de plugins que valide a origem."
  before: "ClassLoader.class.getDeclaredMethod(\"defineClass\", String.class, byte[].class, int.class, int.class);"
  after: "ServiceLoader.load(Plugin.class); // só implementações instaladas no classpath"
  refs:
    - "https://cwe.mitre.org/data/definitions/470.html"
  effort: M
  regression-risk: MEDIUM

- key: "sentinel-android-log-segredo"
  summary: "Não grave token, senha ou segredo no logcat. Registre só um identificador ou remova a linha do build de produção."
  before: "Log.d(\"accesstoken\", accessToken);"
  after: "Log.d(\"login\", \"token recebido\");"
  refs:
    - "https://mas.owasp.org/MASTG/tests/android/MASVS-STORAGE/MASTG-TEST-0003/"

- key: "sentinel-android-webview-url-do-intent"
  summary: "Valide esquema e host da URL recebida contra uma lista de permissão antes de chamar loadUrl."
  before: "webView.loadUrl(getIntent().getData().getQueryParameter(\"url\"));"
  after: |-
    Uri u = Uri.parse(url);
    if ("https".equals(u.getScheme()) && "www.exemplo.com".equals(u.getHost())) webView.loadUrl(url);
  refs:
    - "https://developer.android.com/privacy-and-security/risks/unsafe-uri-loading"

- key: "sentinel-android-manifest-allow-backup"
  summary: "Desligue a cópia de segurança do app ou exclua os dados sensíveis dela."
  before: "android:allowBackup=\"true\""
  after: "android:allowBackup=\"false\""
  refs:
    - "https://developer.android.com/privacy-and-security/risks/backup-best-practices"

- key: "sentinel-android-manifest-cleartext"
  summary: "Use HTTPS e remova o tráfego em texto puro."
  before: "android:usesCleartextTraffic=\"true\""
  after: "android:usesCleartextTraffic=\"false\""
  refs:
    - "https://developer.android.com/privacy-and-security/risks/cleartext-communications"

- key: "sentinel-android-manifest-exported"
  summary: "Exporte só o componente que precisa receber Intent de outros apps e proteja-o com permissão."
  before: "<activity android:name=\".Envio\" android:exported=\"true\" />"
  after: "<activity android:name=\".Envio\" android:exported=\"false\" />"
  refs:
    - "https://developer.android.com/privacy-and-security/risks/android-exported"

- key: "sentinel-android-modo-mundo"
  summary: "Crie arquivos e preferências com MODE_PRIVATE; para compartilhar, use FileProvider ou ContentProvider com permissão."
  before: "getSharedPreferences(\"prefs\", Context.MODE_WORLD_READABLE);"
  after: "getSharedPreferences(\"prefs\", Context.MODE_PRIVATE);"
  refs:
    - "https://developer.android.com/privacy-and-security/risks/world-readable-files"

- key: "sentinel-crypto-chave-fixa-no-codigo"
  summary: "Não escreva a chave no código: use o Android Keystore, um KMS ou configuração externa."
  before: "new SecretKeySpec(\"0123456789abcdef\".getBytes(), \"AES\");"
  after: "SecretKey chave = (SecretKey) keyStore.getKey(\"alias\", null);"
  refs:
    - "https://cwe.mitre.org/data/definitions/321.html"

- key: "sentinel-crypto-iv-fixo"
  summary: "Gere um IV aleatório por operação com SecureRandom e guarde-o junto do texto cifrado."
  before: "new IvParameterSpec(new byte[16]);"
  after: |-
    byte[] iv = new byte[16];
    new SecureRandom().nextBytes(iv);
    new IvParameterSpec(iv);
  refs:
    - "https://cwe.mitre.org/data/definitions/329.html"

- key: "sentinel-node-sql-concatenado"
  summary: "Passe os valores como parâmetros do driver; para coluna ou ordem, escolha de uma lista fixa."
  before: "pool.query(\"SELECT * FROM users WHERE name = '\" + nome + \"'\")"
  after: "pool.query('SELECT * FROM users WHERE name = $1', [nome])"
  refs:
    - "https://cheatsheetseries.owasp.org/cheatsheets/Query_Parameterization_Cheat_Sheet.html"

- key: "sentinel-node-nosql-operador"
  summary: "Converta o valor da requisição para texto antes de montar o filtro, para que objetos com operadores não passem."
  before: "col.findOne({ email: req.body.email })"
  after: "col.findOne({ email: String(req.body.email) })"
  refs:
    - "https://cheatsheetseries.owasp.org/cheatsheets/Injection_Prevention_Cheat_Sheet.html"

- key: "sentinel-node-prototype-pollution"
  summary: "Ignore as chaves __proto__, constructor e prototype ao mesclar objetos vindos de fora."
  before: "for (const k of Object.keys(src)) { merge(dst[k], src[k]) }"
  after: "for (const k of Object.keys(src)) { if (k === '__proto__' || k === 'constructor' || k === 'prototype') continue; merge(dst[k], src[k]) }"
  refs:
    - "https://cheatsheetseries.owasp.org/cheatsheets/Prototype_Pollution_Prevention_Cheat_Sheet.html"

- key: "sentinel-node-regexp-da-requisicao"
  summary: "Escape o texto do usuário antes de virar expressão regular, limite o tamanho ou use RE2."
  before: "new RegExp(req.body.pattern)"
  after: "new RegExp(escapeRegExp(req.body.pattern))"
  refs:
    - "https://owasp.org/www-community/attacks/Regular_expression_Denial_of_Service_-_ReDoS"

- key: "sentinel-node-xss-refletido"
  summary: "Escape o valor antes de colocá-lo no HTML ou use um motor de templates com escape automático."
  before: "res.send('<h1>' + req.query.name + '</h1>')"
  after: "res.send('<h1>' + escapeHtml(req.query.name) + '</h1>')"
  refs:
    - "https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html"

- key: "sentinel-node-mass-assignment"
  summary: "Escolha os campos permitidos um a um e defina papel, saldo e permissões só no servidor."
  before: "Usuario.create(req.body)"
  after: "Usuario.create({ nome: req.body.nome, email: req.body.email, role: 'cliente' })"
  refs:
    - "https://cheatsheetseries.owasp.org/cheatsheets/Mass_Assignment_Cheat_Sheet.html"

- key: "sentinel-ejs-saida-sem-escape"
  summary: "Troque `<%- valor %>` por `<%= valor %>`, que escapa o texto; deixe `<%-` só para HTML montado pelo servidor."
  before: "<p><%- review.body %></p>"
  after: "<p><%= review.body %></p>"
  refs:
    - "https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html"

- key: "sentinel-node-mass-assignment-campo"
  summary: "Defina papel, permissão e saldo só no servidor; nunca copie esses campos do corpo da requisição."
  before: "req.session.role = req.body.role"
  after: "req.session.role = usuarioDoBanco.role"
  refs:
    - "https://cheatsheetseries.owasp.org/cheatsheets/Mass_Assignment_Cheat_Sheet.html"
