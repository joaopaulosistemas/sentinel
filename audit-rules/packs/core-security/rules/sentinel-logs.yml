rules:
  - id: sentinel-log-segredo-js
    patterns:
      - pattern-either:
          - patterns:
              - pattern: $LOGGER.$M(..., $ARG, ...)
              - metavariable-regex:
                  metavariable: $ARG
                  regex: "^[^'\"`]*(?:[Pp]ass(?:word|wd)|[Ss]enha|[Ss]ecret|[Tt]oken|[Aa]pi_?[Kk]ey|[Aa]uthorization|[Pp]rivate_?[Kk]ey|[Cc]redential|PASSWORD|SECRET|TOKEN|API_?KEY)(?![a-z])"
          - patterns:
              - pattern: $LOGGER.$M(..., `...${$INTERP}...`, ...)
              - metavariable-regex:
                  metavariable: $INTERP
                  regex: ".*(?:[Pp]ass(?:word|wd)|[Ss]enha|[Ss]ecret|[Tt]oken|[Aa]pi_?[Kk]ey|[Aa]uthorization|[Pp]rivate_?[Kk]ey|[Cc]redential|PASSWORD|SECRET|TOKEN|API_?KEY)(?![a-z])"
      - metavariable-regex:
          metavariable: $LOGGER
          regex: ^(console|(this\.)?_?logger|log)$
      - metavariable-regex:
          metavariable: $M
          regex: ^(log|info|debug|warn|error|verbose|trace)$
    message: >
      Segredo, token ou senha enviado ao log (CWE-532). Logs costumam ir para agregadores e para quem tem acesso de
      leitura, e o valor vale como credencial enquanto não expirar. Remova o valor do log ou registre só um
      identificador (por exemplo, os 4 últimos caracteres ou o id do usuário).
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      category: security
      cwe: "CWE-532: Insertion of Sensitive Information into Log File"
      owasp: A09:2021 - Security Logging and Monitoring Failures

  - id: sentinel-log-injection
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-inside: |
              $RET $M(..., @$A(...) String $P, ...) { ... }
          - metavariable-regex:
              metavariable: $A
              regex: ^(RequestParam|PathVariable|RequestHeader|CookieValue|RequestBody|QueryParam|PathParam|HeaderParam)$
          - focus-metavariable: $P
      - pattern: $REQ.getParameter(...)
      - pattern: $REQ.getHeader(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $LOG.info($MSG, ...)
              - pattern: $LOG.debug($MSG, ...)
              - pattern: $LOG.warn($MSG, ...)
              - pattern: $LOG.error($MSG, ...)
              - pattern: $LOG.trace($MSG, ...)
          - metavariable-regex:
              metavariable: $LOG
              regex: (?i)^(\w+\.)?(log|logger)$
          - focus-metavariable: $MSG
    pattern-sanitizers:
      - pattern: $X.replace(...)
      - pattern: $X.replaceAll(...)
      - pattern: StringEscapeUtils.escapeJava(...)
    message: >
      Dado da requisição escrito no log sem tratar quebras de linha: o atacante forja linhas ("log spoofing") e
      esconde ataques. Remova \r e \n do valor antes de registrar ou use um layout que escape (JSON).
    severity: WARNING
    languages: [java]
    paths:
      exclude: ["**/test/**"]
    metadata:
      category: security
      cwe: "CWE-117: Improper Output Neutralization for Logs"
      owasp: A09:2021 - Security Logging and Monitoring Failures
