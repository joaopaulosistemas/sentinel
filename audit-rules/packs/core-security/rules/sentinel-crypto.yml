# Criptografia fraca e desserialização insegura (OWASP A02 / A08).
rules:
  - id: sentinel-crypto-hash-fraco
    patterns:
      - pattern-either:
          - pattern: MessageDigest.getInstance($ALG, ...)
          - pattern: java.security.MessageDigest.getInstance($ALG, ...)
      - metavariable-regex:
          metavariable: $ALG
          regex: (?i)^"(MD2|MD4|MD5|SHA-?1)"$
    message: >
      Algoritmo de hash fraco (MD5/SHA-1). Use SHA-256 ou superior; para senhas, use bcrypt, scrypt ou Argon2.
    severity: WARNING
    languages: [java]
    metadata:
      category: security
      cwe: "CWE-328: Use of Weak Hash"
      owasp: A02:2021 - Cryptographic Failures

  - id: sentinel-crypto-cifra-fraca
    patterns:
      - pattern-either:
          - pattern: Cipher.getInstance($ALG, ...)
          - pattern: javax.crypto.Cipher.getInstance($ALG, ...)
      - metavariable-regex:
          metavariable: $ALG
          regex: (?i)^"((DES|DESEDE|3DES|TRIPLEDES|RC2|RC4|ARCFOUR|BLOWFISH)(/.*)?|AES|[A-Z0-9]+/ECB(/.*)?)"$
    message: >
      Cifra fraca ou modo inseguro (DES/3DES, RC4, Blowfish, AES/ECB ou AES sem modo, que cai em ECB). Use AES/GCM/NoPadding com IV aleatório e único.
    severity: ERROR
    languages: [java]
    metadata:
      category: security
      cwe: "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
      owasp: A02:2021 - Cryptographic Failures

  - id: sentinel-crypto-random-previsivel
    patterns:
      - pattern-either:
          - pattern: new java.util.Random()
          - pattern: Math.random()
      - pattern-inside: |
          $RET $M(...) { ... }
      - metavariable-regex:
          metavariable: $M
          regex: (?i).*(token|senha|password|secret|otp|session|nonce|salt|key).*
    message: >
      Gerador pseudoaleatório previsível usado onde segurança importa (token, senha, OTP). Use java.security.SecureRandom.
    severity: ERROR
    languages: [java]
    metadata:
      category: security
      cwe: "CWE-338: Use of Cryptographically Weak Pseudo-Random Number Generator (PRNG)"
      owasp: A02:2021 - Cryptographic Failures

  - id: sentinel-desserializacao-insegura
    pattern-either:
      - pattern: new ObjectInputStream(...).readObject()
      - pattern: (ObjectInputStream $O).readObject()
    message: >
      Desserialização nativa do Java (ObjectInputStream.readObject): permite execução de código se a entrada não for confiável.
      Use JSON/Protobuf ou configure um filtro (ObjectInputFilter) com lista de classes permitidas.
    severity: ERROR
    languages: [java]
    metadata:
      category: security
      cwe: "CWE-502: Deserialization of Untrusted Data"
      owasp: A08:2021 - Software and Data Integrity Failures

  - id: sentinel-crypto-random-servidor
    patterns:
      - pattern-either:
          - pattern: new java.util.Random(...)
          - pattern: new Random(...)
          - pattern: Math.random()
          - pattern: java.lang.Math.random()
      - pattern-either:
          - pattern-inside: |
              class $C extends HttpServlet { ... }
          - pattern-inside: |
              @RestController
              class $C { ... }
          - pattern-inside: |
              @Controller
              class $C { ... }
          - pattern-inside: |
              @Service
              class $C { ... }
    message: >
      java.util.Random e Math.random() são previsíveis. Em código de servidor, se o valor protege algo (token, identificador de sessão,
      senha provisória, código de confirmação), use java.security.SecureRandom. Se for só sorteio ou jitter, ignore este aviso com justificativa.
    severity: INFO
    languages: [java]
    metadata:
      category: security
      cwe: "CWE-330: Use of Insufficiently Random Values"
      owasp: A02:2021 - Cryptographic Failures

  # nextBytes preenche um vetor de bytes: quase sempre token, sal, IV ou chave, em qualquer classe (não só servlet/controller)
  - id: sentinel-crypto-random-nextbytes
    patterns:
      - pattern-either:
          - pattern: new java.util.Random(...).nextBytes(...)
          - pattern: new Random(...).nextBytes(...)
          - pattern: (java.util.Random $R).nextBytes(...)
          - pattern: (Random $R).nextBytes(...)
    message: >
      java.util.Random.nextBytes gera bytes previsíveis. Bytes aleatórios costumam virar token, sal, IV ou chave:
      use java.security.SecureRandom. Se não protege nada, ignore este aviso com justificativa.
    severity: WARNING
    languages: [java]
    metadata:
      category: security
      cwe: "CWE-330: Use of Insufficiently Random Values"
      owasp: A02:2021 - Cryptographic Failures

  - id: sentinel-crypto-chave-fixa-no-codigo
    pattern-either:
      - pattern: new SecretKeySpec("...".getBytes(...), ...)
      # constante byte[] com nome de segredo e texto fixo (private static final byte[] SECRET = "...".getBytes()), usada depois em SecretKeySpec ou HMAC
      - patterns:
          - pattern: byte[] $K = "$V".getBytes(...);
          - metavariable-regex:
              metavariable: $K
              regex: "^(?i:.*(?:key|chave|secret|segredo|passphrase).*)$"
          - metavariable-regex:
              metavariable: $V
              regex: '^(?![a-z0-9]+(\.[a-z0-9]+)+$).{8,}$'
      - patterns:
          - pattern: String $K = "$V";
          - metavariable-regex:
              metavariable: $K
              regex: "^(?i:.*(?:key|chave|secret|segredo|passphrase).*)$"
          # constante que nomeia atributo, parâmetro, cabeçalho, propriedade, coluna ou claim ("SESSION_ATTR_ADMIN_KEY") guarda o NOME de uma chave de busca, não uma chave criptográfica
          - metavariable-regex:
              metavariable: $K
              regex: '^(?!(?i:.*(?:attr|attribute|param|parametro|header|cabecalho|prop|property|field|campo|column|coluna|claim|cookie|label|json|map).*key|.*key.*(?:attr|attribute|param|header|prop|property|field|column|claim|cookie|label|json|name|nome))).*$'
          # valor com cara de nome (user_id, app.crypto.key, X-Secret) é identificador de campo ou cabeçalho, não segredo
          - metavariable-regex:
              metavariable: $V
              regex: '^(?![a-z0-9]+([._-][a-z0-9]+)+$)(?![A-Z][A-Za-z0-9]*(-[A-Za-z0-9]+)+$).{4,}$'
          # frase de mensagem ao usuário (maiúscula inicial, 4+ palavras, pontuação final) não é chave
          - metavariable-regex:
              metavariable: $V
              regex: '^(?![A-Z][^ ]* [^ ]* [^ ]* .*[.!?]$)'
          # constante CAMPO_KEY com palavra minúscula (EMAIL_KEY = "email") é o nome de uma chave de SharedPreferences ou Map, não segredo; nomes de cripto (SECRET, AES, MASTER, API...) continuam alertando
          - pattern-not-regex: 'String\s+(?![A-Z0-9_]*(?:SECRET|SEGREDO|CHAVE|AES|DES|RSA|HMAC|CRYPT|CIPHER|MASTER|PRIVATE|SIGN|SALT|TOKEN|API|PASSPHRASE))[A-Z][A-Z0-9]*(?:_[A-Z0-9]+)*_KEY\s*=\s*"[a-z]+(?:_[a-z]+)*"'
    message: >
      Chave de criptografia escrita no código-fonte (CWE-321). Ela vai para o Git e para o binário/APK, e quem a
      extrai decifra todos os dados. Gere a chave no armazém seguro do sistema (Android Keystore, KMS, cofre) ou leia
      de configuração externa.
    severity: ERROR
    languages: [java]
    metadata:
      category: security
      cwe: "CWE-321: Use of Hard-coded Cryptographic Key"
      owasp: A02:2021 - Cryptographic Failures

  - id: sentinel-crypto-iv-fixo
    pattern-either:
      - pattern: new IvParameterSpec(new byte[$N])
      - pattern: new IvParameterSpec("...".getBytes(...))
    message: >
      Vetor de inicialização (IV) fixo ou zerado (CWE-329). Com o mesmo IV, textos iguais geram o mesmo texto cifrado
      e o modo CBC/CTR/GCM perde a garantia. Gere um IV aleatório com SecureRandom para cada operação e envie-o junto
      do texto cifrado.
    severity: WARNING
    languages: [java]
    metadata:
      category: security
      cwe: "CWE-329: Generation of Predictable IV with CBC Mode"
      owasp: A02:2021 - Cryptographic Failures
