# Injeção (OWASP A03:2021). Usa taint mode: o dado "sujo" vem da requisição (getParameter, cabeçalho, cookie,
# parâmetros de método) e segue por concatenação, String.format e variáveis até a chamada perigosa. Concatenar
# constantes não é achado (medido no OWASP Benchmark).
rules:
  - id: sentinel-sql-injection
    mode: taint
    pattern-sources:
      - pattern: $REQ.getParameter(...)
      - pattern: $REQ.getParameterValues(...)
      - pattern: $REQ.getHeader(...)
      - pattern: $REQ.getHeaders(...)
      - pattern: $REQ.getParameterNames()
      - pattern: $REQ.getParameterMap()
      - pattern: $REQ.getRequestURL()
      - pattern: $REQ.getQueryString()
      - pattern: $C.getValue()
      - patterns:
          - pattern-inside: |
              $RET $M(..., String $P, ...) { ... }
          - focus-metavariable: $P
    pattern-sinks:
      - patterns:
          - pattern: $OBJ.$M($ARG, ...)
          - focus-metavariable: $ARG
          - metavariable-regex:
              metavariable: $M
              regex: ^(executeQuery|executeUpdate|executeLargeUpdate|prepareStatement|prepareCall|createQuery|createNativeQuery|addBatch|queryForObject|queryForList|queryForMap|queryForRowSet|batchUpdate)$
      # execute, update e query também existem em Runnable, MessageDigest, Elasticsearch e serviços de domínio:
      # só valem em receptor JDBC (tipo conhecido ou nome que o denuncie, para campos estáticos de outra classe).
      - patterns:
          - pattern: $R.$M($ARG, ...)
          - focus-metavariable: $ARG
          - metavariable-regex:
              metavariable: $R
              regex: (?i)^(.*\.)?\w*(jdbc|template|stmt|statement)\w*$
          - metavariable-regex:
              metavariable: $M
              regex: ^(execute|update|query)$
      - patterns:
          - pattern-either:
              - pattern: (java.sql.Statement $S).execute($ARG, ...)
              - pattern: (Statement $S).execute($ARG, ...)
          - focus-metavariable: $ARG
      - patterns:
          - pattern-either:
              - pattern: (JdbcTemplate $S).$M($ARG, ...)
              - pattern: (JdbcOperations $S).$M($ARG, ...)
              - pattern: (NamedParameterJdbcTemplate $S).$M($ARG, ...)
              - pattern: (org.springframework.jdbc.core.JdbcTemplate $S).$M($ARG, ...)
              - pattern: (org.springframework.jdbc.core.JdbcOperations $S).$M($ARG, ...)
              - pattern: (org.springframework.jdbc.core.namedparam.NamedParameterJdbcTemplate $S).$M($ARG, ...)
          - focus-metavariable: $ARG
          - metavariable-regex:
              metavariable: $M
              regex: ^(execute|update|query)$
    message: >
      Possível SQL Injection (OWASP A03): a consulta é montada por concatenação ou String.format
      com valores variáveis. Use PreparedStatement / parâmetros nomeados (?) em vez de concatenar.
    severity: ERROR
    languages: [java]
    metadata:
      category: security
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      owasp: A03:2021 - Injection

  - id: sentinel-command-injection
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: '"..." + $X'
              - pattern: '$X + "..."'
          - pattern-not: '"..." + "..."'
    pattern-sinks:
      - pattern-either:
          - pattern: Runtime.getRuntime().exec($CMD, ...)
          - pattern: new ProcessBuilder($CMD, ...)
    message: >
      Possível Command Injection (OWASP A03): comando do sistema operacional montado com valor variável.
      Valide contra uma lista de permitidos e passe argumentos como lista, nunca como texto concatenado.
    severity: ERROR
    languages: [java]
    metadata:
      category: security
      cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command"
      owasp: A03:2021 - Injection

  - id: sentinel-command-injection-requisicao
    mode: taint
    pattern-sources:
      - pattern: $REQ.getParameter(...)
      - pattern: $REQ.getParameterValues(...)
      - pattern: $REQ.getHeader(...)
      - pattern: $REQ.getHeaders(...)
      - pattern: $REQ.getParameterNames()
      - pattern: $REQ.getParameterMap()
      - pattern: $REQ.getRequestURL()
      - pattern: $REQ.getQueryString()
      - pattern: $C.getValue()
      - patterns:
          - pattern-inside: |
              $RET $M(..., @$A(...) String $P, ...) { ... }
          - metavariable-regex:
              metavariable: $A
              regex: ^(RequestParam|PathVariable|RequestHeader|QueryParam|PathParam|FormParam|HeaderParam)$
          - focus-metavariable: $P
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $R.exec($CMD, ...)
              - pattern: new ProcessBuilder($CMD, ...)
              - pattern: $PB.command($CMD, ...)
          - focus-metavariable: $CMD
    pattern-sanitizers:
      - patterns:
          - pattern: $ENC.$F(...)
          - metavariable-regex:
              metavariable: $F
              regex: ^(encodeFor(OS|Shell)|quote|escapeShell.*)$
    message: >
      Possível Command Injection (CWE-78): dado da requisição chega à execução de um comando do sistema operacional.
      Valide contra uma lista de permitidos e passe os argumentos como lista, nunca como texto concatenado.
    severity: ERROR
    languages: [java]
    metadata:
      category: security
      cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command"
      owasp: A03:2021 - Injection

  - id: sentinel-command-injection-variable
    patterns:
      - pattern-either:
          - pattern: Runtime.getRuntime().exec($CMD)
          - pattern: new ProcessBuilder($CMD)
      - pattern-not: Runtime.getRuntime().exec("...")
      - pattern-not: Runtime.getRuntime().exec(new String[]{...})
      - pattern-not: new ProcessBuilder("...")
      - metavariable-regex:
          metavariable: $CMD
          regex: ^[A-Za-z_][A-Za-z0-9_.()]*$
    message: >
      Possível Command Injection (OWASP A03): '$CMD' é passado direto para execução de processo.
      Garanta que o valor não vem de entrada do usuário ou valide-o contra uma lista de permitidos.
    severity: WARNING
    languages: [java]
    metadata:
      category: security
      cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command"
      owasp: A03:2021 - Injection

  - id: sentinel-command-injection-shell
    patterns:
      - pattern-either:
          - pattern: new ProcessBuilder($SH, $FLAG, $CMD)
          - pattern: Runtime.getRuntime().exec(new String[]{$SH, $FLAG, $CMD})
      - metavariable-regex:
          metavariable: $FLAG
          regex: ^"(-c|/c)"$
      - pattern-not: new ProcessBuilder($SH, $FLAG, "...")
      - pattern-not: Runtime.getRuntime().exec(new String[]{$SH, $FLAG, "..."})
    message: >
      Comando montado para um interpretador de shell (sh -c / cmd /c): '$CMD' é interpretado pelo shell, então
      qualquer valor do usuário vira injeção de comando (OWASP A03). Evite shell: passe cada argumento separado
      ao ProcessBuilder e valide o valor contra uma lista de permitidos.
    severity: ERROR
    languages: [java]
    metadata:
      category: security
      cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command"
      owasp: A03:2021 - Injection

  - id: sentinel-ldap-injection
    mode: taint
    pattern-sources:
      - pattern: $REQ.getParameter(...)
      - pattern: $REQ.getParameterValues(...)
      - pattern: $REQ.getHeader(...)
      - pattern: $REQ.getHeaders(...)
      - pattern: $REQ.getParameterNames()
      - pattern: $REQ.getParameterMap()
      - pattern: $REQ.getRequestURL()
      - pattern: $REQ.getQueryString()
      - pattern: $C.getValue()
      - patterns:
          - pattern-inside: |
              $RET $M(..., String $P, ...) { ... }
          - focus-metavariable: $P
    pattern-sinks:
      - patterns:
          - pattern: $CTX.search($BASE, $FILTER, ...)
          - focus-metavariable: $FILTER
    message: >
      Possível LDAP Injection (OWASP A03): filtro LDAP montado por concatenação.
      Escape os valores (RFC 4515) ou use filtros parametrizados do JNDI.
    severity: ERROR
    languages: [java]
    metadata:
      category: security
      cwe: "CWE-90: Improper Neutralization of Special Elements used in an LDAP Query"
      owasp: A03:2021 - Injection

  - id: sentinel-xpath-injection
    mode: taint
    pattern-sources:
      - pattern: $REQ.getParameter(...)
      - pattern: $REQ.getParameterValues(...)
      - pattern: $REQ.getHeader(...)
      - pattern: $REQ.getHeaders(...)
      - pattern: $REQ.getParameterNames()
      - pattern: $REQ.getParameterMap()
      - pattern: $REQ.getRequestURL()
      - pattern: $REQ.getQueryString()
      - pattern: $C.getValue()
      - patterns:
          - pattern-inside: |
              $RET $M(..., String $P, ...) { ... }
          - focus-metavariable: $P
    pattern-sinks:
      - patterns:
          - pattern: $XPATH.evaluate($EXPR, ...)
          - focus-metavariable: $EXPR
    message: >
      Possível XPath Injection (OWASP A03): expressão XPath montada por concatenação.
      Use XPathVariableResolver (consultas parametrizadas) em vez de concatenar valores.
    severity: ERROR
    languages: [java]
    metadata:
      category: security
      cwe: "CWE-643: Improper Neutralization of Data within XPath Expressions"
      owasp: A03:2021 - Injection
