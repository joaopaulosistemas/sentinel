rules:
  # Regras de segurança para backend Node/Express (JavaScript e TypeScript).
  # Fontes: dados da requisição (req.query, req.params, req.body, req.headers, req.cookies).
  # Escritas a partir de padrões comuns de aplicações Express; checadas no OWASP Juice Shop (alvo de treino).

  - id: sentinel-node-sql-injection
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-inside: |
              ({..., $P, ...}: Request, ...) => {...}
          - metavariable-regex:
              metavariable: $P
              regex: ^(params|query|body|headers|cookies)$
          - focus-metavariable: $P
      - patterns:
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.params
              - pattern: $REQ.body
              - pattern: $REQ.headers
              - pattern: $REQ.cookies
              # claims do token e da sessão (req.user, req.session) também chegam ao SQL sem escape:
              # com chave JWT fixa ou algoritmo `none` o cliente forja o valor, e a concatenação
              # continua errada mesmo com o token legítimo (injeção de segunda ordem)
              - pattern: $REQ.user
              - pattern: $REQ.session
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request)$
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $DB.query($Q, ...)
              - pattern: $DB.raw($Q, ...)
              - pattern: $DB.$METHOD($Q, ...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(query|raw|execute)$
          - focus-metavariable: $Q
      # driver sqlite3 (db.get/all/run/each/exec): só em objeto com nome de conexão, para não pegar Map.get etc.
      - patterns:
          - pattern: $DB.$METHOD($Q, ...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(get|all|run|each|exec|prepare)$
          - metavariable-regex:
              metavariable: $DB
              regex: ^(db|database|sqlite|sqlite3|conn|connection)$
          - focus-metavariable: $Q
      - patterns:
          - pattern-either:
              - pattern: Sequelize.literal($Q)
              - pattern: sequelize.literal($Q)
          - focus-metavariable: $Q
    pattern-sanitizers:
      - pattern: parseInt(...)
      - pattern: Number(...)
      - pattern: $X.escape(...)
      # template com tag de consulta parametrizada (@nearform/sql, sql-template-strings, slonik): a tag
      # transforma cada ${valor} em parâmetro do driver, não concatena no texto do SQL
      - patterns:
          - pattern: $TAG`...`
          - metavariable-regex:
              metavariable: $TAG
              regex: ^(SQL|sql|Sql|SQLStatement|sqlTag)$
    message: >
      Possível SQL injection (CWE-89): dado da requisição entra no texto da consulta. Use parâmetros
      (`replacements`/`bind` do Sequelize, `?` no driver) em vez de montar o SQL com `+` ou template string.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      owasp: A03:2021 - Injection

  - id: sentinel-node-prisma-raw-unsafe
    mode: taint
    pattern-sources:
      - pattern: |
          `...${$X}...`
      - patterns:
          - pattern: $A + $B
          - pattern-not: |
              "..." + "..."
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $PRISMA.$queryRawUnsafe($Q, ...)
              - pattern: $PRISMA.$executeRawUnsafe($Q, ...)
          - focus-metavariable: $Q
    message: >
      Possível SQL injection (CWE-89): `$queryRawUnsafe`/`$executeRawUnsafe` do Prisma recebe um texto montado por
      template string ou concatenação. Use `$queryRaw` com a tag `Prisma.sql` (valores viram parâmetros) ou passe os
      valores como argumentos posicionais (`$1`, `?`).
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      owasp: A03:2021 - Injection

  - id: sentinel-node-sqlite-sql-dinamico
    mode: taint
    pattern-sources:
      - pattern: |
          `...${$X}...`
      - patterns:
          - pattern: $A + $B
          - pattern-not: |
              "..." + "..."
    pattern-sinks:
      - patterns:
          - pattern-inside: |
              $DB = new Database(...)
              ...
          - pattern-either:
              - pattern: $DB.exec($Q)
              - pattern: $DB.prepare($Q)
          - focus-metavariable: $Q
    message: >
      Possível SQL injection (CWE-89): o texto da consulta do better-sqlite3 é montado por template string ou
      concatenação. Use `db.prepare("... WHERE campo = ?").all(valor)` com parâmetros; `db.exec` executa várias
      instruções de uma vez e não aceita parâmetros.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      owasp: A03:2021 - Injection

  - id: sentinel-node-nosql-where
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-inside: |
              ({..., $P, ...}: Request, ...) => {...}
          - metavariable-regex:
              metavariable: $P
              regex: ^(params|query|body|headers|cookies)$
          - focus-metavariable: $P
      - patterns:
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.params
              - pattern: $REQ.body
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request|ctx|ctx\.request)$
    pattern-sinks:
      - patterns:
          - pattern: '{..., $where: $X, ...}'
          - focus-metavariable: $X
    pattern-sanitizers:
      - pattern: parseInt(...)
      - pattern: Number(...)
    message: >
      Possível injeção NoSQL (CWE-943): dado da requisição vai para `$where`, que executa JavaScript no banco.
      Troque por operadores de consulta (`{ campo: valor }`) e valide o tipo do valor.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-943: Improper Neutralization of Special Elements in Data Query Logic"
      owasp: A03:2021 - Injection

  - id: sentinel-node-eval-requisicao
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-inside: |
              ({..., $P, ...}: Request, ...) => {...}
          - metavariable-regex:
              metavariable: $P
              regex: ^(params|query|body|headers|cookies)$
          - focus-metavariable: $P
      - patterns:
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.params
              - pattern: $REQ.body
              - pattern: $REQ.headers
              - pattern: $REQ.cookies
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request|ctx|ctx\.request)$
      - patterns:
          - pattern-either:
              - pattern: $EV.body
              - pattern: $EV.headers
              - pattern: $EV.queryStringParameters
              - pattern: $EV.pathParameters
          - metavariable-regex:
              metavariable: $EV
              regex: ^event$
      - patterns:
          - pattern-inside: |
              class $C { ... $M(..., @$DEC(...) $P: $T, ...) {...} ... }
          - metavariable-regex:
              metavariable: $DEC
              regex: ^(Query|Body|Param|Headers)$
          - focus-metavariable: $P
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: eval($X)
              - pattern: new Function(..., $X)
              - pattern: vm.runInContext($X, ...)
              - pattern: vm.runInNewContext($X, ...)
              - pattern: vm.runInThisContext($X, ...)
          - focus-metavariable: $X
    message: >
      Execução de código vinda da requisição (CWE-95): `eval`, `new Function` ou `vm.run*` recebe dado externo.
      Não execute texto do usuário; use um parser de expressões com lista de operações permitidas.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code ('Eval Injection')"
      owasp: A03:2021 - Injection

  - id: sentinel-node-eval-dinamico
    patterns:
      - pattern: eval($X)
      - pattern-not: eval("...")
      - pattern-not: eval(`...`)
      - pattern-not: eval(<... req ...>)
      - pattern-not: eval(<... request ...>)
    message: >
      `eval` com argumento que não é texto fixo (CWE-95). Mesmo sem origem externa óbvia, o dado pode vir do banco
      ou de outra camada. Troque por um parser (JSON.parse, avaliador de expressões com lista de operações).
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code ('Eval Injection')"
      owasp: A03:2021 - Injection

  - id: sentinel-node-function-dinamico
    patterns:
      - pattern: new Function(..., $X)
      - pattern-not: new Function(..., "...")
      - pattern-not: new Function(..., '...')
      - pattern-not: new Function(..., `...`)
    message: >
      `new Function` com corpo que não é texto fixo (CWE-95): equivale a `eval`. Quem controla o texto executa código no
      servidor, inclusive quando ele vem de um arquivo importado (YAML, JSON, planilha) ou do banco. Troque por
      um avaliador de expressões com lista de operações permitidas.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code ('Eval Injection')"
      owasp: A03:2021 - Injection

  - id: sentinel-node-xpath-injection
    patterns:
      - pattern: $X.$M($E, ...)
      - metavariable-regex:
          metavariable: $X
          regex: ^(xpath|xp|xpathLib)$
      - metavariable-regex:
          metavariable: $M
          regex: ^(evaluate|select|select1|selectWithResolver|parse)$
      - metavariable-regex:
          metavariable: $E
          regex: (?s).*(\$\{|\+)
    message: >
      Consulta XPath montada por concatenação ou interpolação (CWE-643): o valor do usuário vira parte da expressão e
      muda o que ela seleciona (`' or '1'='1`). Use variáveis do XPath (`xpath.parse('//a[@n=$nome]')` com `variables`)
      ou valide o valor contra uma lista de caracteres permitidos.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-643: Improper Neutralization of Data within XPath Expressions ('XPath Injection')"
      owasp: A03:2021 - Injection

  - id: sentinel-node-ldap-injection
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.params
              - pattern: $REQ.body
              - pattern: $REQ.headers
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request|ctx|ctx\.request)$
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: const $V = $T
              - pattern: let $V = $T
              - pattern: var $V = $T
              - pattern: $V = $T
              - pattern: '{..., filter: $T, ...}'
          - metavariable-regex:
              metavariable: $T
              regex: ^[`'"]\s*\([&|!(]*\s*\w[\w.-]*\s*[=~<>]
          - focus-metavariable: $T
    pattern-sanitizers:
      - patterns:
          - pattern: $F(...)
          - metavariable-regex:
              metavariable: $F
              regex: (?i).*(escap|sanitiz|ldapEncode)
    message: >
      Filtro LDAP montado com dado da requisição (CWE-90): o usuário injeta `*`, `)(` ou `|` e muda a busca no
      diretório. Escape o valor (RFC 4515: `\\28`, `\\29`, `\\2a`, `\\5c`, `\\00`) antes de interpolar, ou use filtro
      parametrizado da biblioteca.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-90: Improper Neutralization of Special Elements used in an LDAP Query ('LDAP Injection')"
      owasp: A03:2021 - Injection

  - id: sentinel-node-open-redirect
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-inside: |
              ({..., $P, ...}: Request, ...) => {...}
          - metavariable-regex:
              metavariable: $P
              regex: ^(params|query|body|headers|cookies)$
          - focus-metavariable: $P
      - patterns:
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.params
              - pattern: $REQ.body
              - pattern: $REQ.headers
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request|ctx|ctx\.request)$
      - patterns:
          # Express sem `req.query`: `url.parse(req.url, true)` devolve o objeto cujo `.query` vem do usuário
          - pattern: $P.parse($REQ.url, true)
          - metavariable-regex:
              metavariable: $P
              regex: ^(url|nodeUrl)$
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request)$
      - patterns:
          - pattern-inside: |
              class $C { ... $M(..., @$DEC(...) $P: $T, ...) {...} ... }
          - metavariable-regex:
              metavariable: $DEC
              regex: ^(Query|Body|Param|Headers)$
          - focus-metavariable: $P
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $RES.redirect($U)
              - pattern: $RES.redirect($S, $U)
          - metavariable-regex:
              metavariable: $RES
              regex: ^(res|response)$
          # host fixo no literal (`'https://portal.exemplo.com/x?o=' + valor`): o dado só vai para o caminho/consulta
          - metavariable-regex:
              metavariable: $U
              regex: ^(?!["'`]https?://[^/"'`$\s]+[/?])
          # caminho do próprio site (`'/perfil?id=' + valor`): a barra seguida de letra mantém o host; `'/' + valor` e `'//'` seguem marcados
          - metavariable-regex:
              metavariable: $U
              regex: ^(?!["'`]/[^/\\"'`$\s])
          - focus-metavariable: $U
      # Egg: `ctx.unsafeRedirect(url)` desliga a lista de domínios do framework (o nome já diz)
      - pattern: ctx.unsafeRedirect($U)
      - patterns:
          - pattern-inside: |
              class $C { ... @Redirect(...) $M(...) {...} ... }
          - pattern-either:
              - pattern: 'return { url: $U, ... }'
              - pattern: 'return { $U, ... }'
          - focus-metavariable: $U
    message: >
      Redirecionamento aberto (CWE-601): o destino vem da requisição. Aceite só caminhos do próprio site ou
      compare o destino exato com uma lista de permissão (não use `includes`/`indexOf` sobre a URL).
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-601: URL Redirection to Untrusted Site ('Open Redirect')"
      owasp: A01:2021 - Broken Access Control

  - id: sentinel-node-path-traversal
    mode: taint
    pattern-sources:
      - patterns:
          # Next.js (App Router): parâmetro lido de `new URL(request.url).searchParams` (não vale para `useSearchParams()` do navegador)
          - pattern-inside: |
              const { searchParams } = new URL($REQ.url)
              ...
          - pattern: searchParams.get(...)
      - patterns:
          # Next.js: `request.nextUrl.searchParams.get(...)` e corpo lido com `await request.json()/text()/formData()`
          - pattern-either:
              - pattern: $REQ.nextUrl.searchParams.get(...)
              - pattern: await $REQ.json()
              - pattern: await $REQ.text()
              - pattern: await $REQ.formData()
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request)$
      - patterns:
          # Next.js: resultado `.data` de um validador que recebe a requisição (`parseBody(request, schema)`, `parseQuery(searchParams, schema)`)
          - pattern-either:
              - pattern-inside: |
                  $P = await $F($REQ, ...)
                  ...
              - pattern-inside: |
                  $P = $F($REQ, ...)
                  ...
          - pattern: $P.data
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request|searchParams)$
      - patterns:
          - pattern-inside: |
              ({..., $P, ...}: Request, ...) => {...}
          - metavariable-regex:
              metavariable: $P
              regex: ^(params|query|body|headers|cookies)$
          - focus-metavariable: $P
      - patterns:
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.params
              - pattern: $REQ.body
              - pattern: $REQ.headers
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request|ctx|ctx\.request)$
      - patterns:
          - pattern: $REQ.file.originalname
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request|ctx|ctx\.request)$
      - patterns:
          - pattern-inside: |
              class $C { ... $M(..., @$DEC(...) $P: $T, ...) {...} ... }
          - metavariable-regex:
              metavariable: $DEC
              regex: ^(Query|Body|Param|Headers)$
          - focus-metavariable: $P
      - patterns:
          # `function $F(...)` casa função, seta e async nos dois motores (Semgrep não casa `($A, $B, ...) => {...}`)
          - pattern-inside: |
              function $F($PARENT, $ARGS, ...) {...}
          - pattern: $ARGS.$K
          - metavariable-regex:
              metavariable: $ARGS
              regex: ^args$
      - patterns:
          - pattern: $J.decode(...)
          - metavariable-regex:
              metavariable: $J
              regex: ^(jwt|jsonwebtoken)$
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $FS.sendFile($P, ...)
              - pattern: $FS.download($P, ...)
              - pattern: $FS.readFile($P, ...)
              - pattern: $FS.readFileSync($P, ...)
              - pattern: $FS.createReadStream($P, ...)
              - pattern: $FS.createWriteStream($P, ...)
              - pattern: $FS.writeFile($P, ...)
              - pattern: $FS.writeFileSync($P, ...)
              - pattern: $FS.unlink($P, ...)
              - pattern: $FS.unlinkSync($P, ...)
              - pattern: $FS.readdir($P, ...)
              # fs-extra (`fse`, `fsExtra`): leitura/gravação/remoção de JSON e arquivos
              - pattern: $FS.readJson($P, ...)
              - pattern: $FS.readJsonSync($P, ...)
              - pattern: $FS.outputFile($P, ...)
              - pattern: $FS.outputFileSync($P, ...)
              - pattern: $FS.outputJson($P, ...)
              - pattern: $FS.outputJsonSync($P, ...)
              - pattern: $FS.remove($P, ...)
              - pattern: $FS.removeSync($P, ...)
          - metavariable-regex:
              metavariable: $FS
              regex: ^(res|response|fs|fsp|fsPromise|fsPromises|fs\.promises|promises|fse|fsExtra)$
          - focus-metavariable: $P
      - patterns:
          # importação nomeada (`import { readFile } from "fs/promises"`)
          - pattern-either:
              - pattern: readFile($P, ...)
              - pattern: readFileSync($P, ...)
              - pattern: createReadStream($P, ...)
              - pattern: writeFile($P, ...)
              - pattern: writeFileSync($P, ...)
              - pattern: unlink($P, ...)
              - pattern: readdir($P, ...)
          - focus-metavariable: $P
    pattern-sanitizers:
      - pattern: path.basename(...)
      - pattern: $X.replace(...)
    message: >
      Possível path traversal (CWE-22): o caminho do arquivo vem da requisição. Use só `path.basename`, resolva o
      caminho final e confira que continua dentro da pasta permitida (`resolved.startsWith(base + path.sep)`).
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
      owasp: A01:2021 - Broken Access Control

  - id: sentinel-node-ssrf
    mode: taint
    pattern-sources:
      - patterns:
          # Next.js (App Router): parâmetro lido de `new URL(request.url).searchParams` (não vale para `useSearchParams()` do navegador)
          - pattern-inside: |
              const { searchParams } = new URL($REQ.url)
              ...
          - pattern: searchParams.get(...)
      - patterns:
          # Next.js: `request.nextUrl.searchParams.get(...)` e corpo lido com `await request.json()/text()/formData()`
          - pattern-either:
              - pattern: $REQ.nextUrl.searchParams.get(...)
              - pattern: await $REQ.json()
              - pattern: await $REQ.text()
              - pattern: await $REQ.formData()
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request)$
      - patterns:
          # Next.js: resultado `.data` de um validador que recebe a requisição (`parseBody(request, schema)`, `parseQuery(searchParams, schema)`)
          - pattern-either:
              - pattern-inside: |
                  $P = await $F($REQ, ...)
                  ...
              - pattern-inside: |
                  $P = $F($REQ, ...)
                  ...
          - pattern: $P.data
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request|searchParams)$
      - patterns:
          - pattern-inside: |
              ({..., $P, ...}: Request, ...) => {...}
          - metavariable-regex:
              metavariable: $P
              regex: ^(params|query|body|headers|cookies)$
          - focus-metavariable: $P
      - patterns:
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.params
              - pattern: $REQ.body
              - pattern: $REQ.headers
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request|ctx|ctx\.request)$
      - patterns:
          # Express sem `req.query`: `url.parse(req.url, true)` devolve o objeto cujo `.query` vem do usuário
          - pattern: $P.parse($REQ.url, true)
          - metavariable-regex:
              metavariable: $P
              regex: ^(url|nodeUrl)$
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request)$
      - patterns:
          - pattern-inside: |
              class $C { ... $M(..., @$DEC(...) $P: $T, ...) {...} ... }
          - metavariable-regex:
              metavariable: $DEC
              regex: ^(Query|Body|Param|Headers)$
          - focus-metavariable: $P
      - patterns:
          # `function $F(...)` casa função, seta e async nos dois motores (Semgrep não casa `($A, $B, ...) => {...}`)
          - pattern-inside: |
              function $F($PARENT, $ARGS, ...) {...}
          - pattern: $ARGS.$K
          - metavariable-regex:
              metavariable: $ARGS
              regex: ^args$
      - patterns:
          - pattern: $J.decode(...)
          - metavariable-regex:
              metavariable: $J
              regex: ^(jwt|jsonwebtoken)$
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: fetch($U, ...)
              - pattern: axios($U, ...)
              - pattern: axios.get($U, ...)
              - pattern: axios.post($U, ...)
              - pattern: axios.put($U, ...)
              - pattern: axios.delete($U, ...)
              - pattern: http.get($U, ...)
              - pattern: https.get($U, ...)
              - pattern: got($U, ...)
              - pattern: got.get($U, ...)
              - pattern: request($U, ...)
              - pattern: needle.get($U, ...)
              - pattern: needle.post($U, ...)
              - pattern: needle.put($U, ...)
              - pattern: needle.patch($U, ...)
              - pattern: needle.delete($U, ...)
              - pattern: needle.head($U, ...)
              - pattern: superagent.get($U, ...)
              - pattern: superagent.post($U, ...)
              - pattern: superagent.put($U, ...)
              - pattern: superagent.delete($U, ...)
              - pattern: http.request($U, ...)
              - pattern: https.request($U, ...)
              # Egg: `ctx.curl(url)` é o cliente HTTP do framework
              - pattern: ctx.curl($U, ...)
          - focus-metavariable: $U
      # cliente escolhido por ternário (`const client = url.startsWith('https') ? https : http; client.get(url)`)
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $C = $COND ? https : http;
                  ...
              - pattern-inside: |
                  $C = $COND ? http : https;
                  ...
          - pattern-either:
              - pattern: $C.get($U, ...)
              - pattern: $C.request($U, ...)
          - focus-metavariable: $U
    message: >
      Possível SSRF (CWE-918): o servidor faz uma requisição para uma URL vinda do usuário. Valide o destino contra
      uma lista de hosts permitidos, bloqueie IPs internos (127.0.0.0/8, 10.0.0.0/8, 169.254.0.0/16) e não siga
      redirecionamentos sem conferir.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-918: Server-Side Request Forgery (SSRF)"
      owasp: A10:2021 - Server-Side Request Forgery

  - id: sentinel-node-hash-fraco
    patterns:
      - pattern-either:
          - pattern: $C.createHash("md5")
          - pattern: $C.createHash("sha1")
          - pattern: $C.createHash("MD5")
          - pattern: $C.createHash("SHA1")
      - metavariable-regex:
          metavariable: $C
          regex: ^(crypto|nodeCrypto)$
    message: >
      Hash fraco (CWE-328): MD5 e SHA-1 permitem colisão. Para senha use `bcrypt`, `scrypt` ou `argon2`; para
      integridade use SHA-256 ou superior.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-328: Use of Weak Hash"
      owasp: A02:2021 - Cryptographic Failures

  - id: sentinel-node-senha-hash-rapido
    patterns:
      - pattern: $C.createHash($ALG).update($PWD, ...)
      - metavariable-regex:
          metavariable: $C
          regex: ^(crypto|nodeCrypto)$
      - metavariable-regex:
          metavariable: $ALG
          regex: (?i)^["'`]sha-?(224|256|384|512)["'`]$
      - metavariable-regex:
          metavariable: $PWD
          regex: (?is).*(passw|senha|pwd)
    message: >
      Senha guardada com hash rápido (CWE-916): SHA-2 calculado de uma só passada é barato de testar por força bruta
      em GPU, com ou sem sal. Use `bcrypt`, `scrypt` (`crypto.scrypt`) ou `argon2`, que têm custo ajustável.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-916: Use of Password Hash With Insufficient Computational Effort"
      owasp: A02:2021 - Cryptographic Failures

  - id: sentinel-node-cifra-ecb
    patterns:
      - pattern-either:
          - pattern: $C.createCipheriv($ALG, ...)
          - pattern: $C.createDecipheriv($ALG, ...)
      - metavariable-regex:
          metavariable: $C
          regex: ^(crypto|nodeCrypto)$
      - metavariable-regex:
          metavariable: $ALG
          regex: (?i)^['"`][a-z0-9-]*-ecb['"`]$
    message: >
      Modo ECB (CWE-327): blocos iguais de texto claro viram blocos iguais de texto cifrado, o que revela padrões e permite
      reordenar ou recortar blocos sem a chave. Use `aes-256-gcm` com IV aleatório e único por mensagem.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
      owasp: A02:2021 - Cryptographic Failures

  - id: sentinel-node-iv-fixo
    patterns:
      - pattern-either:
          - pattern: $C.createCipheriv($ALG, $KEY, $IV, ...)
          - pattern: $C.createDecipheriv($ALG, $KEY, $IV, ...)
      - metavariable-regex:
          metavariable: $C
          regex: ^(crypto|nodeCrypto)$
      - metavariable-regex:
          metavariable: $ALG
          regex: (?i)^(?!.*-ecb)
      - metavariable-pattern:
          metavariable: $IV
          pattern-either:
            - pattern: '"..."'
            - pattern: Buffer.from("...", ...)
            - pattern: Buffer.alloc(...)
            - pattern-regex: ^[A-Z]\w*\.(IV|iv|Iv|INIT_VECTOR|NONCE)$
    message: >
      IV fixo (CWE-329): com o mesmo IV e a mesma chave, mensagens com o mesmo começo geram o mesmo começo cifrado, e em modos de
      fluxo (CTR, GCM) a repetição permite recuperar o texto claro. Gere um IV novo por mensagem com `crypto.randomBytes(16)`
      (12 bytes no GCM) e envie-o junto do texto cifrado.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-329: Generation of Predictable IV with CBC Mode"
      owasp: A02:2021 - Cryptographic Failures

  - id: sentinel-node-xxe
    pattern-either:
      - pattern: '$L.parseXml($X, {..., noent: true, ...})'
      - pattern: '$L.parseXmlString($X, {..., noent: true, ...})'
      - pattern: '$L.parseXml($X, {..., replaceEntities: true, ...})'
      - pattern: '$L.parseXmlString($X, {..., replaceEntities: true, ...})'
      # opções guardadas numa variável (`const opts = { noent: true }; parseXmlString(x, opts)`): `noent: true` só existe no libxml
      - patterns:
          - pattern: '{..., noent: true, ...}'
          - pattern-inside: |
              $O = {...}
    message: >
      Entidades externas XML ligadas (`noent: true` ou `replaceEntities: true`, CWE-611): o parser lê arquivos locais e faz requisições a
      pedido do documento. Remova a opção e rejeite DOCTYPE em XML vindo de fora.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-611: Improper Restriction of XML External Entity Reference"
      owasp: A05:2021 - Security Misconfiguration

  - id: sentinel-node-command-injection
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-inside: |
              ({..., $P, ...}: Request, ...) => {...}
          - metavariable-regex:
              metavariable: $P
              regex: ^(params|query|body|headers|cookies)$
          - focus-metavariable: $P
      - patterns:
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.params
              - pattern: $REQ.body
              - pattern: $REQ.headers
              - pattern: $REQ.cookies
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request|ctx|ctx\.request)$
      - patterns:
          - pattern-inside: |
              class $C { ... $M(..., @$DEC(...) $P: $T, ...) {...} ... }
          - metavariable-regex:
              metavariable: $DEC
              regex: ^(Query|Body|Param|Headers)$
          - focus-metavariable: $P
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: exec($C, ...)
              - pattern: execSync($C, ...)
          - focus-metavariable: $C
      - patterns:
          - pattern-either:
              - pattern: $CP.exec($C, ...)
              - pattern: $CP.execSync($C, ...)
          - metavariable-regex:
              metavariable: $CP
              regex: ^(child_process|childProcess|cp|shell)$
          - focus-metavariable: $C
      - patterns:
          - pattern-either:
              - pattern: spawn($C, ...)
              - pattern: spawnSync($C, ...)
              - pattern: execFile($C, ...)
              - pattern: execFileSync($C, ...)
          - focus-metavariable: $C
    pattern-sanitizers:
      - pattern: shellEscape(...)
      - pattern: parseInt(...)
      - pattern: Number(...)
    message: >
      Possível injeção de comando (CWE-78): dado da requisição vai para `exec`, que roda o texto em um shell.
      Use `execFile`/`spawn` com os argumentos separados (sem `shell: true`) e valide o valor contra uma lista de permissão.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"
      owasp: A03:2021 - Injection

  - id: sentinel-node-exec-dinamico
    patterns:
      - pattern-either:
          - pattern: exec($X, ...)
          - pattern: execSync($X, ...)
          - patterns:
              - pattern-either:
                  - pattern: $CP.exec($X, ...)
                  - pattern: $CP.execSync($X, ...)
              - metavariable-regex:
                  metavariable: $CP
                  regex: ^(child_process|childProcess|cp|shell)$
      - pattern-not: $F("...", ...)
      - pattern-not: $F(<... req ...>, ...)
      - pattern-not: $F(<... request ...>, ...)
      - pattern-not-inside: |
          ({..., $P, ...}: Request, ...) => {...}
    message: >
      `exec` recebe um comando que não é texto fixo (CWE-78). O shell interpreta o texto inteiro; se qualquer parte vier
      de arquivo, XML, banco ou outra camada, vira injeção de comando. Use `execFile`/`spawn` com os argumentos separados
      e valide o valor contra uma lista de permissão.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"
      owasp: A03:2021 - Injection

  - id: sentinel-node-desserializacao
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-inside: |
              ({..., $P, ...}: Request, ...) => {...}
          - metavariable-regex:
              metavariable: $P
              regex: ^(params|query|body|headers|cookies)$
          - focus-metavariable: $P
      - patterns:
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.params
              - pattern: $REQ.body
              - pattern: $REQ.headers
              - pattern: $REQ.cookies
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request|ctx|ctx\.request)$
      - patterns:
          - pattern-either:
              - pattern: $EV.body
              - pattern: $EV.headers
              - pattern: $EV.queryStringParameters
              - pattern: $EV.pathParameters
          - metavariable-regex:
              metavariable: $EV
              regex: ^event$
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: unserialize($X, ...)
              - pattern: $S.unserialize($X, ...)
          - focus-metavariable: $X
    message: >
      Desserialização de dado da requisição (CWE-502): `node-serialize` executa funções embutidas no texto. Troque
      por JSON.parse e valide o formato do resultado.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-502: Deserialization of Untrusted Data"
      owasp: A08:2021 - Software and Data Integrity Failures

  - id: sentinel-node-node-serialize-unserialize
    patterns:
      - pattern: $S.unserialize($X, ...)
      - pattern-inside: |
          $S = require('node-serialize')
          ...
      - pattern-not: $S.unserialize('...')
      - focus-metavariable: $X
    message: >
      `unserialize` do `node-serialize` com texto que não é literal (CWE-502, CVE-2017-5941): o pacote executa funções
      embutidas no texto (`_$$ND_FUNC$$_`), então quem controla o texto executa código. Troque por JSON.parse e valide o
      formato; cookie e corpo da requisição chegam aqui passando por outras funções, por isso a regra não exige a origem.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-502: Deserialization of Untrusted Data"
      owasp: A08:2021 - Software and Data Integrity Failures

  - id: sentinel-node-cookie-sem-flags
    patterns:
      - pattern-either:
          - pattern: $RES.cookie($NAME, $VALUE)
          - pattern: $RES.cookie($NAME, $VALUE, {...})
      - pattern-not: '$RES.cookie($NAME, $VALUE, {..., httpOnly: true, ...})'
      - metavariable-regex:
          metavariable: $RES
          regex: ^(res|response)$
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i)^['"`].*(token|sess|auth|jwt|sid|login|remember).*['"`]$
    message: >
      Cookie de sessão ou token sem `httpOnly` (CWE-1004): um XSS consegue ler o valor. Defina
      `{ httpOnly: true, secure: true, sameSite: 'lax' }` ao gravar o cookie.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-1004: Sensitive Cookie Without 'HttpOnly' Flag"
      owasp: A05:2021 - Security Misconfiguration

  - id: sentinel-node-jwt-sem-algoritmo
    patterns:
      - pattern-either:
          - pattern: $J.verify($TOKEN, $KEY)
          - pattern: $J.verify($TOKEN, $KEY, {...})
      - pattern-not: '$J.verify($TOKEN, $KEY, {..., algorithms: [...], ...})'
      - metavariable-regex:
          metavariable: $J
          regex: ^(jwt|jsonwebtoken)$
    message: >
      `jwt.verify` sem `algorithms` (CWE-347): o servidor aceita o algoritmo escolhido pelo token, o que abre
      caminho para troca de algoritmo. Passe `{ algorithms: ['HS256'] }` (ou o algoritmo que você usa).
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-347: Improper Verification of Cryptographic Signature"
      owasp: A07:2021 - Identification and Authentication Failures

  - id: sentinel-node-jwt-expiracao-ignorada
    pattern: '{..., ignoreExpiration: true, ...}'
    message: >
      `ignoreExpiration: true` (CWE-613): token vencido continua valendo, inclusive quando as opções são montadas
      numa constante e passadas depois a `jwt.verify`. Remova a opção e renove o token.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-613: Insufficient Session Expiration"
      owasp: A07:2021 - Identification and Authentication Failures

  - id: sentinel-node-jwt-algoritmo-none
    pattern-either:
      - pattern: '{..., algorithms: [..., "none", ...], ...}'
      - pattern: "{..., algorithms: [..., 'none', ...], ...}"
      - pattern: '{..., algorithms: [..., "None", ...], ...}'
    message: >
      `algorithms` aceita `none` (CWE-347): um token sem assinatura passa na verificação e qualquer pessoa forja a
      identidade. Liste só os algoritmos esperados (por exemplo `['HS256']`), nunca `none`.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-347: Improper Verification of Cryptographic Signature"
      owasp: A07:2021 - Identification and Authentication Failures

  - id: sentinel-node-math-random-segredo
    patterns:
      - pattern-either:
          - pattern: $V = <... Math.random() ...>
          - pattern: const $V = <... Math.random() ...>
          - pattern: let $V = <... Math.random() ...>
          - pattern: let $V = <... Math.random() ...> + $Y
          - pattern: const $V = <... Math.random() ...> + $Y
          - pattern: $V = <... Math.random() ...> + $Y
          - pattern: '$V: <... Math.random() ...>'
      - metavariable-regex:
          metavariable: $V
          regex: (?i)^(?:.*(?:token|secret|senha|password|nonce|apikey|csrf|authcode|verifier|jti).*|(?:otp|salt|session).*|code)$
    message: >
      `Math.random()` gerando valor de segurança (CWE-338): o resultado é previsível. Use
      `crypto.randomBytes(32).toString('hex')` ou `crypto.randomUUID()`.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-338: Use of Cryptographically Weak Pseudo-Random Number Generator (PRNG)"
      owasp: A02:2021 - Cryptographic Failures

  # --- Camada de dados e utilitários: a falha costuma estar numa função que recebe o dado já pronto,
  # --- longe da rota; o motor não segue o dado entre funções, então estas regras olham o próprio padrão.

  - id: sentinel-node-sql-concatenado
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: '"..." + $B'
              - pattern: '$A + "..."'
          - pattern-not: '"..." + "..."'
      - pattern: '`...${$X}...`'
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $DB.query($Q, ...)
              - pattern: $DB.execute($Q, ...)
              - pattern: $DB.raw($Q, ...)
              - pattern: $DB.unsafe($Q, ...)
          - metavariable-regex:
              metavariable: $DB
              regex: (?i)^(.*\.)?(pool|db|client|conn|connection|knex|sequelize|database|pg|mysql|sqlite|trx|tx)\w*$
          # funções que recebem a requisição já são cobertas por sentinel-node-sql-injection
          - pattern-not-inside: 'function $F(..., req, ...) {...}'
          - pattern-not-inside: 'function $F(..., request, ...) {...}'
          - pattern-not-inside: '(..., req, ...) => {...}'
          - pattern-not-inside: '(..., request, ...) => {...}'
          - pattern-not-inside: '({..., $P, ...}: Request, ...) => {...}'
          - focus-metavariable: $Q
      # função auxiliar de consulta (`executeQuery(sql)`, `runQuery(sql)`): o nome diz que o texto vai direto ao banco
      - patterns:
          - pattern: $F($Q, ...)
          - metavariable-regex:
              metavariable: $F
              regex: (?i)^(execute|exec|run)\w*(query|sql)$
          - pattern-not-inside: 'function $F2(..., req, ...) {...}'
          - pattern-not-inside: 'function $F2(..., request, ...) {...}'
          - pattern-not-inside: '(..., req, ...) => {...}'
          - pattern-not-inside: '(..., request, ...) => {...}'
          - pattern-not-inside: '({..., $P, ...}: Request, ...) => {...}'
          - focus-metavariable: $Q
    message: >
      SQL montado com concatenação ou template string (CWE-89): o texto da consulta recebe valor variável
      e o driver não separa dado de comando. Use parâmetros (`$1`, `?`, `:nome`) e, para nome de coluna ou
      ordem, escolha o valor de uma lista fixa.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      owasp: A03:2021 - Injection

  - id: sentinel-node-nosql-operador
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: $REQ.body
              - pattern: $REQ.query
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request|ctx|ctx\.request)$
      # evento do socket.io: o payload do cliente é objeto JSON livre, como o corpo de uma requisição
      - patterns:
          - pattern-inside: |
              $S.on($EVT, function ($DATA, ...) { ... })
          - pattern: $DATA
          - metavariable-regex:
              metavariable: $S
              regex: ^(socket|client|conn|connection|sock)$
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $C.find($Q, ...)
              - pattern: $C.findOne($Q, ...)
              - pattern: $C.findOneAndUpdate($Q, ...)
              - pattern: $C.updateOne($Q, ...)
              - pattern: $C.updateMany($Q, ...)
              - pattern: $C.deleteOne($Q, ...)
              - pattern: $C.deleteMany($Q, ...)
              - pattern: $C.countDocuments($Q, ...)
          - pattern-not: '$C.$M(($A) => ..., ...)'
          - pattern-not: '$C.$M(function (...) {...}, ...)'
          - pattern-not: '$C.$M({..., where: ..., ...}, ...)'
          - focus-metavariable: $Q
    pattern-sanitizers:
      - pattern: String(...)
      - pattern: Number(...)
      - pattern: parseInt(...)
      - pattern: $X.toString()
      - pattern: '`...${...}...`'
    message: >
      Filtro de banco de documentos montado com dado da requisição (CWE-943): um objeto JSON como
      `{"$ne": null}` ou `{"$gt": ""}` vira operador e muda a consulta. Converta o valor para texto
      (`String(valor)`) ou valide o formato antes de consultar.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-943: Improper Neutralization of Special Elements in Data Query Logic"
      owasp: A03:2021 - Injection

  - id: sentinel-node-prototype-pollution
    patterns:
      - pattern-either:
          - pattern: |
              function $F($T, $S) {
                ...
                $F($T[$K], $S[$K]);
                ...
              }
          - pattern: |
              const $F = ($T, $S) => {
                ...
                $F($T[$K], $S[$K]);
                ...
              }
          # método de classe (`this.merge(target[key], source[key])`); o achado fica na linha do método
          - patterns:
              - pattern-inside: |
                  class $C { ... }
              - pattern: |
                  $F($T, $S) {
                    ...
                    this.$F($T[$K], $S[$K]);
                    ...
                  }
      - pattern-not: |
          function $F($T, $S) {
            ...
            <... "__proto__" ...>
            ...
          }
      - pattern-not: |
          const $F = ($T, $S) => {
            ...
            <... "__proto__" ...>
            ...
          }
      - pattern-not: |
          $F($T, $S) {
            ...
            <... "__proto__" ...>
            ...
          }
    message: >
      Mescla recursiva sem bloquear as chaves `__proto__`, `constructor` e `prototype` (CWE-1321): um JSON
      como `{"__proto__": {"admin": true}}` altera `Object.prototype` e contamina todos os objetos. Ignore
      essas chaves, use `Object.create(null)` ou uma biblioteca mantida e atualizada.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-1321: Improperly Controlled Modification of Object Prototype Attributes ('Prototype Pollution')"
      owasp: A08:2021 - Software and Data Integrity Failures

  - id: sentinel-node-regexp-da-requisicao
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.params
              - pattern: $REQ.body
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request|ctx|ctx\.request)$
    pattern-sinks:
      - patterns:
          - pattern: new RegExp($P, ...)
          - focus-metavariable: $P
    pattern-sanitizers:
      - patterns:
          - pattern: $F(...)
          - metavariable-regex:
              metavariable: $F
              regex: (?i)^(_\.)?escape(Reg|Re)\w*$
    message: >
      Expressão regular criada com dado da requisição (CWE-1333 / CWE-185): o usuário escolhe o padrão e
      um padrão com repetição aninhada (`^(\d+)*$`) trava o processo (ReDoS). Escape o texto antes de
      montar a expressão, limite o tamanho ou use um motor sem retrocesso (RE2).
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-1333: Inefficient Regular Expression Complexity"
      owasp: A04:2021 - Insecure Design

  - id: sentinel-node-xss-refletido
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.params
              - pattern: $REQ.body
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request|ctx|ctx\.request)$
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $RES.send($H + $V)
              - pattern: $RES.status(...).send($H + $V)
              - pattern: $RES.send($H + $V + $T)
              - pattern: $RES.status(...).send($H + $V + $T)
              - pattern: $RES.end($H + $V)
              - pattern: $RES.write($H + $V)
          - metavariable-regex:
              metavariable: $H
              regex: ^["'`]
          - metavariable-regex:
              metavariable: $RES
              regex: ^(res|response)$
          - focus-metavariable: $V
      - patterns:
          - pattern-either:
              - pattern: $RES.send($T)
              - pattern: $RES.end($T)
              - pattern: $RES.write($T)
          - metavariable-regex:
              metavariable: $RES
              regex: ^(res|response)$
          - metavariable-regex:
              metavariable: $T
              regex: ^`\s*<[\s\S]*\$\{
          - focus-metavariable: $T
      # eco direto de parâmetro de texto (`res.send(req.query.x)`): string sai como text/html
      - patterns:
          - pattern-either:
              - pattern: $RES.send($T)
              - pattern: $RES.status(...).send($T)
              - pattern: $RES.end($T)
              - pattern: $RES.write($T)
              - pattern: $RES.send($T || $D)
              - pattern: $RES.status(...).send($T || $D)
          - metavariable-regex:
              metavariable: $RES
              regex: ^(res|response)$
          - metavariable-regex:
              metavariable: $T
              regex: ^(req|request)\.(query|params)\.\w+$
          - focus-metavariable: $T
    pattern-sanitizers:
      - patterns:
          - pattern: $F(...)
          - metavariable-regex:
              metavariable: $F
              regex: (?i)^(.*\.)?(escape|escapeHtml|encode|encodeURIComponent|sanitize|sanitizeHtml|xss|purify|clean)\w*$
      - pattern: parseInt(...)
      - pattern: Number(...)
    message: >
      HTML montado com dado da requisição e devolvido na resposta (CWE-79): o navegador interpreta o que o
      usuário enviou como marcação (XSS refletido). Escape o valor (`escape-html`, `he.encode`) ou use um
      motor de templates com escape automático.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      owasp: A03:2021 - Injection

  - id: sentinel-node-mongo-corpo-inteiro
    patterns:
      - pattern-either:
          - pattern: $DB.collection(...).$OP($REQ.body, ...)
          - patterns:
              - pattern: $DB.collection(...).$OP($X, ...)
              - pattern-either:
                  - pattern-inside: |
                      $X = $REQ.body
                      ...
                  - pattern-inside: |
                      var $X = $REQ.body
                      ...
                  - pattern-inside: |
                      const $X = $REQ.body
                      ...
                  - pattern-inside: |
                      let $X = $REQ.body
                      ...
      - metavariable-regex:
          metavariable: $OP
          regex: ^(insert|insertOne|insertMany|save)$
      - metavariable-regex:
          metavariable: $REQ
          regex: ^(req|request)$
    message: >
      O corpo da requisição é gravado inteiro na coleção (CWE-915): quem envia campos a mais (`paid`, `role`,
      `_id`) grava o que quiser. Monte o documento campo a campo, converta os tipos e valide o formato antes de
      inserir.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-915: Improperly Controlled Modification of Dynamically-Determined Object Attributes"
      owasp: A04:2021 - Insecure Design

  - id: sentinel-node-mass-assignment
    patterns:
      - pattern-either:
          - pattern: $M.create($REQ.body, ...)
          - pattern: $M.update($REQ.body, ...)
          - pattern: $M.updateOne($F, $REQ.body, ...)
          - pattern: $M.findByIdAndUpdate($I, $REQ.body, ...)
          - pattern: $M.findOneAndUpdate($F, $REQ.body, ...)
          - pattern: new $M($REQ.body)
          - pattern: 'new $M({..., ...$REQ.body, ...})'
          - pattern: '$M.create({..., ...$REQ.body, ...})'
          - pattern: Object.assign($X, $REQ.body)
      - metavariable-regex:
          metavariable: $REQ
          regex: ^(req|request)$
      - metavariable-regex:
          metavariable: $M
          regex: ^(?!Object$|JSON$|Array$|Math$|Promise$|RegExp$|Map$|Set$|Date$|Error$|URL$|Buffer$)(?:[A-Z]\w*|\w*[Mm]odel\w*|\w*[Rr]epo\w*)$
    message: >
      O corpo da requisição é gravado inteiro no modelo (CWE-915): quem envia `{"role": "admin"}` ou
      `{"balance": 9999}` promove a si mesmo. Escolha os campos permitidos um a um (`{ nome, email }`) e
      defina papel e saldo só no servidor.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-915: Improperly Controlled Modification of Dynamically-Determined Object Attributes"
      owasp: A04:2021 - Insecure Design

  - id: sentinel-node-mass-assignment-campo
    patterns:
      - pattern-either:
          - pattern: $O.$P = $REQ.body.$Q
          - pattern: $O.$P = $REQ.body.$Q || ...
          - pattern: $O.$P = $REQ.body.$Q ?? ...
          - pattern: '{..., $P: $REQ.body.$Q, ...}'
      - metavariable-regex:
          metavariable: $REQ
          regex: ^(req|request)$
      - metavariable-regex:
          metavariable: $P
          regex: ^(role|roles|isAdmin|is_admin|admin|permissions|balance|saldo|isStaff|is_staff)$
    message: >
      Campo privilegiado (papel, permissão ou saldo) recebe o valor enviado pelo cliente (CWE-915): quem
      envia `{"role": "admin"}` promove a si mesmo. Defina esse campo só no servidor ou confira o valor
      contra uma lista permitida.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-915: Improperly Controlled Modification of Dynamically-Determined Object Attributes"
      owasp: A04:2021 - Insecure Design

  - id: sentinel-node-session-secret-literal
    patterns:
      - pattern-either:
          - pattern: '$S({..., secret: "...", ...})'
          - pattern: '$S({..., secret: `...`, ...})'
      - metavariable-regex:
          metavariable: $S
          regex: ^(session|expressSession|cookieSession|(\w+\.)?session)$
    message: >
      Segredo de sessão escrito no código (CWE-798). Quem lê o repositório consegue forjar o cookie de sessão.
      Leia o valor de uma variável de ambiente ou de um cofre de segredos e use um valor longo e aleatório.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: A07:2021 - Identification and Authentication Failures

  - id: sentinel-node-nosql-where-concatenado
    pattern-either:
      - pattern-regex: |-
          \$where[^\n]*['"]\s*\+\s*[A-Za-z_]
      - pattern-regex: |-
          \$where[^\n]*\$\{
    message: >
      Consulta `$where` do MongoDB montada por concatenação de texto (CWE-943): o conteúdo vira JavaScript executado no
      banco. Troque por operadores de consulta (`{ campo: valor }`) e não monte JSON por texto.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-943: Improper Neutralization of Special Elements in Data Query Logic"
      owasp: A03:2021 - Injection

  - id: sentinel-node-math-random-retorno
    patterns:
      - pattern-either:
          - pattern-inside: |
              function $F(...) {
                ...
              }
          - pattern-inside: |
              const $F = (...) => {
                ...
              }
          - pattern-inside: |
              const $F = function (...) {
                ...
              }
      - pattern: return <... Math.random() ...>
      - metavariable-regex:
          metavariable: $F
          regex: (?i)^(?:.*(?:token|secret|senha|password|nonce|apikey|csrf|verifier|otp|salt|session|sessionid|codigo|authcode|passcode|pin)).*$
    message: >
      Função de segurança devolve valor derivado de `Math.random()` (CWE-338): o resultado é previsível e pode ser
      adivinhado. Use `crypto.randomInt()` para códigos numéricos e `crypto.randomBytes(32).toString('hex')` para tokens.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-338: Use of Cryptographically Weak Pseudo-Random Number Generator (PRNG)"
      owasp: A02:2021 - Cryptographic Failures

  - id: sentinel-node-tls-desligado
    pattern-either:
      - pattern: 'rejectUnauthorized: false'
      - pattern: $O.rejectUnauthorized = false
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = '0'
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
    message: >
      Verificação do certificado TLS desligada (CWE-295): qualquer pessoa na rede consegue se passar pelo servidor e ler ou
      alterar o tráfego (inclusive credenciais e códigos). Remova `rejectUnauthorized: false` e, se o certificado for
      interno, informe a CA própria em `ca`.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-295: Improper Certificate Validation"
      owasp: A02:2021 - Cryptographic Failures

  - id: sentinel-node-hash-fraco-pacote
    patterns:
      - pattern: $M($ARG)
      - pattern-either:
          - pattern-inside: |
              const $M = require("$PKG");
              ...
          - pattern-inside: |
              var $M = require("$PKG");
              ...
          - pattern-inside: |
              let $M = require("$PKG");
              ...
          # módulo ES: `import md5 from 'md5'` (padrão nos projetos com "type": "module")
          - pattern-inside: |
              import $M from "$PKG";
              ...
          - pattern-inside: |
              import * as $M from "$PKG";
              ...
      - metavariable-regex:
          metavariable: $PKG
          regex: ^(md5|sha1|md5-hex|sha-1|js-md5|js-sha1)$
    message: >
      Hash fraco (CWE-328): o pacote `md5`/`sha1` calcula MD5 ou SHA-1, que permitem colisão e são rápidos demais
      para guardar senha. Para senha use `bcrypt`, `scrypt` ou `argon2`; para integridade use SHA-256 ou superior.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-328: Use of Weak Hash"
      owasp: A02:2021 - Cryptographic Failures

  - id: sentinel-node-jwt-decode-sem-verificar
    patterns:
      - pattern: $J.decode(...)
      - pattern-either:
          - pattern-inside: ($REQ, $RES, $NEXT) => {...}
          - pattern-inside: function ($REQ, $RES, $NEXT) {...}
      - metavariable-regex:
          metavariable: $J
          regex: ^(jwt|jsonwebtoken|jwtLib)$
    message: >
      Middleware de autenticação usa `jwt.decode`, que só lê o conteúdo do token e NÃO confere a assinatura
      (CWE-347): quem monta um token qualquer passa. Para autenticar use `jwt.verify(token, segredo, { algorithms: ['HS256'] })`.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-347: Improper Verification of Cryptographic Signature"
      owasp: A02:2021 - Cryptographic Failures

  - id: sentinel-node-cookie-httponly-desligado
    pattern: '{..., httpOnly: false, ...}'
    message: >
      Cookie de sessão com `httpOnly: false` (CWE-1004): um XSS consegue ler o identificador da sessão. Use
      `httpOnly: true` (e `secure: true`, `sameSite: 'lax'`).
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-1004: Sensitive Cookie Without 'HttpOnly' Flag"
      owasp: A05:2021 - Security Misconfiguration

  - id: sentinel-node-eval-callback
    pattern-either:
      - pattern: $P.then(eval)
      - pattern: $P.then(Function)
    message: >
      `eval` (ou `Function`) entregue direto a `.then(...)` executa como código o texto recebido (CWE-95/CWE-494). Com
      `fetch` de uma URL, quem controla o servidor ou intercepta a conexão (principalmente em http) roda código no
      seu processo. Não execute texto baixado: empacote o código na versão publicada, ou use dados (JSON.parse).
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      side: common
      category: security
      cwe: "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code ('Eval Injection')"
      owasp: A08:2021 - Software and Data Integrity Failures

  - id: sentinel-node-credencial-literal-atribuida
    patterns:
      - pattern-either:
          - pattern: const $K = "$VAL"
          - pattern: let $K = "$VAL"
          - pattern: var $K = "$VAL"
          - pattern: '{..., $K: "$VAL", ...}'
          - pattern: $O.$K = "$VAL"
      # nome de credencial (o `secret` solto fica com sentinel-node-session-secret-literal, que já cobre a sessão)
      - metavariable-regex:
          metavariable: $K
          regex: (?i)^(\w+\.)*(\w*password|passwd|\w*senha\w*|\w*api_?key|\w*client_?secret|\w*secret_?key|\w*private_?key|\w*access_?token)$
      # 8+ caracteres sem espaço: frase, rótulo de tela e campo vazio não são segredo
      - metavariable-regex:
          metavariable: $VAL
          regex: ^(?!(?i:password|senha|passwd|changeme|\*+|x+)$)[^\s"'`$<{]{8,}$
      - focus-metavariable: $VAL
    message: >
      Credencial escrita no código-fonte (CWE-798). Ela vai para o Git, para o pacote publicado e para todo build, e
      quem lê o código a usa. Leia de variável de ambiente (`process.env.X`) ou de um cofre de segredos, guarde só o hash
      de senha de usuário e troque a que já foi exposta.
    severity: WARNING
    languages: [javascript, typescript]
    paths:
      exclude: ["**/*.spec.*", "**/*.test.*", "**/test/**", "**/tests/**", "**/__tests__/**", "**/e2e/**", "**/mocks/**", "**/*.stories.*"]
    metadata:
      side: common
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: A07:2021 - Identification and Authentication Failures

  - id: sentinel-node-credencial-literal-comparada
    patterns:
      - pattern-either:
          - pattern: $X === $S
          - pattern: $X == $S
          - pattern: $S === $X
          - pattern: $S == $X
      # nome da variável é de credencial; o outro lado é texto fixo de 6+ caracteres (sem espaço: frase não é segredo)
      - metavariable-regex:
          metavariable: $X
          regex: (?i)^(\w+\.)*(api_?key|apikey|api_?secret|password|passwd|senha|secret|(auth|access|api)_?token)$
      - metavariable-regex:
          metavariable: $S
          regex: ^["'`][^\s"'`]{6,}["'`]$
    message: >
      O código compara o que o usuário informou com uma chave ou senha escrita no código (CWE-798). Quem lê o
      pacote (inclusive o JavaScript de uma extensão ou do navegador) vê o valor e passa pela verificação. Valide no
      servidor ou compare com o hash de um segredo guardado fora do código.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      side: common
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: A07:2021 - Identification and Authentication Failures

  - id: sentinel-node-ssti-template-dinamico
    patterns:
      - pattern-either:
          - pattern: $E.render(`...${$X}...`, ...)
          - pattern: $E.render("..." + $X, ...)
          - pattern: $E.render($X + "...", ...)
          - pattern: $E.compile(`...${$X}...`, ...)
          - pattern: $E.compile("..." + $X, ...)
          - pattern: $E.compile($X + "...", ...)
          - pattern: $E.renderString(`...${$X}...`, ...)
          - pattern: $E.renderString("..." + $X, ...)
          - pattern: $E.renderString($X + "...", ...)
      - metavariable-regex:
          metavariable: $E
          regex: ^(ejs|pug|jade|nunjucks|Handlebars|handlebars|mustache|swig|dot|doT|_|lodash)$
    message: >
      O texto do modelo (template) é montado com variável e depois interpretado (CWE-1336, injeção de modelo no
      servidor): quem controla o valor executa código do motor de templates (em EJS, `<%= process.env.X %>` e
      `require('child_process')`). Mantenha o modelo fixo e passe o valor como dado (`ejs.render('Olá <%= nome %>', { nome })`).
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-1336: Improper Neutralization of Special Elements Used in a Template Engine"
      owasp: A03:2021 - Injection
