rules:
  # Regras de segurança para backend Node/Express (JavaScript e TypeScript).
  # Fontes: dados da requisição (req.query, req.params, req.body, req.headers, req.cookies).
  # Escritas a partir de padrões comuns de aplicações Express; checadas no OWASP Juice Shop (alvo de treino).

  - id: sentinel-node-sql-injection
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-inside: |
              ({..., $P, ...}: Request, ...) => {...}
          - metavariable-regex:
              metavariable: $P
              regex: ^(params|query|body|headers|cookies)$
          - focus-metavariable: $P
      - patterns:
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.params
              - pattern: $REQ.body
              - pattern: $REQ.headers
              - pattern: $REQ.cookies
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request)$
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $DB.query($Q, ...)
              - pattern: $DB.raw($Q, ...)
              - pattern: $DB.$METHOD($Q, ...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(query|raw|execute)$
          - focus-metavariable: $Q
      - patterns:
          - pattern-either:
              - pattern: Sequelize.literal($Q)
              - pattern: sequelize.literal($Q)
          - focus-metavariable: $Q
    pattern-sanitizers:
      - pattern: parseInt(...)
      - pattern: Number(...)
      - pattern: $X.escape(...)
    message: >
      Possível SQL injection (CWE-89): dado da requisição entra no texto da consulta. Use parâmetros
      (`replacements`/`bind` do Sequelize, `?` no driver) em vez de montar o SQL com `+` ou template string.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      owasp: A03:2021 - Injection

  - id: sentinel-node-nosql-where
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-inside: |
              ({..., $P, ...}: Request, ...) => {...}
          - metavariable-regex:
              metavariable: $P
              regex: ^(params|query|body|headers|cookies)$
          - focus-metavariable: $P
      - patterns:
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.params
              - pattern: $REQ.body
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request)$
    pattern-sinks:
      - patterns:
          - pattern: '{..., $where: $X, ...}'
          - focus-metavariable: $X
    pattern-sanitizers:
      - pattern: parseInt(...)
      - pattern: Number(...)
    message: >
      Possível injeção NoSQL (CWE-943): dado da requisição vai para `$where`, que executa JavaScript no banco.
      Troque por operadores de consulta (`{ campo: valor }`) e valide o tipo do valor.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-943: Improper Neutralization of Special Elements in Data Query Logic"
      owasp: A03:2021 - Injection

  - id: sentinel-node-eval-requisicao
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-inside: |
              ({..., $P, ...}: Request, ...) => {...}
          - metavariable-regex:
              metavariable: $P
              regex: ^(params|query|body|headers|cookies)$
          - focus-metavariable: $P
      - patterns:
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.params
              - pattern: $REQ.body
              - pattern: $REQ.headers
              - pattern: $REQ.cookies
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request)$
      - patterns:
          - pattern-either:
              - pattern: $EV.body
              - pattern: $EV.headers
              - pattern: $EV.queryStringParameters
              - pattern: $EV.pathParameters
          - metavariable-regex:
              metavariable: $EV
              regex: ^event$
      - patterns:
          - pattern-inside: |
              class $C { ... $M(..., @$DEC(...) $P: $T, ...) {...} ... }
          - metavariable-regex:
              metavariable: $DEC
              regex: ^(Query|Body|Param|Headers)$
          - focus-metavariable: $P
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: eval($X)
              - pattern: new Function(..., $X)
              - pattern: vm.runInContext($X, ...)
              - pattern: vm.runInNewContext($X, ...)
              - pattern: vm.runInThisContext($X, ...)
          - focus-metavariable: $X
    message: >
      Execução de código vinda da requisição (CWE-95): `eval`, `new Function` ou `vm.run*` recebe dado externo.
      Não execute texto do usuário; use um parser de expressões com lista de operações permitidas.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code ('Eval Injection')"
      owasp: A03:2021 - Injection

  - id: sentinel-node-eval-dinamico
    patterns:
      - pattern: eval($X)
      - pattern-not: eval("...")
      - pattern-not: eval(`...`)
      - pattern-not: eval(<... req ...>)
      - pattern-not: eval(<... request ...>)
    message: >
      `eval` com argumento que não é texto fixo (CWE-95). Mesmo sem origem externa óbvia, o dado pode vir do banco
      ou de outra camada. Troque por um parser (JSON.parse, avaliador de expressões com lista de operações).
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code ('Eval Injection')"
      owasp: A03:2021 - Injection

  - id: sentinel-node-function-dinamico
    patterns:
      - pattern: new Function(..., $X)
      - pattern-not: new Function(..., "...")
      - pattern-not: new Function(..., '...')
      - pattern-not: new Function(..., `...`)
    message: >
      `new Function` com corpo que não é texto fixo (CWE-95): equivale a `eval`. Quem controla o texto executa código no
      servidor, inclusive quando ele vem de um arquivo importado (YAML, JSON, planilha) ou do banco. Troque por
      um avaliador de expressões com lista de operações permitidas.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code ('Eval Injection')"
      owasp: A03:2021 - Injection

  - id: sentinel-node-xpath-injection
    patterns:
      - pattern: $X.$M($E, ...)
      - metavariable-regex:
          metavariable: $X
          regex: ^(xpath|xp|xpathLib)$
      - metavariable-regex:
          metavariable: $M
          regex: ^(evaluate|select|select1|selectWithResolver|parse)$
      - metavariable-regex:
          metavariable: $E
          regex: (?s).*(\$\{|\+)
    message: >
      Consulta XPath montada por concatenação ou interpolação (CWE-643): o valor do usuário vira parte da expressão e
      muda o que ela seleciona (`' or '1'='1`). Use variáveis do XPath (`xpath.parse('//a[@n=$nome]')` com `variables`)
      ou valide o valor contra uma lista de caracteres permitidos.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-643: Improper Neutralization of Data within XPath Expressions ('XPath Injection')"
      owasp: A03:2021 - Injection

  - id: sentinel-node-ldap-injection
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.params
              - pattern: $REQ.body
              - pattern: $REQ.headers
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request)$
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: const $V = $T
              - pattern: let $V = $T
              - pattern: var $V = $T
              - pattern: $V = $T
              - pattern: '{..., filter: $T, ...}'
          - metavariable-regex:
              metavariable: $T
              regex: ^[`'"]\s*\([&|!(]*\s*\w[\w.-]*\s*[=~<>]
          - focus-metavariable: $T
    pattern-sanitizers:
      - patterns:
          - pattern: $F(...)
          - metavariable-regex:
              metavariable: $F
              regex: (?i).*(escap|sanitiz|ldapEncode)
    message: >
      Filtro LDAP montado com dado da requisição (CWE-90): o usuário injeta `*`, `)(` ou `|` e muda a busca no
      diretório. Escape o valor (RFC 4515: `\\28`, `\\29`, `\\2a`, `\\5c`, `\\00`) antes de interpolar, ou use filtro
      parametrizado da biblioteca.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-90: Improper Neutralization of Special Elements used in an LDAP Query ('LDAP Injection')"
      owasp: A03:2021 - Injection

  - id: sentinel-node-open-redirect
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-inside: |
              ({..., $P, ...}: Request, ...) => {...}
          - metavariable-regex:
              metavariable: $P
              regex: ^(params|query|body|headers|cookies)$
          - focus-metavariable: $P
      - patterns:
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.params
              - pattern: $REQ.body
              - pattern: $REQ.headers
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request)$
      - patterns:
          - pattern-inside: |
              class $C { ... $M(..., @$DEC(...) $P: $T, ...) {...} ... }
          - metavariable-regex:
              metavariable: $DEC
              regex: ^(Query|Body|Param|Headers)$
          - focus-metavariable: $P
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $RES.redirect($U)
              - pattern: $RES.redirect($S, $U)
          - metavariable-regex:
              metavariable: $RES
              regex: ^(res|response)$
          - focus-metavariable: $U
      - patterns:
          - pattern-inside: |
              class $C { ... @Redirect(...) $M(...) {...} ... }
          - pattern-either:
              - pattern: 'return { url: $U, ... }'
              - pattern: 'return { $U, ... }'
          - focus-metavariable: $U
    message: >
      Redirecionamento aberto (CWE-601): o destino vem da requisição. Aceite só caminhos do próprio site ou
      compare o destino exato com uma lista de permissão (não use `includes`/`indexOf` sobre a URL).
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-601: URL Redirection to Untrusted Site ('Open Redirect')"
      owasp: A01:2021 - Broken Access Control

  - id: sentinel-node-path-traversal
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-inside: |
              ({..., $P, ...}: Request, ...) => {...}
          - metavariable-regex:
              metavariable: $P
              regex: ^(params|query|body|headers|cookies)$
          - focus-metavariable: $P
      - patterns:
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.params
              - pattern: $REQ.body
              - pattern: $REQ.headers
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request)$
      - patterns:
          - pattern: $REQ.file.originalname
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request)$
      - patterns:
          - pattern-inside: |
              class $C { ... $M(..., @$DEC(...) $P: $T, ...) {...} ... }
          - metavariable-regex:
              metavariable: $DEC
              regex: ^(Query|Body|Param|Headers)$
          - focus-metavariable: $P
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  ($PARENT, $ARGS, ...) => {...}
              - pattern-inside: |
                  async ($PARENT, $ARGS, ...) => {...}
              - pattern-inside: |
                  function ($PARENT, $ARGS, ...) {...}
              - pattern-inside: |
                  async function ($PARENT, $ARGS, ...) {...}
          - pattern: $ARGS.$K
          - metavariable-regex:
              metavariable: $ARGS
              regex: ^args$
      - patterns:
          - pattern: $J.decode(...)
          - metavariable-regex:
              metavariable: $J
              regex: ^(jwt|jsonwebtoken)$
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $FS.sendFile($P, ...)
              - pattern: $FS.download($P, ...)
              - pattern: $FS.readFile($P, ...)
              - pattern: $FS.readFileSync($P, ...)
              - pattern: $FS.createReadStream($P, ...)
              - pattern: $FS.createWriteStream($P, ...)
              - pattern: $FS.writeFile($P, ...)
              - pattern: $FS.writeFileSync($P, ...)
              - pattern: $FS.unlink($P, ...)
              - pattern: $FS.unlinkSync($P, ...)
              - pattern: $FS.readdir($P, ...)
          - metavariable-regex:
              metavariable: $FS
              regex: ^(res|response|fs|fsp|fsPromise|fsPromises|fs\.promises|promises)$
          - focus-metavariable: $P
    pattern-sanitizers:
      - pattern: path.basename(...)
      - pattern: $X.replace(...)
    message: >
      Possível path traversal (CWE-22): o caminho do arquivo vem da requisição. Use só `path.basename`, resolva o
      caminho final e confira que continua dentro da pasta permitida (`resolved.startsWith(base + path.sep)`).
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
      owasp: A01:2021 - Broken Access Control

  - id: sentinel-node-ssrf
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-inside: |
              ({..., $P, ...}: Request, ...) => {...}
          - metavariable-regex:
              metavariable: $P
              regex: ^(params|query|body|headers|cookies)$
          - focus-metavariable: $P
      - patterns:
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.params
              - pattern: $REQ.body
              - pattern: $REQ.headers
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request)$
      - patterns:
          - pattern-inside: |
              class $C { ... $M(..., @$DEC(...) $P: $T, ...) {...} ... }
          - metavariable-regex:
              metavariable: $DEC
              regex: ^(Query|Body|Param|Headers)$
          - focus-metavariable: $P
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  ($PARENT, $ARGS, ...) => {...}
              - pattern-inside: |
                  async ($PARENT, $ARGS, ...) => {...}
              - pattern-inside: |
                  function ($PARENT, $ARGS, ...) {...}
              - pattern-inside: |
                  async function ($PARENT, $ARGS, ...) {...}
          - pattern: $ARGS.$K
          - metavariable-regex:
              metavariable: $ARGS
              regex: ^args$
      - patterns:
          - pattern: $J.decode(...)
          - metavariable-regex:
              metavariable: $J
              regex: ^(jwt|jsonwebtoken)$
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: fetch($U, ...)
              - pattern: axios($U, ...)
              - pattern: axios.get($U, ...)
              - pattern: axios.post($U, ...)
              - pattern: axios.put($U, ...)
              - pattern: axios.delete($U, ...)
              - pattern: http.get($U, ...)
              - pattern: https.get($U, ...)
              - pattern: got($U, ...)
              - pattern: got.get($U, ...)
              - pattern: request($U, ...)
          - focus-metavariable: $U
    message: >
      Possível SSRF (CWE-918): o servidor faz uma requisição para uma URL vinda do usuário. Valide o destino contra
      uma lista de hosts permitidos, bloqueie IPs internos (127.0.0.0/8, 10.0.0.0/8, 169.254.0.0/16) e não siga
      redirecionamentos sem conferir.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-918: Server-Side Request Forgery (SSRF)"
      owasp: A10:2021 - Server-Side Request Forgery

  - id: sentinel-node-hash-fraco
    patterns:
      - pattern-either:
          - pattern: $C.createHash("md5")
          - pattern: $C.createHash("sha1")
          - pattern: $C.createHash("MD5")
          - pattern: $C.createHash("SHA1")
      - metavariable-regex:
          metavariable: $C
          regex: ^(crypto|nodeCrypto)$
    message: >
      Hash fraco (CWE-328): MD5 e SHA-1 permitem colisão. Para senha use `bcrypt`, `scrypt` ou `argon2`; para
      integridade use SHA-256 ou superior.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-328: Use of Weak Hash"
      owasp: A02:2021 - Cryptographic Failures

  - id: sentinel-node-xxe
    pattern-either:
      - pattern: '$L.parseXml($X, {..., noent: true, ...})'
      - pattern: '$L.parseXmlString($X, {..., noent: true, ...})'
      - pattern: '$L.parseXml($X, {..., replaceEntities: true, ...})'
      - pattern: '$L.parseXmlString($X, {..., replaceEntities: true, ...})'
    message: >
      Entidades externas XML ligadas (`noent: true` ou `replaceEntities: true`, CWE-611): o parser lê arquivos locais e faz requisições a
      pedido do documento. Remova a opção e rejeite DOCTYPE em XML vindo de fora.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-611: Improper Restriction of XML External Entity Reference"
      owasp: A05:2021 - Security Misconfiguration

  - id: sentinel-node-command-injection
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-inside: |
              ({..., $P, ...}: Request, ...) => {...}
          - metavariable-regex:
              metavariable: $P
              regex: ^(params|query|body|headers|cookies)$
          - focus-metavariable: $P
      - patterns:
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.params
              - pattern: $REQ.body
              - pattern: $REQ.headers
              - pattern: $REQ.cookies
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request)$
      - patterns:
          - pattern-inside: |
              class $C { ... $M(..., @$DEC(...) $P: $T, ...) {...} ... }
          - metavariable-regex:
              metavariable: $DEC
              regex: ^(Query|Body|Param|Headers)$
          - focus-metavariable: $P
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: exec($C, ...)
              - pattern: execSync($C, ...)
          - focus-metavariable: $C
      - patterns:
          - pattern-either:
              - pattern: $CP.exec($C, ...)
              - pattern: $CP.execSync($C, ...)
          - metavariable-regex:
              metavariable: $CP
              regex: ^(child_process|childProcess|cp|shell)$
          - focus-metavariable: $C
      - patterns:
          - pattern-either:
              - pattern: spawn($C, ...)
              - pattern: spawnSync($C, ...)
              - pattern: execFile($C, ...)
              - pattern: execFileSync($C, ...)
          - focus-metavariable: $C
    pattern-sanitizers:
      - pattern: shellEscape(...)
      - pattern: parseInt(...)
      - pattern: Number(...)
    message: >
      Possível injeção de comando (CWE-78): dado da requisição vai para `exec`, que roda o texto em um shell.
      Use `execFile`/`spawn` com os argumentos separados (sem `shell: true`) e valide o valor contra uma lista de permissão.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"
      owasp: A03:2021 - Injection

  - id: sentinel-node-exec-dinamico
    patterns:
      - pattern-either:
          - pattern: exec($X, ...)
          - pattern: execSync($X, ...)
          - patterns:
              - pattern-either:
                  - pattern: $CP.exec($X, ...)
                  - pattern: $CP.execSync($X, ...)
              - metavariable-regex:
                  metavariable: $CP
                  regex: ^(child_process|childProcess|cp|shell)$
      - pattern-not: $F("...", ...)
      - pattern-not: $F(<... req ...>, ...)
      - pattern-not: $F(<... request ...>, ...)
      - pattern-not-inside: |
          ({..., $P, ...}: Request, ...) => {...}
    message: >
      `exec` recebe um comando que não é texto fixo (CWE-78). O shell interpreta o texto inteiro; se qualquer parte vier
      de arquivo, XML, banco ou outra camada, vira injeção de comando. Use `execFile`/`spawn` com os argumentos separados
      e valide o valor contra uma lista de permissão.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"
      owasp: A03:2021 - Injection

  - id: sentinel-node-desserializacao
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-inside: |
              ({..., $P, ...}: Request, ...) => {...}
          - metavariable-regex:
              metavariable: $P
              regex: ^(params|query|body|headers|cookies)$
          - focus-metavariable: $P
      - patterns:
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.params
              - pattern: $REQ.body
              - pattern: $REQ.headers
              - pattern: $REQ.cookies
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request)$
      - patterns:
          - pattern-either:
              - pattern: $EV.body
              - pattern: $EV.headers
              - pattern: $EV.queryStringParameters
              - pattern: $EV.pathParameters
          - metavariable-regex:
              metavariable: $EV
              regex: ^event$
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: unserialize($X, ...)
              - pattern: $S.unserialize($X, ...)
          - focus-metavariable: $X
    message: >
      Desserialização de dado da requisição (CWE-502): `node-serialize` executa funções embutidas no texto. Troque
      por JSON.parse e valide o formato do resultado.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-502: Deserialization of Untrusted Data"
      owasp: A08:2021 - Software and Data Integrity Failures

  - id: sentinel-node-cookie-sem-flags
    patterns:
      - pattern-either:
          - pattern: $RES.cookie($NAME, $VALUE)
          - pattern: $RES.cookie($NAME, $VALUE, {...})
      - pattern-not: '$RES.cookie($NAME, $VALUE, {..., httpOnly: true, ...})'
      - metavariable-regex:
          metavariable: $RES
          regex: ^(res|response)$
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i)^['"`].*(token|sess|auth|jwt|sid|login|remember).*['"`]$
    message: >
      Cookie de sessão ou token sem `httpOnly` (CWE-1004): um XSS consegue ler o valor. Defina
      `{ httpOnly: true, secure: true, sameSite: 'lax' }` ao gravar o cookie.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-1004: Sensitive Cookie Without 'HttpOnly' Flag"
      owasp: A05:2021 - Security Misconfiguration

  - id: sentinel-node-jwt-sem-algoritmo
    patterns:
      - pattern-either:
          - pattern: $J.verify($TOKEN, $KEY)
          - pattern: $J.verify($TOKEN, $KEY, {...})
      - pattern-not: '$J.verify($TOKEN, $KEY, {..., algorithms: [...], ...})'
      - metavariable-regex:
          metavariable: $J
          regex: ^(jwt|jsonwebtoken)$
    message: >
      `jwt.verify` sem `algorithms` (CWE-347): o servidor aceita o algoritmo escolhido pelo token, o que abre
      caminho para troca de algoritmo. Passe `{ algorithms: ['HS256'] }` (ou o algoritmo que você usa).
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-347: Improper Verification of Cryptographic Signature"
      owasp: A07:2021 - Identification and Authentication Failures

  - id: sentinel-node-jwt-expiracao-ignorada
    pattern: '{..., ignoreExpiration: true, ...}'
    message: >
      `ignoreExpiration: true` (CWE-613): token vencido continua valendo, inclusive quando as opções são montadas
      numa constante e passadas depois a `jwt.verify`. Remova a opção e renove o token.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-613: Insufficient Session Expiration"
      owasp: A07:2021 - Identification and Authentication Failures

  - id: sentinel-node-jwt-algoritmo-none
    pattern-either:
      - pattern: '{..., algorithms: [..., "none", ...], ...}'
      - pattern: "{..., algorithms: [..., 'none', ...], ...}"
      - pattern: '{..., algorithms: [..., "None", ...], ...}'
    message: >
      `algorithms` aceita `none` (CWE-347): um token sem assinatura passa na verificação e qualquer pessoa forja a
      identidade. Liste só os algoritmos esperados (por exemplo `['HS256']`), nunca `none`.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-347: Improper Verification of Cryptographic Signature"
      owasp: A07:2021 - Identification and Authentication Failures

  - id: sentinel-node-math-random-segredo
    patterns:
      - pattern-either:
          - pattern: $V = <... Math.random() ...>
          - pattern: const $V = <... Math.random() ...>
          - pattern: let $V = <... Math.random() ...>
          - pattern: let $V = <... Math.random() ...> + $Y
          - pattern: const $V = <... Math.random() ...> + $Y
          - pattern: $V = <... Math.random() ...> + $Y
          - pattern: '$V: <... Math.random() ...>'
      - metavariable-regex:
          metavariable: $V
          regex: (?i)^(?:.*(?:token|secret|senha|password|nonce|apikey|csrf|authcode|verifier|jti).*|(?:otp|salt|session).*|code)$
    message: >
      `Math.random()` gerando valor de segurança (CWE-338): o resultado é previsível. Use
      `crypto.randomBytes(32).toString('hex')` ou `crypto.randomUUID()`.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-338: Use of Cryptographically Weak Pseudo-Random Number Generator (PRNG)"
      owasp: A02:2021 - Cryptographic Failures

  # --- Camada de dados e utilitários: a falha costuma estar numa função que recebe o dado já pronto,
  # --- longe da rota; o motor não segue o dado entre funções, então estas regras olham o próprio padrão.

  - id: sentinel-node-sql-concatenado
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: '"..." + $B'
              - pattern: '$A + "..."'
          - pattern-not: '"..." + "..."'
      - pattern: '`...${$X}...`'
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $DB.query($Q, ...)
              - pattern: $DB.execute($Q, ...)
              - pattern: $DB.raw($Q, ...)
              - pattern: $DB.unsafe($Q, ...)
          - metavariable-regex:
              metavariable: $DB
              regex: (?i)^(.*\.)?(pool|db|client|conn|connection|knex|sequelize|database|pg|mysql|sqlite|trx|tx)\w*$
          # funções que recebem a requisição já são cobertas por sentinel-node-sql-injection
          - pattern-not-inside: 'function $F(..., req, ...) {...}'
          - pattern-not-inside: 'function $F(..., request, ...) {...}'
          - pattern-not-inside: '(..., req, ...) => {...}'
          - pattern-not-inside: '(..., request, ...) => {...}'
          - pattern-not-inside: '({..., $P, ...}: Request, ...) => {...}'
          - focus-metavariable: $Q
    message: >
      SQL montado com concatenação ou template string (CWE-89): o texto da consulta recebe valor variável
      e o driver não separa dado de comando. Use parâmetros (`$1`, `?`, `:nome`) e, para nome de coluna ou
      ordem, escolha o valor de uma lista fixa.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      owasp: A03:2021 - Injection

  - id: sentinel-node-nosql-operador
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: $REQ.body
              - pattern: $REQ.query
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request)$
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $C.find($Q, ...)
              - pattern: $C.findOne($Q, ...)
              - pattern: $C.findOneAndUpdate($Q, ...)
              - pattern: $C.updateOne($Q, ...)
              - pattern: $C.updateMany($Q, ...)
              - pattern: $C.deleteOne($Q, ...)
              - pattern: $C.deleteMany($Q, ...)
              - pattern: $C.countDocuments($Q, ...)
          - pattern-not: '$C.$M(($A) => ..., ...)'
          - pattern-not: '$C.$M(function (...) {...}, ...)'
          - pattern-not: '$C.$M({..., where: ..., ...}, ...)'
          - focus-metavariable: $Q
    pattern-sanitizers:
      - pattern: String(...)
      - pattern: Number(...)
      - pattern: parseInt(...)
      - pattern: $X.toString()
      - pattern: '`...${...}...`'
    message: >
      Filtro de banco de documentos montado com dado da requisição (CWE-943): um objeto JSON como
      `{"$ne": null}` ou `{"$gt": ""}` vira operador e muda a consulta. Converta o valor para texto
      (`String(valor)`) ou valide o formato antes de consultar.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-943: Improper Neutralization of Special Elements in Data Query Logic"
      owasp: A03:2021 - Injection

  - id: sentinel-node-prototype-pollution
    patterns:
      - pattern-either:
          - pattern: |
              function $F($T, $S) {
                ...
                $F($T[$K], $S[$K]);
                ...
              }
          - pattern: |
              const $F = ($T, $S) => {
                ...
                $F($T[$K], $S[$K]);
                ...
              }
      - pattern-not: |
          function $F($T, $S) {
            ...
            <... "__proto__" ...>
            ...
          }
      - pattern-not: |
          const $F = ($T, $S) => {
            ...
            <... "__proto__" ...>
            ...
          }
    message: >
      Mescla recursiva sem bloquear as chaves `__proto__`, `constructor` e `prototype` (CWE-1321): um JSON
      como `{"__proto__": {"admin": true}}` altera `Object.prototype` e contamina todos os objetos. Ignore
      essas chaves, use `Object.create(null)` ou uma biblioteca mantida e atualizada.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-1321: Improperly Controlled Modification of Object Prototype Attributes ('Prototype Pollution')"
      owasp: A08:2021 - Software and Data Integrity Failures

  - id: sentinel-node-regexp-da-requisicao
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.params
              - pattern: $REQ.body
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request)$
    pattern-sinks:
      - patterns:
          - pattern: new RegExp($P, ...)
          - focus-metavariable: $P
    pattern-sanitizers:
      - patterns:
          - pattern: $F(...)
          - metavariable-regex:
              metavariable: $F
              regex: (?i)^(_\.)?escape(Reg|Re)\w*$
    message: >
      Expressão regular criada com dado da requisição (CWE-1333 / CWE-185): o usuário escolhe o padrão e
      um padrão com repetição aninhada (`^(\d+)*$`) trava o processo (ReDoS). Escape o texto antes de
      montar a expressão, limite o tamanho ou use um motor sem retrocesso (RE2).
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-1333: Inefficient Regular Expression Complexity"
      owasp: A04:2021 - Insecure Design

  - id: sentinel-node-xss-refletido
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.params
              - pattern: $REQ.body
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request)$
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $RES.send($H + $V)
              - pattern: $RES.send($H + $V + $T)
              - pattern: $RES.end($H + $V)
              - pattern: $RES.write($H + $V)
          - metavariable-regex:
              metavariable: $H
              regex: ^["'`]\s*<
          - metavariable-regex:
              metavariable: $RES
              regex: ^(res|response)$
          - focus-metavariable: $V
      - patterns:
          - pattern-either:
              - pattern: $RES.send($T)
              - pattern: $RES.end($T)
              - pattern: $RES.write($T)
          - metavariable-regex:
              metavariable: $RES
              regex: ^(res|response)$
          - metavariable-regex:
              metavariable: $T
              regex: ^`\s*<[\s\S]*\$\{
          - focus-metavariable: $T
    pattern-sanitizers:
      - patterns:
          - pattern: $F(...)
          - metavariable-regex:
              metavariable: $F
              regex: (?i)^(.*\.)?(escape|escapeHtml|encode|encodeURIComponent|sanitize|sanitizeHtml|xss|purify|clean)\w*$
      - pattern: parseInt(...)
      - pattern: Number(...)
    message: >
      HTML montado com dado da requisição e devolvido na resposta (CWE-79): o navegador interpreta o que o
      usuário enviou como marcação (XSS refletido). Escape o valor (`escape-html`, `he.encode`) ou use um
      motor de templates com escape automático.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      owasp: A03:2021 - Injection

  - id: sentinel-node-mass-assignment
    patterns:
      - pattern-either:
          - pattern: $M.create($REQ.body, ...)
          - pattern: $M.update($REQ.body, ...)
          - pattern: $M.updateOne($F, $REQ.body, ...)
          - pattern: $M.findByIdAndUpdate($I, $REQ.body, ...)
          - pattern: $M.findOneAndUpdate($F, $REQ.body, ...)
          - pattern: new $M($REQ.body)
          - pattern: Object.assign($X, $REQ.body)
      - metavariable-regex:
          metavariable: $REQ
          regex: ^(req|request)$
      - metavariable-regex:
          metavariable: $M
          regex: ^(?!Object$|JSON$|Array$|Math$|Promise$|RegExp$|Map$|Set$|Date$|Error$|URL$|Buffer$)(?:[A-Z]\w*|\w*[Mm]odel\w*|\w*[Rr]epo\w*)$
    message: >
      O corpo da requisição é gravado inteiro no modelo (CWE-915): quem envia `{"role": "admin"}` ou
      `{"balance": 9999}` promove a si mesmo. Escolha os campos permitidos um a um (`{ nome, email }`) e
      defina papel e saldo só no servidor.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-915: Improperly Controlled Modification of Dynamically-Determined Object Attributes"
      owasp: A04:2021 - Insecure Design

  - id: sentinel-node-mass-assignment-campo
    patterns:
      - pattern-either:
          - pattern: $O.$P = $REQ.body.$Q
          - pattern: $O.$P = $REQ.body.$Q || ...
          - pattern: $O.$P = $REQ.body.$Q ?? ...
          - pattern: '{..., $P: $REQ.body.$Q, ...}'
      - metavariable-regex:
          metavariable: $REQ
          regex: ^(req|request)$
      - metavariable-regex:
          metavariable: $P
          regex: ^(role|roles|isAdmin|is_admin|admin|permissions|balance|saldo|isStaff|is_staff)$
    message: >
      Campo privilegiado (papel, permissão ou saldo) recebe o valor enviado pelo cliente (CWE-915): quem
      envia `{"role": "admin"}` promove a si mesmo. Defina esse campo só no servidor ou confira o valor
      contra uma lista permitida.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-915: Improperly Controlled Modification of Dynamically-Determined Object Attributes"
      owasp: A04:2021 - Insecure Design

  - id: sentinel-node-session-secret-literal
    patterns:
      - pattern-either:
          - pattern: '$S({..., secret: "...", ...})'
          - pattern: '$S({..., secret: `...`, ...})'
      - metavariable-regex:
          metavariable: $S
          regex: ^(session|expressSession|cookieSession|(\w+\.)?session)$
    message: >
      Segredo de sessão escrito no código (CWE-798). Quem lê o repositório consegue forjar o cookie de sessão.
      Leia o valor de uma variável de ambiente ou de um cofre de segredos e use um valor longo e aleatório.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: A07:2021 - Identification and Authentication Failures

  - id: sentinel-node-nosql-where-concatenado
    pattern-either:
      - pattern-regex: |-
          \$where[^\n]*['"]\s*\+\s*[A-Za-z_]
      - pattern-regex: |-
          \$where[^\n]*\$\{
    message: >
      Consulta `$where` do MongoDB montada por concatenação de texto (CWE-943): o conteúdo vira JavaScript executado no
      banco. Troque por operadores de consulta (`{ campo: valor }`) e não monte JSON por texto.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      side: back
      category: security
      cwe: "CWE-943: Improper Neutralization of Special Elements in Data Query Logic"
      owasp: A03:2021 - Injection
