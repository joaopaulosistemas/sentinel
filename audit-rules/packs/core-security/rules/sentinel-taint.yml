# Fluxo de dados (taint) dentro do mesmo arquivo. Casos de teste: tests/sentinel-taint.java e tests/sentinel-taint.ts
rules:
  - id: sentinel-taint-sql-parametro-http
    mode: taint
    pattern-sources:
      - patterns:
          - pattern: $P
          - pattern-either:
              - pattern-inside: |
                  $RET $M(..., @RequestParam $T $P, ...) { ... }
              - pattern-inside: |
                  $RET $M(..., @RequestParam(...) $T $P, ...) { ... }
    pattern-sanitizers:
      - pattern: Integer.parseInt(...)
      - pattern: Long.parseLong(...)
    pattern-sinks:
      - patterns:
          - focus-metavariable: $Q
          - pattern-either:
              - pattern: $JDBC.query($Q, ...)
              - pattern: $JDBC.queryForObject($Q, ...)
              - pattern: $JDBC.execute($Q)
              - pattern: $EM.createNativeQuery($Q, ...)
              - pattern: $EM.createQuery($Q, ...)
    message: >
      Parâmetro da requisição chegando concatenado numa consulta SQL/JPQL (injeção de SQL). Use parâmetros nomeados
      (:nome) ou "?" com binding; nunca monte a consulta com +.
    severity: ERROR
    languages: [java]
    paths:
      exclude: ["**/test/**", "**/target/**"]
    metadata:
      category: security
      cwe: "CWE-89: SQL Injection"
      owasp: A03:2021 - Injection
  - id: sentinel-taint-html-parametro-url
    mode: taint
    pattern-sources:
      - pattern: location.search
      - pattern: location.hash
      - pattern: $ROUTE.snapshot.queryParams
      - pattern: $ROUTE.snapshot.paramMap.get(...)
    pattern-sinks:
      - pattern: $EL.innerHTML = $X
      - pattern: document.write($X)
      - pattern: $SAN.bypassSecurityTrustHtml($X)
    message: >
      Dado vindo da URL chegando em innerHTML/document.write/bypassSecurityTrustHtml (XSS). Use interpolação do
      framework ({{ }} ou JSX) que escapa o texto.
    severity: ERROR
    languages: [typescript, javascript]
    paths:
      exclude: ["**/node_modules/**", "**/*.spec.ts"]
    metadata:
      category: security
      cwe: "CWE-79: Cross-site Scripting"
      owasp: A03:2021 - Injection

  - id: sentinel-servlet-path-traversal
    mode: taint
    pattern-sources:
      - pattern: $REQ.getParameter(...)
      - pattern: $REQ.getParameterValues(...)
      - pattern: $REQ.getHeader(...)
      - pattern: $REQ.getHeaders(...)
      - pattern: $REQ.getHeaderNames()
      - pattern: $REQ.getParameterNames()
      - pattern: $REQ.getParameterMap()
      - pattern: $REQ.getRequestURL()
      - pattern: $REQ.getQueryString()
      - pattern: $REQ.getRequestURI()
      - pattern: $C.getValue()
      - patterns:
          - pattern-inside: |
              $RET $M(..., @$A(...) String $P, ...) { ... }
          - metavariable-regex:
              metavariable: $A
              regex: ^(RequestParam|PathVariable|RequestHeader|QueryParam|PathParam|FormParam|HeaderParam)$
          - focus-metavariable: $P
      - patterns:
          - pattern-inside: |
              @$M(...)
              $RET $F(..., String $P, ...) { ... }
          - metavariable-regex:
              metavariable: $M
              regex: ^(Get|Post|Put|Delete|Patch|Request)Mapping$
          - focus-metavariable: $P
    # O dado que entra numa coleção continua sendo dado externo quando sai dela (list.add / map.put).
    pattern-propagators:
      - pattern: $L.add($X)
        from: $X
        to: $L
      - pattern: $M.put($K, $X)
        from: $X
        to: $M
    pattern-sinks:
      # new File(base, entrada).getCanonicalFile() é o primeiro passo da defesa; o uso do resultado sem conferir o
      # prefixo continua sendo achado (FileInputStream etc. recebem o dado ainda contaminado)
      - patterns:
          - pattern-either:
              - pattern: new java.io.File(...)
              - pattern: new File(...)
          - pattern-not-inside: new java.io.File(...).getCanonicalFile()
          - pattern-not-inside: new File(...).getCanonicalFile()
          - pattern-not-inside: new java.io.File(...).getCanonicalPath()
          - pattern-not-inside: new File(...).getCanonicalPath()
      - pattern: java.nio.file.Paths.get(...)
      - pattern: java.nio.file.Path.of(...)
      - pattern: new java.io.FileInputStream(...)
      - pattern: new java.io.FileOutputStream(...)
      - pattern: new java.io.FileReader(...)
      - pattern: new java.io.FileWriter(...)
      - pattern: new FileInputStream(...)
      - pattern: new FileOutputStream(...)
    pattern-sanitizers:
      - pattern: $X.getName()
      - pattern: $X.getFileName()
      - pattern: org.apache.commons.io.FilenameUtils.getName(...)
      - pattern: $ENC.encodeForHTML(...)
      # depois de `if (!arq.toPath().startsWith(base)) throw ...` o caminho está dentro do diretório permitido
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: $F.toPath().startsWith(...)
              - pattern: $F.getCanonicalPath().startsWith(...)
          - focus-metavariable: $F
    message: >
      Possível Path Traversal (CWE-22): um dado da requisição (parâmetro, cabeçalho ou cookie) forma o caminho de um arquivo.
      Use só o nome do arquivo (`getFileName()`), normalize e confira que o caminho final continua dentro do diretório permitido.
    severity: ERROR
    languages: [java]
    metadata:
      category: security
      cwe: "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
      owasp: A01:2021 - Broken Access Control

  - id: sentinel-resource-path-concatenado
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-inside: |
              $RET $M(..., @$A(...) String $P, ...) { ... }
          - metavariable-regex:
              metavariable: $A
              regex: ^(RequestParam|PathVariable|RequestHeader|QueryParam|PathParam|FormParam|HeaderParam)$
          - focus-metavariable: $P
      # ajudante que recebe o nome do arquivo já vindo do controlador (o taint não atravessa a chamada)
      - patterns:
          - pattern-inside: |
              $RET $M(..., String $P, ...) { ... }
          - metavariable-regex:
              metavariable: $P
              regex: (?i)^\w*(file|filename|nome\w*arquivo|arquivo|path|caminho|resource|recurso|template)\w*$
          - focus-metavariable: $P
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $X.getResourceAsStream($BASE + $ARG)
              - pattern: $X.getResource($BASE + $ARG)
              - pattern: new ClassPathResource($BASE + $ARG)
              - pattern: new org.springframework.core.io.ClassPathResource($BASE + $ARG)
              - pattern: new FileSystemResource($BASE + $ARG)
              - pattern: new org.springframework.core.io.FileSystemResource($BASE + $ARG)
          - focus-metavariable: $ARG
    pattern-sanitizers:
      - pattern: $X.getName()
      - pattern: $X.getFileName()
      - pattern: org.apache.commons.io.FilenameUtils.getName(...)
      - pattern: FilenameUtils.getName(...)
    message: >
      Possível Path Traversal (CWE-22): o nome do arquivo vem do cliente e é concatenado a um prefixo na leitura de um recurso
      (classpath ou disco). `../` sai do diretório pretendido. Use só o nome (`getFileName()`), normalize e confira o prefixo,
      ou aceite apenas nomes de uma lista fixa.
    severity: WARNING
    languages: [java]
    metadata:
      category: security
      cwe: "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
      owasp: A01:2021 - Broken Access Control

  - id: sentinel-servlet-trust-boundary
    mode: taint
    pattern-sources:
      - pattern: $REQ.getParameter(...)
      - pattern: $REQ.getParameterValues(...)
      - pattern: $REQ.getHeader(...)
      - pattern: $REQ.getHeaders(...)
      - pattern: $REQ.getParameterNames()
      - pattern: $REQ.getParameterMap()
      - pattern: $REQ.getRequestURL()
      - pattern: $REQ.getQueryString()
      - pattern: $REQ.getRequestURI()
      - pattern: $C.getValue()
      - patterns:
          - pattern-inside: |
              $RET $M(..., @$A(...) String $P, ...) { ... }
          - metavariable-regex:
              metavariable: $A
              regex: ^(RequestParam|PathVariable|RequestHeader|QueryParam|PathParam|FormParam|HeaderParam)$
          - focus-metavariable: $P
      - patterns:
          - pattern-inside: |
              @$M(...)
              $RET $F(..., String $P, ...) { ... }
          - metavariable-regex:
              metavariable: $M
              regex: ^(Get|Post|Put|Delete|Patch|Request)Mapping$
          - focus-metavariable: $P
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $REQ.getSession(...).setAttribute($K, $V)
              - pattern: $REQ.getSession(...).putValue($K, $V)
              - pattern: (HttpSession $S).setAttribute($K, $V)
              - pattern: (HttpSession $S).putValue($K, $V)
          - focus-metavariable: [$K, $V]
    pattern-sanitizers:
      - patterns:
          - pattern: $ENC.$F(...)
          - metavariable-regex:
              metavariable: $F
              regex: ^(encodeFor(HTML|HTMLAttribute|JavaScript|CSS|URL|XML)|forHtml|escapeHtml4?|htmlEscape|valueOf|parseInt|parseLong)$
    message: >
      Violação de fronteira de confiança (CWE-501): um dado não validado da requisição é colocado na sessão.
      Valide (lista permitida, tipo e tamanho) antes de guardar na sessão, e nunca use dado do cliente como chave do atributo.
    severity: WARNING
    languages: [java]
    metadata:
      category: security
      cwe: "CWE-501: Trust Boundary Violation"
      owasp: A04:2021 - Insecure Design
