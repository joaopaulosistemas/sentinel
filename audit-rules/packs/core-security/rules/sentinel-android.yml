rules:
  - id: sentinel-android-log-segredo
    patterns:
      - pattern: Log.$M($TAG, <... $ARG ...>, ...)
      - metavariable-regex:
          metavariable: $M
          regex: ^(v|d|i|w|e|wtf)$
      - metavariable-regex:
          metavariable: $ARG
          regex: "^[^'\"]*(?:[Pp]ass(?:word|wd)|[Ss]enha|[Ss]ecret|[Tt]oken|[Jj]wt|[Aa]pi_?[Kk]ey|[Aa]uthorization|[Pp]rivate_?[Kk]ey|[Cc]redential)"
    message: >
      Token, senha ou segredo gravado no logcat (CWE-532). Em Android qualquer app com permissão de depuração, o adb e
      relatórios de erro leem o logcat, e o valor vale como credencial enquanto não expirar. Remova o valor do log.
    severity: WARNING
    languages: [java]
    metadata:
      category: security
      cwe: "CWE-532: Insertion of Sensitive Information into Log File"
      owasp: M9 - Insecure Data Storage

  - id: sentinel-android-webview-url-do-intent
    mode: taint
    pattern-sources:
      - pattern: getIntent().getData().getQueryParameter(...)
      - pattern: getIntent().getStringExtra(...)
      - pattern: getIntent().getDataString()
      - pattern: $I.getData().getQueryParameter(...)
      - pattern: $I.getStringExtra(...)
    pattern-sinks:
      - pattern: $W.loadUrl($X, ...)
        focus-metavariable: $X
    message: >
      URL recebida por Intent (deep link ou extra) carregada direto no WebView (CWE-939/CWE-79). Outro app, ou uma
      página aberta no navegador, escolhe a página que roda dentro do app, com o JavaScript e as sessões dele. Valide
      esquema e host contra uma lista de permissão antes de chamar loadUrl.
    severity: ERROR
    languages: [java]
    metadata:
      category: security
      cwe: "CWE-939: Improper Authorization in Handler for Custom URL Scheme"
      owasp: M4 - Insufficient Input/Output Validation

  - id: sentinel-android-webview-javascript
    pattern: $S.setJavaScriptEnabled(true)
    message: >
      JavaScript habilitado no WebView. Só carregue conteúdo próprio ou de hosts fixos; com URL vinda de fora do app
      isso permite XSS dentro do app (CWE-79).
    severity: INFO
    languages: [java]
    metadata:
      category: security
      cwe: "CWE-79: Cross-site Scripting"
      owasp: M4 - Insufficient Input/Output Validation

  - id: sentinel-android-webview-acesso-arquivo
    pattern-either:
      - pattern: $S.setAllowFileAccess(true)
      - pattern: $S.setAllowFileAccessFromFileURLs(true)
      - pattern: $S.setAllowUniversalAccessFromFileURLs(true)
    message: >
      WebView com acesso a arquivos local habilitado (CWE-200/CWE-922). Com JavaScript ligado, uma página carregada
      pode ler arquivos do app (file://) e mandá-los para fora. Deixe setAllowFileAccess(false) e, se precisar de
      arquivos do APK, use WebViewAssetLoader em vez de file://.
    severity: WARNING
    languages: [java]
    metadata:
      category: security
      cwe: "CWE-200: Exposure of Sensitive Information to an Unauthorized Actor"
      owasp: M8 - Security Misconfiguration

  - id: sentinel-android-webview-texto-da-tela
    mode: taint
    pattern-sources:
      - pattern: (android.widget.EditText $E).getText().toString()
      - pattern: (EditText $E).getText().toString()
      - pattern: (TextInputEditText $E).getText().toString()
    pattern-sinks:
      - pattern: $W.loadUrl($X, ...)
        focus-metavariable: $X
      - pattern: $W.loadData($X, ...)
        focus-metavariable: $X
      - pattern: $W.loadDataWithBaseURL($B, $X, ...)
        focus-metavariable: $X
    message: >
      Texto digitado na tela carregado direto no WebView (CWE-79/CWE-601). Quem digita (ou um preenchimento automático
      malicioso) escolhe a página ou o HTML que roda dentro do app, com JavaScript e sessões dele. Valide esquema e
      host contra uma lista de permissão e nunca monte HTML a partir do texto sem escapar.
    severity: WARNING
    languages: [java]
    metadata:
      category: security
      cwe: "CWE-79: Cross-site Scripting"
      owasp: M4 - Insufficient Input/Output Validation

  - id: sentinel-android-manifest-allow-backup
    pattern: 'android:allowBackup="true"'
    message: >
      O app permite cópia de segurança pelo adb (allowBackup=true): quem tem o aparelho extrai bancos e
      preferências do app (CWE-921). Use android:allowBackup="false" ou regras de backup que excluam dados sensíveis.
    severity: WARNING
    languages: [generic]
    metadata:
      side: common
      category: security
      cwe: "CWE-921: Storage of Sensitive Data in a Mechanism without Access Control"
      owasp: M9 - Insecure Data Storage

  - id: sentinel-android-manifest-cleartext
    pattern: 'android:usesCleartextTraffic="true"'
    message: >
      O app aceita tráfego HTTP sem TLS (usesCleartextTraffic=true): a rede intercepta e altera tokens e dados
      (CWE-319). Remova o atributo e use HTTPS; para exceção de desenvolvimento use networkSecurityConfig só no
      build de depuração.
    severity: ERROR
    languages: [generic]
    metadata:
      side: common
      category: security
      cwe: "CWE-319: Cleartext Transmission of Sensitive Information"
      owasp: M5 - Insecure Communication

  - id: sentinel-android-manifest-exported
    patterns:
      - pattern: 'android:exported="true"'
      # a activity de entrada (MAIN/LAUNCHER) precisa ser exportada desde o Android 12: não é achado
      - pattern-not-inside: |
          <activity ... android:exported="true" ...> ... android.intent.category.LAUNCHER ... </activity>
    message: >
      Componente exportado (exported=true): qualquer app do aparelho pode iniciá-lo com Intent própria (CWE-926).
      Exporte só o necessário, exija android:permission e valide os extras recebidos.
    severity: WARNING
    languages: [generic]
    metadata:
      side: common
      category: security
      cwe: "CWE-926: Improper Export of Android Application Components"
      owasp: M8 - Security Misconfiguration

  - id: sentinel-android-modo-mundo
    patterns:
      - pattern-either:
          - pattern: $C.$M(..., $MODE, ...)
          - pattern: $M(..., $MODE, ...)
      - metavariable-regex:
          metavariable: $M
          regex: ^(getSharedPreferences|openFileOutput|getDir|openOrCreateDatabase)$
      - metavariable-regex:
          metavariable: $MODE
          regex: ^(Context\.)?MODE_WORLD_(READABLE|WRITEABLE)$
    message: >
      Arquivo, preferência ou banco criado com MODE_WORLD_READABLE/WRITEABLE (CWE-732): qualquer outro app do
      aparelho lê ou altera os dados, inclusive credenciais. Use MODE_PRIVATE e compartilhe por ContentProvider com
      permissão ou FileProvider.
    severity: ERROR
    languages: [java]
    metadata:
      category: security
      cwe: "CWE-732: Incorrect Permission Assignment for Critical Resource"
      owasp: M9 - Insecure Data Storage

  - id: sentinel-android-provider-openfile-caminho
    patterns:
      - pattern-inside: |
          ParcelFileDescriptor openFile(Uri $U, String $M) { ... }
      - pattern-either:
          - pattern: new File($D, $U.getLastPathSegment())
          - pattern: new File($D, $U.getPath())
          - pattern: new File($U.getPath())
          - pattern: new File($D, $U.getPathSegments().get(...))
          - pattern: new File($D, $U.getEncodedPath())
      - pattern-not-inside: |
          ParcelFileDescriptor openFile(Uri $U, String $M) {
            ...
            if (<... $X.getCanonicalPath() ...>) { ... }
            ...
          }
      - pattern-not-inside: |
          ParcelFileDescriptor openFile(Uri $U, String $M) {
            ...
            $T $V = $X.getCanonicalPath();
            ...
          }
    message: >
      ContentProvider.openFile monta o caminho do arquivo com o Uri recebido de outro app (CWE-22). Segmentos como
      "..%2F" ou um caminho absoluto levam o provider a ler ou sobrescrever arquivos fora da pasta prevista, inclusive
      os privados do app. Resolva o caminho com getCanonicalPath() e confira que ele começa pela pasta permitida (ou
      use uma lista de nomes), e proteja o provider com android:permission.
    severity: ERROR
    languages: [java]
    metadata:
      category: security
      cwe: "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
      owasp: M4 - Insufficient Input/Output Validation

  - id: sentinel-android-classloader-armazenamento-externo
    patterns:
      - pattern-either:
          - pattern: new DexClassLoader(...)
          - pattern: new PathClassLoader(...)
          - pattern: new InMemoryDexClassLoader(...)
      - pattern-either:
          - patterns:
              - pattern-inside: |
                  $R $M(...) {
                    ...
                    new File("$V");
                    ...
                  }
              - metavariable-regex:
                  metavariable: $V
                  regex: '^/(sdcard|storage|mnt)\b.*'
          - pattern-inside: |
              $R $M(...) {
                ...
                Environment.getExternalStorageDirectory();
                ...
              }
          - pattern-inside: |
              $R $M(...) {
                ...
                $C.getExternalFilesDir(...);
                ...
              }
          - pattern-inside: |
              $R $M(...) {
                ...
                $C.getExternalCacheDir();
                ...
              }
    message: >
      Código carregado dinamicamente (DexClassLoader/PathClassLoader) de arquivo no armazenamento externo (CWE-94).
      Qualquer app com permissão de escrita no cartão troca o arquivo e executa código no processo do seu app, com as
      permissões dele. Guarde o código no armazenamento interno (getFilesDir, modo somente leitura), confira a
      assinatura/hash antes de carregar e prefira não carregar código de fora do APK.
    severity: ERROR
    languages: [java]
    metadata:
      category: security
      cwe: "CWE-94: Improper Control of Generation of Code ('Code Injection')"
      owasp: M7 - Insufficient Binary Protections

  - id: sentinel-android-sqlite-concatenado
    patterns:
      - pattern-either:
          - pattern: $DB.rawQuery($Q, ...)
          - pattern: $DB.execSQL($Q, ...)
          - pattern: $QB.appendWhere($Q)
          - pattern: (android.database.sqlite.SQLiteDatabase $DB).delete($T, $Q, ...)
          - pattern: (SQLiteDatabase $DB).delete($T, $Q, ...)
          - pattern: (android.database.sqlite.SQLiteDatabase $DB).update($T, $V, $Q, ...)
          - pattern: (SQLiteDatabase $DB).update($T, $V, $Q, ...)
      # só conta quando a consulta junta algo que não é literal nem constante (NOME_EM_MAIÚSCULAS)
      - metavariable-pattern:
          metavariable: $Q
          patterns:
            - pattern-either:
                - patterns:
                    - pattern: <... $L + $X ...>
                    - metavariable-regex:
                        metavariable: $X
                        regex: '^(?!["\x27])(?![A-Z][A-Z0-9_]*(\.[A-Z][A-Z0-9_]*)*$).+'
                - patterns:
                    - pattern: <... $X + $R ...>
                    - metavariable-regex:
                        metavariable: $X
                        regex: '^(?!["\x27])(?![A-Z][A-Z0-9_]*(\.[A-Z][A-Z0-9_]*)*$)(?!.* \+ ).+'
    message: >
      Consulta SQLite montada por concatenação (CWE-89): se o texto vier de um campo da tela, de um Intent ou da URI de
      um ContentProvider, quem controla a entrada altera a consulta e lê ou apaga dados de outros registros. Use
      parâmetros (?) com o array de argumentos: rawQuery(sql, args), db.delete(tabela, "id = ?", args).
    severity: WARNING
    languages: [java, kotlin]
    metadata:
      category: security
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      owasp: M4 - Insufficient Input/Output Validation

  - id: sentinel-android-segredo-literal-comparado
    patterns:
      - pattern-either:
          - pattern: $IN.equals("$LIT")
          - pattern: $IN.equalsIgnoreCase("$LIT")
          - pattern: '"$LIT".equals($IN)'
          - pattern: '"$LIT".equalsIgnoreCase($IN)'
      # palavra única de 8+ letras/dígitos que contém um termo de segredo ("vendorsecretkey"); "password",
      # "access_token" e frases ficam de fora: são nomes de campo ou rótulos, não o valor do segredo
      - metavariable-regex:
          metavariable: $LIT
          regex: '^(?i)(?=[A-Za-z0-9]{8,}$)[A-Za-z0-9]*(secret|passw|senha|token|apikey|privatekey|vendorkey|licensekey)[A-Za-z0-9]*$'
      - metavariable-regex:
          metavariable: $LIT
          regex: '^(?i)(?!(password|passwords|passwd|secretkey|accesstoken|refreshtoken|authtoken|senha)$).*'
    message: >
      O código compara o que o usuário digitou com uma chave ou senha escrita no código (CWE-798). Quem abre o APK ou o
      JAR (decompilador, strings) lê o valor e passa pela verificação. Valide no servidor ou compare o hash de um
      segredo guardado fora do código (Keystore, variável de ambiente).
    severity: ERROR
    languages: [java]
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: M1 - Improper Credential Usage

  - id: sentinel-android-prefs-senha-em-claro
    patterns:
      - pattern: $ED.putString("$K", $V)
      - metavariable-regex:
          metavariable: $K
          regex: '^(?i)([a-z0-9]*[_.-])?(passw(or)?d|pwd|pass|senha|secret|pin|apikey|api_key|credit_?card|cvv)$'
      - pattern-not: $ED.putString("$K", "")
      - pattern-not: $ED.putString("$K", null)
    message: >
      Senha, PIN ou segredo gravado em SharedPreferences sem criptografia (CWE-312): o arquivo XML fica legível com
      backup do adb, com root e em aparelhos de outro dono. Guarde um token de curta duração, ou cifre com o Android
      Keystore (EncryptedSharedPreferences).
    severity: WARNING
    languages: [java]
    metadata:
      category: security
      cwe: "CWE-312: Cleartext Storage of Sensitive Information"
      owasp: M9 - Insecure Data Storage

  - id: sentinel-android-manifest-intent-filter-implicito
    patterns:
      - pattern-regex: '<(?:activity|service|receiver)\b(?:(?!android:exported|>)[\s\S])*>\s*<intent-filter>(?:(?!</intent-filter>)[\s\S])*</intent-filter>'
      # a activity de entrada (MAIN/LAUNCHER) é exportada por desenho
      - pattern-not-regex: '<(?:activity|service|receiver)\b(?:(?!android:exported|>)[\s\S])*>\s*<intent-filter>(?:(?!</intent-filter>)[\s\S])*android\.intent\.category\.LAUNCHER(?:(?!</intent-filter>)[\s\S])*</intent-filter>'
    message: >
      Componente com <intent-filter> e sem android:exported (CWE-926): em apps com targetSdk abaixo de 31 isso o torna
      exportado, e qualquer app do aparelho o inicia com uma Intent própria, inclusive telas que mostram dados
      restritos. Declare android:exported="false" (ou "true" só se for preciso) e valide os extras recebidos.
    severity: WARNING
    languages: [generic]
    paths:
      include:
        - "*.xml"
    metadata:
      category: security
      cwe: "CWE-926: Improper Export of Android Application Components"
      owasp: M8 - Security Misconfiguration
