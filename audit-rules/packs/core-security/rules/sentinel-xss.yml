rules:
  - id: sentinel-xss-jsp-unescaped-output
    # JSP não é uma linguagem suportada pelo parser do Semgrep: usa o modo "generic".
    patterns:
      - pattern: <%= ... %>
      # texto de pacote de mensagens (escrito pela equipe) e saída já passada por um codificador conhecido
      - pattern-not-regex: '<%=[^%]*([Bb]undle\w*\.getString\(|Encode\.for\w+\(|encodeFor\w+\(|escapeHtml\w*\(|escapeXml\w*\(|escapeJavaScript\()[^%]*%>'
      # caminho da aplicação (idioma `String path = request.getContextPath();` do cabeçalho comum) e ajudante `esc(...)`
      - pattern-not-regex: '<%=\s*(request\.getContextPath\(\)|path|contextPath|ctxPath|ctx|basePath|esc\([^()%]*(\([^()%]*\))?[^()%]*\))\s*%>'
      # saída numérica pelo nome do acessador (`x.getId()`, `getCommentCount()`, `getSize()`, `.size()`, `.length()`) e ternário que só devolve literais
      - pattern-not-regex: '<%=\s*[\w.]+\.(get\w*(Id|Count|Size|Total|Length|Number)|size|length)\(\)\s*%>'
      - pattern-not-regex: '<%=\s*\(?[^%"?]*\?\s*"[^"%]*"\s*:\s*"[^"%]*"\s*\)?\s*%>'
      # constante estática em maiúsculas (`Classe.NOME_DA_ACAO`): valor do código, não da requisição
      - pattern-not-regex: '<%=\s*(\w+\.)*[A-Z][A-Z0-9_]+\s*%>'
    paths:
      include:
        - "*.jsp"
    message: >
      Possível XSS (OWASP A03): saída não escapada em JSP via '<%= %>'.
      Use '<c:out value="${...}" />' ou JSTL fn:escapeXml para escapar o HTML.
      Limite: '<%= path %>', '<%= request.getContextPath() %>' e '<%= esc(...) %>' são ignorados por nome; se a variável
      'path' vier da requisição (e não do contexto da aplicação), o XSS não é apontado.
    severity: WARNING
    languages: [generic]
    metadata:
      category: security
      cwe: "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      owasp: A03:2021 - Injection

  - id: sentinel-xss-response-write
    mode: taint
    pattern-sources:
      - pattern: $REQ.getParameter(...)
      - pattern: $REQ.getParameterValues(...)
      - pattern: $REQ.getHeader(...)
      - pattern: $REQ.getHeaders(...)
      - pattern: $REQ.getParameterNames()
      - pattern: $REQ.getParameterMap()
      - pattern: $REQ.getRequestURL()
      - pattern: $REQ.getQueryString()
      - pattern: $REQ.getRequestURI()
      - pattern: $REQ.getCookies()
      - pattern: $C.getValue()
      - patterns:
          - pattern-inside: |
              $RET $M(..., String $P, ...) { ... }
          - focus-metavariable: $P
    pattern-sinks:
      - patterns:
          - pattern: $RESP.getWriter().$W(...)
          - metavariable-regex:
              metavariable: $W
              regex: ^(print|println|write|append|printf|format)$
    pattern-sanitizers:
      - patterns:
          - pattern: $ENC.$F(...)
          - metavariable-regex:
              metavariable: $F
              regex: ^(encodeFor(HTML|HTMLAttribute|JavaScript|CSS|URL|XML|XMLAttribute)|forHtml(Content|Attribute|UnquotedAttribute)?|forJavaScript|forCssString|forUriComponent|escapeHtml4?|escapeXml(10|11)?|escapeEcmaScript|htmlEscape|sanitize)$
    message: >
      Possível XSS (OWASP A03): dado vindo da requisição é escrito na resposta HTTP sem escape.
      Escape o conteúdo no contexto certo (OWASP Java Encoder `Encode.forHtml`, ESAPI `encodeForHTML`, Spring `HtmlUtils.htmlEscape`) antes de enviar ao cliente.
    severity: WARNING
    languages: [java]
    metadata:
      category: security
      cwe: "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      owasp: A03:2021 - Injection

  - id: sentinel-xss-inner-html
    patterns:
      - pattern-either:
          - pattern: $EL.innerHTML = $INPUT
          - pattern: $EL.outerHTML = $INPUT
          - pattern: $EL.insertAdjacentHTML($POS, $INPUT)
          - pattern: document.write($INPUT)
      - pattern-not: $EL.innerHTML = "..."
      - pattern-not: $EL.outerHTML = "..."
      - pattern-not: $EL.insertAdjacentHTML($POS, "...")
      - pattern-not: document.write("...")
    message: >
      Possível XSS (OWASP A03): HTML inserido no DOM a partir de '$INPUT'.
      Use textContent ou sanitize com DOMPurify antes de inserir.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      category: security
      cwe: "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      owasp: A03:2021 - Injection

  - id: sentinel-vue-v-html
    # `v-html` põe o texto como HTML, sem escapar. Vale para Vue 2 e 3; fica no pacote que roda sempre porque XSS não é estilo.
    # Ignora o valor passado por um sanitizador conhecido (DOMPurify, sanitize..., escape...).
    pattern-regex: '(?m)\bv-html\s*=\s*"(?![^"]*(?:[Ss]anitiz|[Pp]urify|[Ee]scape))'
    message: >
      v-html insere HTML sem escapar: com dado do usuário vira XSS. Use a interpolação {{ }}, que escapa o texto,
      ou sanitize o HTML (DOMPurify) antes de exibir.
    severity: ERROR
    languages: [regex]
    paths:
      include: ["*.vue"]
      exclude: ["**/node_modules/**"]
    metadata:
      category: security
      cwe: "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      owasp: A03:2021 - Injection
