rules:
  - id: sentinel-xss-jsp-unescaped-output
    # JSP não é uma linguagem suportada pelo parser do Semgrep: usa o modo "generic".
    pattern: <%= ... %>
    paths:
      include:
        - "*.jsp"
    message: >
      Possível XSS (OWASP A03): saída não escapada em JSP via '<%= %>'.
      Use '<c:out value="${...}" />' ou JSTL fn:escapeXml para escapar o HTML.
    severity: WARNING
    languages: [generic]
    metadata:
      category: security
      cwe: "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      owasp: A03:2021 - Injection

  - id: sentinel-xss-response-write
    mode: taint
    pattern-sources:
      - pattern: $REQ.getParameter(...)
      - pattern: $REQ.getParameterValues(...)
      - pattern: $REQ.getHeader(...)
      - pattern: $REQ.getHeaders(...)
      - pattern: $REQ.getParameterNames()
      - pattern: $REQ.getParameterMap()
      - pattern: $REQ.getRequestURL()
      - pattern: $REQ.getQueryString()
      - pattern: $REQ.getRequestURI()
      - pattern: $REQ.getCookies()
      - pattern: $C.getValue()
      - patterns:
          - pattern-inside: |
              $RET $M(..., String $P, ...) { ... }
          - focus-metavariable: $P
    pattern-sinks:
      - patterns:
          - pattern: $RESP.getWriter().$W(...)
          - metavariable-regex:
              metavariable: $W
              regex: ^(print|println|write|append|printf|format)$
    pattern-sanitizers:
      - patterns:
          - pattern: $ENC.$F(...)
          - metavariable-regex:
              metavariable: $F
              regex: ^(encodeFor(HTML|HTMLAttribute|JavaScript|CSS|URL|XML|XMLAttribute)|forHtml(Content|Attribute|UnquotedAttribute)?|forJavaScript|forCssString|forUriComponent|escapeHtml4?|escapeXml(10|11)?|escapeEcmaScript|htmlEscape|sanitize)$
    message: >
      Possível XSS (OWASP A03): dado vindo da requisição é escrito na resposta HTTP sem escape.
      Escape o conteúdo no contexto certo (OWASP Java Encoder `Encode.forHtml`, ESAPI `encodeForHTML`, Spring `HtmlUtils.htmlEscape`) antes de enviar ao cliente.
    severity: WARNING
    languages: [java]
    metadata:
      category: security
      cwe: "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      owasp: A03:2021 - Injection

  - id: sentinel-xss-inner-html
    patterns:
      - pattern-either:
          - pattern: $EL.innerHTML = $INPUT
          - pattern: $EL.outerHTML = $INPUT
          - pattern: $EL.insertAdjacentHTML($POS, $INPUT)
          - pattern: document.write($INPUT)
      - pattern-not: $EL.innerHTML = "..."
      - pattern-not: $EL.outerHTML = "..."
      - pattern-not: $EL.insertAdjacentHTML($POS, "...")
      - pattern-not: document.write("...")
    message: >
      Possível XSS (OWASP A03): HTML inserido no DOM a partir de '$INPUT'.
      Use textContent ou sanitize com DOMPurify antes de inserir.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      category: security
      cwe: "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      owasp: A03:2021 - Injection
