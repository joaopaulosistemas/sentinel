# Vazamento de memória no navegador (Angular). Casos de teste: tests/sentinel-memoria-front.ts
rules:
  - id: sentinel-mem-setinterval-sem-clear
    patterns:
      - pattern: setInterval(...)
      # só em classe (Angular): em hook ou função do React quem cobre é sentinel-mem-react-effect-sem-cleanup
      - pattern-inside: |
          class $C { ... }
      - pattern-not-inside: |
          class $C {
            ...
            $M(...) {
              ...
              clearInterval(...);
              ...
            }
            ...
          }
    message: >
      setInterval sem clearInterval na mesma classe. O temporizador continua rodando (e segurando tudo o que o
      callback referencia) depois que o componente é destruído. Guarde o id e limpe em ngOnDestroy.
    severity: WARNING
    languages: [typescript]
    paths:
      include: ["*.ts"]
      exclude: ["**/*.spec.ts", "**/*.test.ts", "**/node_modules/**"]
    metadata:
      category: performance
      cwe: "CWE-401: Missing Release of Memory after Effective Lifetime"

  - id: sentinel-mem-addeventlistener-sem-remove
    patterns:
      - pattern: $T.addEventListener(...)
      # só em classe (Angular): em hook ou função do React quem cobre é sentinel-mem-react-effect-sem-cleanup
      - pattern-inside: |
          class $C { ... }
      - pattern-not-inside: |
          class $C {
            ...
            $M(...) {
              ...
              $T2.removeEventListener(...);
              ...
            }
            ...
          }
    message: >
      addEventListener sem removeEventListener na mesma classe. O ouvinte sobrevive ao componente e mantém
      referências, o que vaza memória e dispara o código várias vezes. Remova em ngOnDestroy (com a mesma função).
    severity: WARNING
    languages: [typescript]
    paths:
      include: ["*.ts"]
      exclude: ["**/*.spec.ts", "**/*.test.ts", "**/node_modules/**"]
    metadata:
      category: performance
      cwe: "CWE-401: Missing Release of Memory after Effective Lifetime"

  - id: sentinel-mem-subscribe-sem-desinscrever
    patterns:
      - pattern-either:
          - pattern: this.$OBS.subscribe(...)
          - pattern: this.$OBS.pipe(...).subscribe(...)
          - pattern: this.$X.$OBS.subscribe(...)
          - pattern: this.$X.$OBS.pipe(...).subscribe(...)
      - pattern-not-inside: |
          this.$X.$OBS.pipe(..., takeUntilDestroyed(...), ...).subscribe(...)
      - pattern-not-inside: |
          this.$X.$OBS.pipe(..., takeUntil(...), ...).subscribe(...)
      - pattern-not-inside: |
          this.$X.$OBS.pipe(..., take(...), ...).subscribe(...)
      - pattern-not-inside: |
          this.$X.$OBS.pipe(..., first(...), ...).subscribe(...)
      - pattern-not-inside: |
          $Y = this.$X.$OBS.subscribe(...)
      - pattern-not-inside: |
          this.$S.add(this.$X.$OBS.subscribe(...))
      - pattern-not-inside: |
          this.$OBS.pipe(..., takeUntilDestroyed(...), ...).subscribe(...)
      - pattern-not-inside: |
          this.$OBS.pipe(..., takeUntil(...), ...).subscribe(...)
      - pattern-not-inside: |
          this.$OBS.pipe(..., take(...), ...).subscribe(...)
      - pattern-not-inside: |
          this.$OBS.pipe(..., first(...), ...).subscribe(...)
      - pattern-not-inside: |
          $X = this.$OBS.subscribe(...)
      - pattern-not-inside: |
          this.$S.add(this.$OBS.subscribe(...))
      - metavariable-regex:
          metavariable: $OBS
          regex: '(?i)^.*(\$|obs|stream|subject|changes|events)$'
      - pattern-inside: |
          class $C { ... }
    message: >
      subscribe() em um Observable do componente sem forma de encerrar. Se ele não completa sozinho, a inscrição vive
      mais que o componente e vaza memória. Use takeUntilDestroyed(), o pipe async no template, ou guarde a
      Subscription e chame unsubscribe() em ngOnDestroy.
    severity: INFO
    languages: [typescript]
    paths:
      include: ["*.ts"]
      exclude: ["**/*.spec.ts", "**/node_modules/**"]
    metadata:
      category: performance
      cwe: "CWE-401: Missing Release of Memory after Effective Lifetime"
