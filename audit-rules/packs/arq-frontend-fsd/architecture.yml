# Feature-Sliced Design: app > pages > widgets > features > entities > shared.
# Uma camada só importa de camadas estritamente abaixo. Imports entre fatias da mesma camada e imports
# que furam o index.ts de uma fatia são pegos pelas convenções; ajuste os caminhos ao seu 'src'.
layers:
  - {name: app, paths: ["src/app/**"], packages: ["@/app/*", "~/app/*", "@/app", "~/app"]}
  - {name: pages, paths: ["src/pages/**"], packages: ["@/pages/*", "~/pages/*", "@/pages", "~/pages"]}
  - {name: widgets, paths: ["src/widgets/**"], packages: ["@/widgets/*", "~/widgets/*", "@/widgets", "~/widgets"]}
  - {name: features, paths: ["src/features/**"], packages: ["@/features/*", "~/features/*", "@/features", "~/features"]}
  - {name: entities, paths: ["src/entities/**"], packages: ["@/entities/*", "~/entities/*", "@/entities", "~/entities"]}
  - {name: shared, paths: ["src/shared/**"], packages: ["@/shared/*", "~/shared/*", "@/shared", "~/shared"]}
forbid:
  - {from: pages, to: app, severity: high, message: "Em FSD a camada 'pages' fica abaixo de 'app' e não pode importar dela. Suba o código para a camada certa ou injete por propriedade/slot."}
  - {from: widgets, to: app, severity: high, message: "Em FSD a camada 'widgets' fica abaixo de 'app' e não pode importar dela. Suba o código para a camada certa ou injete por propriedade/slot."}
  - {from: widgets, to: pages, severity: high, message: "Em FSD a camada 'widgets' fica abaixo de 'pages' e não pode importar dela. Suba o código para a camada certa ou injete por propriedade/slot."}
  - {from: features, to: app, severity: high, message: "Em FSD a camada 'features' fica abaixo de 'app' e não pode importar dela. Suba o código para a camada certa ou injete por propriedade/slot."}
  - {from: features, to: pages, severity: high, message: "Em FSD a camada 'features' fica abaixo de 'pages' e não pode importar dela. Suba o código para a camada certa ou injete por propriedade/slot."}
  - {from: features, to: widgets, severity: high, message: "Em FSD a camada 'features' fica abaixo de 'widgets' e não pode importar dela. Suba o código para a camada certa ou injete por propriedade/slot."}
  - {from: entities, to: app, severity: high, message: "Em FSD a camada 'entities' fica abaixo de 'app' e não pode importar dela. Suba o código para a camada certa ou injete por propriedade/slot."}
  - {from: entities, to: pages, severity: high, message: "Em FSD a camada 'entities' fica abaixo de 'pages' e não pode importar dela. Suba o código para a camada certa ou injete por propriedade/slot."}
  - {from: entities, to: widgets, severity: high, message: "Em FSD a camada 'entities' fica abaixo de 'widgets' e não pode importar dela. Suba o código para a camada certa ou injete por propriedade/slot."}
  - {from: entities, to: features, severity: high, message: "Em FSD a camada 'entities' fica abaixo de 'features' e não pode importar dela. Suba o código para a camada certa ou injete por propriedade/slot."}
  - {from: shared, to: app, severity: high, message: "Em FSD a camada 'shared' fica abaixo de 'app' e não pode importar dela. Suba o código para a camada certa ou injete por propriedade/slot."}
  - {from: shared, to: pages, severity: high, message: "Em FSD a camada 'shared' fica abaixo de 'pages' e não pode importar dela. Suba o código para a camada certa ou injete por propriedade/slot."}
  - {from: shared, to: widgets, severity: high, message: "Em FSD a camada 'shared' fica abaixo de 'widgets' e não pode importar dela. Suba o código para a camada certa ou injete por propriedade/slot."}
  - {from: shared, to: features, severity: high, message: "Em FSD a camada 'shared' fica abaixo de 'features' e não pode importar dela. Suba o código para a camada certa ou injete por propriedade/slot."}
  - {from: shared, to: entities, severity: high, message: "Em FSD a camada 'shared' fica abaixo de 'entities' e não pode importar dela. Suba o código para a camada certa ou injete por propriedade/slot."}
conventions:
  - id: fatia-sem-import-profundo
    title: "Import fura a API pública da fatia"
    files: ["src/**/*.ts", "src/**/*.tsx", "src/**/*.vue"]
    exclude: ["**/*.spec.ts", "**/*.test.ts", "**/*.test.tsx", "**/*.stories.tsx"]
    forbid: '(?:from\s+|import\(\s*|require\(\s*)[''"](?:@|~)/(?:pages|widgets|features|entities)/[^/''"]+/[^''"]+[''"]'
    severity: medium
    message: "Importe a fatia pelo index.ts (API pública), não por um arquivo interno. Assim a fatia pode mudar por dentro sem quebrar quem usa."
  - id: index-sem-export-estrela
    title: "API pública com export *"
    files: ["src/pages/*/index.ts", "src/widgets/*/index.ts", "src/features/*/index.ts", "src/entities/*/index.ts"]
    forbid: '^\s*export\s+\*\s+from'
    severity: low
    message: "Exporte nome a nome no index.ts. 'export *' expõe tudo e esconde o que de fato é a API da fatia."
  - id: shared-sem-regra-de-negocio
    title: "Regra de negócio em shared"
    files: ["src/shared/**/*.ts", "src/shared/**/*.tsx"]
    exclude: ["**/*.spec.ts", "**/*.test.ts"]
    forbid: '(?i)\b(?:class|function|const)\s+\w*(?:Pedido|Cliente|Fatura|Pagamento|Order|Customer|Invoice|Payment)\w*'
    severity: low
    message: "shared guarda só o que não sabe do negócio (UI base, utilitários, cliente HTTP). Mova a regra para entities ou features."
