# ruleid: sentinel-spring-actuator-exposto
management.endpoints.web.exposure.include=*
# ok: sentinel-spring-actuator-exposto
management.endpoints.web.exposure.include=health,info

# ruleid: sentinel-spring-h2-console
spring.h2.console.enabled=true
# ok: sentinel-spring-h2-console
spring.h2.console.enabled=false

# ruleid: sentinel-spring-senha-em-properties
spring.datasource.password=minhaSenha123
# ok: sentinel-spring-senha-em-properties
spring.datasource.password=${DB_PASSWORD}
# ok: sentinel-spring-senha-em-properties
spring.datasource.username=sentinel

# ruleid: sentinel-spring-ddl-auto-perigoso
spring.jpa.hibernate.ddl-auto=update
# ok: sentinel-spring-ddl-auto-perigoso
spring.jpa.hibernate.ddl-auto=validate

# ruleid: sentinel-spring-open-in-view
spring.jpa.open-in-view=true
# ok: sentinel-spring-open-in-view
spring.jpa.open-in-view=false

# ruleid: sentinel-spring-show-sql
spring.jpa.show-sql=true
