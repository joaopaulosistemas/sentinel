# SQL de migrations. O Squawk e o SQLFluff precisam de /opt/extras (conversor SARIF) e do SQLFluff no PATH, como a imagem Docker instala.
# Squawk: risco de lock e downtime no Postgres (índice sem CONCURRENTLY, mudança de tipo, NOT NULL, int em vez de bigint...).
- id: squawk
  name: "Squawk"
  category: quality
  applies-to: ["**/db/migration/**/*.sql", "**/db/migrations/**/*.sql", "**/migrations/**/*.sql", "**/db/changelog/**/*.sql", "**/liquibase/**/*.sql", "**/flyway/**/*.sql"]
  stdout: true
  command: [node, /opt/extras/sarif-extras.mjs, squawk, "{files}"]
  severity-map: {error: high, warning: medium}
  timeout-seconds: 300

# SQLFluff: estilo e boas práticas de SQL (dialeto Postgres por padrão; troque com SQLFLUFF_DIALECT).
- id: sqlfluff
  name: "SQLFluff"
  category: quality
  applies-to: ["**/*.sql"]
  stdout: true
  command: [node, /opt/extras/sarif-extras.mjs, sqlfluff, "{files}"]
  severity-map: {note: info, warning: low}
  timeout-seconds: 600
