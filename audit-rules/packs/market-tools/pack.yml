id: market-tools
name: "Analisadores de mercado (web, Docker e Kubernetes)"
version: 5.1.0
description: "Integra ferramentas conhecidas via SARIF: njsscan (JS/Node), Stylelint (CSS/SCSS), Checkstyle (Java), jscpd (código duplicado), Squawk e SQLFluff (SQL de migrations), Dependency-Cruiser (ciclos entre módulos TS/JS), Spectral (contrato OpenAPI/Swagger contra o guia REST), Checkov, Hadolint (Dockerfile), kube-linter e kube-score (Kubernetes). Cada uma só roda se estiver instalada e se o projeto tiver arquivos do tipo que ela entende."
author: Sentinel
languages: [java, javascript, typescript, css, scss, html, sql, dockerfile, kubernetes]
enabled-by-default: true
