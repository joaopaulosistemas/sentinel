id: padrao-google-java
name: "Padrão Google Java Style + SEI CERT + Sonar"
description: "Pacotes padrão mais o Google Java Style Guide (Checkstyle: nomes, formatação, imports, Javadoc) e as regras de robustez e segurança do SEI CERT e do Sonar (pacote java-cert-sonar). Os achados de estilo do Google saem com severidade baixa. Em sistema legado, adote aos poucos: 'checkstyle-google-*': {shadow: true} no perfil deixa os achados visíveis sem pesar no score."
packs: [core-security, core-iac, core-spring, core-persistencia, core-quality, core-frontend, market-tools, java-google-style, java-cert-sonar]
rules:
  # Em sombra por medida (docs/evolucao/precisao.md): 0 verdadeiros em 6 revisados cada, em scripts/CLI sem entrada externa.
  "eslint-regexp/no-super-linear-move": {shadow: true}   # precisao.md
  "eslint-security/detect-non-literal-fs-filename": {shadow: true}   # precisao.md
  # 1 verdadeiro em 9 revisados (cabeçalho de licença, pom.xml e arquivos gerados); volta a pesar quando a precisão subir.
  jscpd-codigo-duplicado: {shadow: true}   # precisao.md
  # 0 verdadeiros em 7 revisados: modelos EJS que geram código TypeScript (a saída não é HTML, então não há XSS)
  njsscan-ejs_ect_template: {shadow: true}   # precisao.md
  # Estilo do Google é recomendação de legibilidade, não defeito: severidade baixa. As regras CERT/Sonar mantêm a severidade própria.
  "checkstyle-google-*": {severity: low}
thresholds:
  max-function-lines: 50
  max-complexity: 10
  max-nesting: 4
