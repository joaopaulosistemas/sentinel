- name: java-catch-vazio
  rules:
    - "pmd-emptycatchblock"
    - "sentinel-java-catch-vazio"
  max-lines: 2

- name: java-string-igualdade
  rules:
    - "pmd-useequalstocomparestrings"
    - "sentinel-java-string-igualdade-literal"
  max-lines: 1

- name: ts-any-explicito
  rules:
    - "eslint-@typescript-eslint/no-explicit-any"
    - "sentinel-ts-any-explicito"
  max-lines: 1

- name: ts-var
  rules:
    - "eslint-no-var"
    - "sentinel-ts-var"
  max-lines: 1

- name: ts-igualdade-frouxa
  rules:
    - "eslint-eqeqeq"
    - "sentinel-ts-igualdade-frouxa"
  max-lines: 1

- name: ts-console-log
  rules:
    - "eslint-no-console"
    - "sentinel-ts-console-log"
  max-lines: 1

- name: java-retorna-null-colecao
  rules:
    - "pmd-returnemptycollectionratherthannull"
    - "sentinel-java-retorna-null-colecao"
  max-lines: 10

- name: java-catch-throwable
  rules:
    - "pmd-avoidcatchingthrowable"
    - "sentinel-java-catch-throwable"
  max-lines: 2

- name: java-system-exit
  rules:
    - "pmd-donotterminatevm"
    - "sentinel-system-exit"
  max-lines: 1

- name: ts-react-key-indice
  rules:
    - "eslint-react/no-array-index-key"
    - "sentinel-ts-react-key-indice"
  max-lines: 2

# A mesma função complexa aparecia no CleanCode (>10), no Checkstyle (>12) e no PMD; fica o achado do CleanCode,
# que é o que tem a orientação de correção do catálogo. A severidade final é a maior das duas.
- name: complexidade-ciclomatica
  prefer: CleanCode
  rules:
    - "sentinel-cc-complexidade"
    - "cyclomaticcomplexity"
  max-lines: 3
