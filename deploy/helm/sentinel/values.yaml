# Valores padrão do chart Sentinel. Sobrescreva com -f meus-valores.yaml ou --set.
api:
  image: sentinel-audit-api:12.91.0        # tag fixa (nunca :latest); publique a imagem no seu registry com esta tag
  replicas: 1                             # >1 exige o agendador desligado em todas menos uma réplica (ver README)
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpu: "2", memory: 3Gi }     # sem limite de CPU, as ferramentas externas de uma auditoria podem tomar o nó todo
  cloneVolumeSize: 5Gi
  env: {}                                 # variáveis extras (OSV_ENABLED, TRIVY_ENABLED, CLEANCODE_*, ...)

dashboard:
  image: sentinel-audit-dashboard:12.91.0   # idem; a imagem roda como usuário sem privilégios na porta 8080
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 250m, memory: 128Mi }

# Segredos. Prefira existingSecret (criado por você/External Secrets) a colocar valores aqui.
secrets:
  existingSecret: ""                      # Secret com as chaves: DB_PASSWORD, API_KEY, SECRETS_KEY
  dbPassword: ""
  apiKey: ""
  secretsKey: ""                          # cifra, no banco, os tokens e segredos cadastrados em cada sistema (vazio = usa a apiKey)

database:
  # internal: sobe um PostgreSQL simples (StatefulSet) — bom para teste; em produção use um banco gerenciado.
  internal: true
  url: ""                                 # jdbc:postgresql://host:5432/sentinel_audit (obrigatório se internal=false)
  user: sentinel_audit
  storage: 10Gi

# Pacotes de regras
packs:
  gitUrl: ""
  gitRef: main
  gitPath: ""
  dirs: ""
  disabled: ""
  allowTools: false                       # permite pacotes executarem ferramentas externas (risco: ver README)
  trustedToolPacks: "market-tools,java-google-style"   # pacotes embutidos cujas ferramentas (Checkov, Hadolint, Checkstyle...) rodam sem allowTools
  publicKey: ""                           # chave pública Ed25519 (Base64)
  requireSignature: false

ingress:
  enabled: false
  allowWithoutLogin: false                # só true se outra camada (VPN, proxy autenticador) já protege o acesso
  className: ""
  host: sentinel.exemplo.com
  tls: { enabled: false, secretName: "" }

securityContext:
  runAsNonRoot: true
