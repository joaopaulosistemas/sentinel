{{- if .Values.database.internal }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgres
spec:
  serviceName: {{ .Release.Name }}-postgres
  replicas: 1
  selector:
    matchLabels: { app: {{ .Release.Name }}-postgres }
  template:
    metadata:
      labels: { app: {{ .Release.Name }}-postgres }
    spec:
      containers:
        - name: postgres
          image: docker.io/postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - { name: POSTGRES_DB, value: sentinel_audit }
            - { name: POSTGRES_USER, value: {{ .Values.database.user | quote }} }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: {{ include "sentinel.secretName" . }}, key: DB_PASSWORD } } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", {{ .Values.database.user | quote }}, "-d", "sentinel_audit"] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: {{ .Values.database.storage | quote }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres
spec:
  selector: { app: {{ .Release.Name }}-postgres }
  ports:
    - { port: 5432, targetPort: 5432 }
{{- end }}
