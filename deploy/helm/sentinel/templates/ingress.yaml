{{- if .Values.ingress.enabled }}
{{- /* O proxy do dashboard injeta a API key: quem alcança o ingress usa a API como administrador. */}}
{{- if and (ne (toString (index .Values.api.env "QUARKUS_PROFILE" | default "")) "oidc") (not .Values.ingress.allowWithoutLogin) }}
{{- fail "ingress.enabled exige login: defina api.env.QUARKUS_PROFILE=oidc (imagem com -Poidc) ou, sabendo do risco, ingress.allowWithoutLogin=true" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-sentinel
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api/v1/webhooks
            pathType: Prefix
            backend: { service: { name: {{ .Release.Name }}-api, port: { number: 8080 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: {{ .Release.Name }}-dashboard, port: { number: 80 } } }
{{- end }}
