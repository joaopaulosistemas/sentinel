{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-sentinel
type: Opaque
stringData:
  DB_PASSWORD: {{ required "secrets.dbPassword é obrigatório (ou use secrets.existingSecret)" .Values.secrets.dbPassword | quote }}
  API_KEY: {{ .Values.secrets.apiKey | quote }}
  GIT_TOKEN: {{ .Values.secrets.gitToken | quote }}
  WEBHOOK_SECRET: {{ .Values.secrets.webhookSecret | quote }}
{{- end }}
