global:
  scrape_interval: 15s
  evaluation_interval: 15s
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
rule_files:
  - /etc/prometheus/alertas.yml
scrape_configs:
  - job_name: sentinel-api
    metrics_path: /q/metrics
    static_configs:
      - targets: ["audit-api:9000"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
