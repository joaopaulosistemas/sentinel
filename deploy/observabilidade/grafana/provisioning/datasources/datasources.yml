apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      # do trace para os logs dele: o Loki guarda o trace_id como metadado estruturado
      tracesToLogsV2:
        datasourceUid: loki
        customQuery: true
        query: '{service_name="sentinel-audit-api"} | trace_id="$${__trace.traceId}"'

