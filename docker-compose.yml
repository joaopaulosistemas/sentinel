# =============================================================
# Sentinel Audit Tool — ambiente completo (API + dashboard + PostgreSQL)
# =============================================================
#
# Uso:
#   cp .env.example .env        # defina POSTGRES_PASSWORD e API_KEY
#   docker compose up -d --build
#
# Rede corporativa com inspeção SSL: coloque o CA raiz da empresa (PEM, .crt)
# em audit-api/certs/ antes do build. Se precisar de proxy, defina HTTP_PROXY,
# HTTPS_PROXY e NO_PROXY no .env (são repassados como build args).
#
# Só o banco (para rodar a API com `mvn quarkus:dev`):
#   docker compose up -d postgres
#   export DB_URL=jdbc:postgresql://127.0.0.1:5433/sentinel_audit DB_PASSWORD=<POSTGRES_PASSWORD>
#
# Podman rootless no WSL2 isola a rede do host: para dev local use PostgreSQL nativo
# ou rode API e dashboard também pelo compose.
# =============================================================

services:

  postgres:
    image: docker.io/postgres:16-alpine
    container_name: sentinel-audit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sentinel_audit
      POSTGRES_USER: sentinel_audit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    ports:
      - "127.0.0.1:5433:5432"   # exposto só no localhost
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel_audit -d sentinel_audit"]
      interval: 10s
      timeout: 5s
      retries: 5

  audit-api:
    build:
      context: .                       # raiz: o módulo depende do pom pai
      dockerfile: audit-api/Dockerfile
      args:
        WITH_ESLINT: ${WITH_ESLINT:-true}   # Node 20 + ESLint + Stylelint (stack web)
        WITH_SEMGREP: ${WITH_SEMGREP:-true}
        WITH_TRIVY: ${WITH_TRIVY:-true}
        WITH_GITLEAKS: ${WITH_GITLEAKS:-true}
        WITH_PMD: ${WITH_PMD:-true}
        WITH_MARKET_TOOLS: ${WITH_MARKET_TOOLS:-true}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    container_name: sentinel-audit-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/sentinel_audit
      DB_USER: sentinel_audit
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      API_KEY: ${API_KEY:-}
      SECRETS_KEY: ${SECRETS_KEY:-}
      OSV_ENABLED: ${OSV_ENABLED:-true}
      OSV_URL: ${OSV_URL:-https://api.osv.dev}
      TRIVY_ENABLED: ${TRIVY_ENABLED:-true}
      TRIVY_SCANNERS: ${TRIVY_SCANNERS:-vuln,misconfig}
      SENTINEL_EVIDENCE_DIR: /evidence
      EVIDENCE_MIN_LINE_COVERAGE: ${EVIDENCE_MIN_LINE_COVERAGE:-60}
      GITLEAKS_ENABLED: ${GITLEAKS_ENABLED:-true}
      PMD_ENABLED: ${PMD_ENABLED:-true}
      ESLINT_ENABLED: ${ESLINT_ENABLED:-true}
      ESLINT_CONFIG: ${ESLINT_CONFIG:-/opt/eslint/eslint.config.mjs}
      CLEANCODE_ENABLED: ${CLEANCODE_ENABLED:-true}
      CLEANCODE_MAX_FUNCTION_LINES: ${CLEANCODE_MAX_FUNCTION_LINES:-50}
      CLEANCODE_MAX_PARAMETERS: ${CLEANCODE_MAX_PARAMETERS:-5}
      CLEANCODE_MAX_COMPLEXITY: ${CLEANCODE_MAX_COMPLEXITY:-10}
      CLEANCODE_MAX_NESTING: ${CLEANCODE_MAX_NESTING:-4}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      PACKS_DIRS: ${PACKS_DIRS:-}
      PACKS_GIT_URL: ${PACKS_GIT_URL:-}
      PACKS_GIT_REF: ${PACKS_GIT_REF:-main}
      PACKS_GIT_PATH: ${PACKS_GIT_PATH:-}
      PACKS_DISABLED: ${PACKS_DISABLED:-}
      PACKS_ALLOW_TOOLS: ${PACKS_ALLOW_TOOLS:-false}
      PACKS_TRUSTED_TOOL_PACKS: ${PACKS_TRUSTED_TOOL_PACKS:-market-tools}
      PACKS_PUBLIC_KEY: ${PACKS_PUBLIC_KEY:-}
      PACKS_REQUIRE_SIGNATURE: ${PACKS_REQUIRE_SIGNATURE:-false}
      PLAYGROUND_ENABLED: ${PLAYGROUND_ENABLED:-true}
      CLONE_DIR: /tmp/sentinel-audit-clones
      WATSONX_URL: ${WATSONX_URL:-}
      WATSONX_API_KEY: ${WATSONX_API_KEY:-}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - audit_clones:/tmp/sentinel-audit-clones
      # Chave que cifra os tokens cadastrados na tela quando SECRETS_KEY/API_KEY estão vazias. Faça backup junto com o banco.
      - audit_secrets:/var/lib/sentinel
      # Evidências offline: ./evidencias/<nome-do-sistema>/ (somente leitura). Veja docs/evidencias/README.md
      - ${EVIDENCE_HOST_DIR:-./evidencias}:/evidence:ro

  audit-dashboard:
    build:
      context: ./audit-dashboard
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    container_name: sentinel-audit-dashboard
    restart: unless-stopped
    depends_on:
      audit-api:
        condition: service_healthy
    environment:
      API_UPSTREAM: http://audit-api:8080
      API_KEY: ${API_KEY:-}
    ports:
      - "127.0.0.1:3000:80"

volumes:
  postgres_data:
    name: sentinel-audit-postgres-data
  audit_clones:
    name: sentinel-audit-clones
  audit_secrets:
    name: sentinel-audit-secrets