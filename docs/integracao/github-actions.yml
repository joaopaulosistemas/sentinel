# Modelo: auditoria do Sentinel em pull request (copie para .github/workflows/sentinel.yml do projeto auditado).
# Requer os segredos SENTINEL_API_URL e SENTINEL_API_KEY e o sistema já cadastrado no Sentinel (SENTINEL_SYSTEM_ID).
name: Sentinel

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  auditoria:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Baixar o CLI
        env:
          SENTINEL_API_URL: ${{ secrets.SENTINEL_API_URL }}
        run: curl -fsSL -o sentinel-cli.jar "$SENTINEL_API_URL/cli/sentinel-audit-cli.jar" || { echo "Publique o jar do CLI no seu repositório de artefatos e ajuste esta linha"; exit 1; }
      - name: Auditar (falha se piorar o código novo)
        env:
          # valores externos entram por variável de ambiente, nunca direto no script (evita injeção de comando)
          SENTINEL_API_URL: ${{ secrets.SENTINEL_API_URL }}
          SENTINEL_API_KEY: ${{ secrets.SENTINEL_API_KEY }}
          SENTINEL_SYSTEM_ID: ${{ vars.SENTINEL_SYSTEM_ID }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          java -jar sentinel-cli.jar \
            --api-url "$SENTINEL_API_URL" \
            --api-key "$SENTINEL_API_KEY" \
            --system-id "$SENTINEL_SYSTEM_ID" \
            --branch "$HEAD_REF" \
            --base-ref "origin/$BASE_REF" \
            --fail-on-new HIGH \
            --sarif sentinel.sarif --junit sentinel.xml --pr-comment sentinel-comentario.md
      - name: Publicar no Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sentinel.sarif
      - name: Comentar no PR
        if: always() && hashFiles('sentinel-comentario.md') != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: sentinel-comentario.md
